@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.pin-box{background:#161616;border:1px solid #2a2a2a;border-radius:20px;padding:32px 28px;width:min(360px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.8)}

@media(max-width:640px){

.pin-dot{width:16px;height:16px;border-radius:50%;background:#2a2a2a;border:2px solid #3a3a3a;transition:all .15s}
.pin-dot.filled{background:#7ab648;border-color:#7ab648;box-shadow:0 0 8px rgba(122,182,72,.5)}
.pin-dot.error{background:#ff4444;border-color:#ff4444}

@media(max-width:640px){

const hashPwd=(pwd)=>{
  let h=0;
  const salt="tea_login_2025_";
  const s=salt+pwd;
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return h.toString(36);
};

const hashPin=(pin)=>{
  let h=0;
  const salt="tea_sys_2025_";
  const s=salt+pin;
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return h.toString(36);
};

//  PIN MODAL COMPONENT
// ══════════════════════════════════════════════════════════════
function PinModal({authorizedUsers,lockout,onSuccess,onCancel,onUpdateLockout,title="ยืนยันตัวตน"}){
  const [pin,setPin]=useState("");
  const [error,setError]=useState("");
  const [shake,setShake]=useState(false);
  const MAX_ATTEMPTS=3;
  const LOCKOUT_MINUTES=5;

  const now=Date.now();
  const isLocked=lockout.lockedUntil&&now<lockout.lockedUntil;
  const remainSec=isLocked?Math.ceil((lockout.lockedUntil-now)/1000):0;
  const [tick,setTick]=useState(0);
  useEffect(()=>{if(!isLocked)return;const t=setInterval(()=>setTick(x=>x+1),1000);return()=>clearInterval(t);},[isLocked]);

  const handleKey=(k)=>{
    if(isLocked)return;
    if(pin.length>=6)return;
    const next=pin+k;
    setPin(next);
    setError("");
    if(next.length===6) checkPin(next);
  };

  const handleDel=()=>{setPin(p=>p.slice(0,-1));setError("");};

  const checkPin=(p)=>{
    if(!authorizedUsers.length){setError("ยังไม่มีผู้มีอำนาจในระบบ กรุณาเพิ่มในเมนู ⚙️ Settings");setPin("");return;}
    const user=authorizedUsers.find(u=>u.pin===hashPin(p));
    if(user){
      onUpdateLockout({attempts:0,lockedUntil:null});
      onSuccess(user);
    } else {
      const attempts=(lockout.attempts||0)+1;
      if(attempts>=MAX_ATTEMPTS){
        const lockedUntil=Date.now()+LOCKOUT_MINUTES*60*1000;
        onUpdateLockout({attempts:0,lockedUntil});
        setError(`กรอก PIN ผิด ${MAX_ATTEMPTS} ครั้ง — ล็อก ${LOCKOUT_MINUTES} นาที`);
      } else {
        onUpdateLockout({attempts,lockedUntil:null});
        setError(`PIN ไม่ถูกต้อง (ความพยายามที่ ${attempts}/${MAX_ATTEMPTS})`);
      }
      setShake(true);setTimeout(()=>setShake(false),500);
      setPin("");
    }
  };

  const remainMin=Math.ceil(remainSec/60);

  return(
    <div className="pin-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="pin-box">
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:32,marginBottom:8}}>🔐</div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648",marginBottom:4}}>{title}</div>
          <div style={{fontSize:12,color:"#666"}}>กรอก PIN 6 หลักของผู้มีอำนาจอนุมัติ</div>
        </div>

        {/* PIN dots */}
        <div className={shake?"shake":""} style={{display:"flex",gap:12,justifyContent:"center",marginBottom:20}}>
          {Array.from({length:6}).map((_,i)=>(
            <div key={i} className={`pin-dot ${i<pin.length?(error?"error":"filled"):""}`}/>
          ))}
        </div>

        {isLocked?(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:36,marginBottom:8}}>🔒</div>
            <div style={{color:"#ff6b6b",fontWeight:700,fontSize:14,marginBottom:6}}>ระบบถูกล็อกชั่วคราว</div>
            <div style={{color:"#888",fontSize:13}}>กรุณารอ <b style={{color:"#ff9800",fontFamily:"monospace"}}>{Math.ceil((lockout.lockedUntil-Date.now())/1000)}</b> วินาที</div>
          </div>
        ):(
          <>
            {error&&<div style={{textAlign:"center",color:"#ff6b6b",fontSize:12,marginBottom:14,background:"#1f0808",border:"1px solid #ff444433",borderRadius:8,padding:"8px"}}>{error}</div>}
            {/* Keypad */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=>(
                k===""?<div key={i}/>:
                <button key={i} className={`pin-key ${k==="⌫"?"del":""}`}
                  onClick={k==="⌫"?handleDel:()=>handleKey(String(k))}>
                  {k}
                </button>
              ))}
            </div>
          </>
        )}

        <button onClick={onCancel} style={{width:"100%",background:"#1a1a1a",border:"1px solid #2a2a2a",color:"#888",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer"}}>ยกเลิก</button>
      </div>
    </div>
  );
}

//  LOGIN PAGE
// ══════════════════════════════════════════════════════════════
function LoginPage({systemUsers,onLogin}){
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [showPwd,setShowPwd]=useState(false);
  const [loading,setLoading]=useState(false);

  const handleLogin=()=>{
    if(!username.trim()||!password.trim()){setError("กรุณากรอก Username และ Password");return;}
    setLoading(true);
    setTimeout(()=>{
      const user=systemUsers.find(u=>u.username===username.trim()&&u.password===hashPwd(password));
      if(user){setError("");onLogin(user);}
      else{setError("Username หรือ Password ไม่ถูกต้อง");setLoading(false);}
    },600);
  };

  return(
    <div style={{minHeight:"100vh",background:"#0d0d0d",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:400}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:56,marginBottom:10}}>🍵</div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:22,fontWeight:800,color:"#7ab648"}}>ระบบตัดสต็อกการผลิตชา</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"#4a6a38",marginTop:4}}>Tea Production Stock System</div>
        </div>

        {/* Login card */}
        <div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:18,padding:"32px 28px",boxShadow:"0 20px 60px rgba(0,0,0,.6)"}}>
          <div style={{fontSize:14,fontWeight:800,color:"#7ab648",marginBottom:20}}>🔐 เข้าสู่ระบบ</div>

          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:10,fontWeight:700,color:"#7ab648",marginBottom:6,textTransform:"uppercase",letterSpacing:".7px"}}>Username</label>
            <input style={{...SI,padding:"10px 14px",fontSize:14}} value={username} onChange={e=>{setUsername(e.target.value);setError("");}}
              placeholder="กรอก Username" autoFocus onKeyDown={e=>e.key==="Enter"&&handleLogin()}/>
          </div>

          <div style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:10,fontWeight:700,color:"#7ab648",marginBottom:6,textTransform:"uppercase",letterSpacing:".7px"}}>Password</label>
            <div style={{position:"relative"}}>
              <input style={{...SI,padding:"10px 14px",fontSize:14,paddingRight:44}} type={showPwd?"text":"password"}
                value={password} onChange={e=>{setPassword(e.target.value);setError("");}}
                placeholder="กรอก Password" onKeyDown={e=>e.key==="Enter"&&handleLogin()}/>
              <button onClick={()=>setShowPwd(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#666",cursor:"pointer",fontSize:16,padding:4}}>
                {showPwd?"🙈":"👁️"}
              </button>
            </div>
          </div>

          {error&&<div style={{background:"#1f0808",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:9,padding:"9px 14px",fontSize:13,marginBottom:14}}>⚠️ {error}</div>}

          <button onClick={handleLogin} disabled={loading} style={{...BPS,width:"100%",padding:"12px",fontSize:14,opacity:loading?.7:1}}>
            {loading?"⏳ กำลังตรวจสอบ...":"เข้าสู่ระบบ →"}
          </button>

          <div style={{textAlign:"center",marginTop:16,fontSize:11,color:"#444"}}>
            ติดต่อ Admin เพื่อขอบัญชีผู้ใช้งาน
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("produce");
  const [state,setState]=useState({...DEF});
  const [loading,setLoading]=useState(true);
  const [saveStatus,setSaveStatus]=useState("");
  const [syncStatus,setSyncStatus]=useState(""); // "syncing" | "synced" | "error"
  const [lastSync,setLastSync]=useState(null);
  const [currentUser,setCurrentUser]=useState(()=>{
    try{const u=sessionStorage.getItem("tea_user");return u?JSON.parse(u):null;}catch{return null;}
  });

  const handleLogin=(user)=>{
    sessionStorage.setItem("tea_user",JSON.stringify(user));
    setCurrentUser(user);
  };
  const handleLogout=()=>{
    sessionStorage.removeItem("tea_user");
    setCurrentUser(null);
  };

  // ฟังก์ชัน sync จาก Google Sheets
  const syncFromSheets=useCallback((showStatus=true)=>{
    if(showStatus)setSyncStatus("syncing");
    return fetch(SCRIPT_URL)
      .then(r=>r.json())
      .then(s=>{
        if(s&&Object.keys(s).length>0){
          setState({...DEF,...s,batchCounter:s.batchCounter||1,authorizedUsers:s.authorizedUsers||[],pinLockout:s.pinLockout||{attempts:0,lockedUntil:null},systemUsers:s.systemUsers||DEF.systemUsers});
        }
        setLastSync(new Date());
        if(showStatus){setSyncStatus("synced");setTimeout(()=>setSyncStatus(""),3000);}
        return s;
      })
      .catch(()=>{
        if(showStatus){setSyncStatus("error");setTimeout(()=>setSyncStatus(""),4000);}
      });
  },[]);

  // โหลดข้อมูลจาก Google Sheets ตอนเริ่ม
  useEffect(()=>{
    syncFromSheets(false).finally(()=>setLoading(false));
  },[]);

  // Auto-sync ทุก 5 นาที
  useEffect(()=>{
    const interval=setInterval(()=>syncFromSheets(false),5*60*1000);
    return()=>clearInterval(interval);
  },[syncFromSheets]);

  const upd=useCallback(patch=>setState(prev=>{
    const n={...prev,...patch};
    setSaveStatus("saving");
    save(n).then(()=>setSaveStatus("saved")).catch(()=>setSaveStatus("error"));
    setTimeout(()=>setSaveStatus(""),2500);
    return n;
  }),[]);
  const {ingredients,packaging,recipes,history,stockLog,batchCounter,authorizedUsers,pinLockout,systemUsers}=state;

  const onProduce=(batch)=>{
    const no=batchCounter||1;
    const logs=[];
    const newIng=ingredients.map(i=>{
      const d=batch.deductions.find(x=>x.type==="ing"&&x.id===i.id);
      if(d){const after=Math.max(0,i.qty-d.amount);logs.push({batchNo:no,date:todayStr(),time:timeStr(),itemId:i.id,itemName:i.name,itemType:"ing",before:i.qty,change:-d.amount,after,reason:`Batch #${String(no).padStart(4,"0")} ผลิต: ${batch.recipeName}`});return{...i,qty:after};}
      return i;
    });
    const newPack=packaging.map(p=>{
      const d=batch.deductions.find(x=>x.type==="pack"&&x.id===p.id);
      if(d){const after=Math.max(0,p.qty-d.amount);logs.push({batchNo:no,date:todayStr(),time:timeStr(),itemId:p.id,itemName:p.name,itemType:"pack",before:p.qty,change:-d.amount,after,reason:`Batch #${String(no).padStart(4,"0")} ผลิต: ${batch.recipeName}`});return{...p,qty:after};}
      return p;
    });
    upd({ingredients:newIng,packaging:newPack,history:[{...batch,batchNo:no,date:todayStr(),time:timeStr()},...history],stockLog:[...logs,...(stockLog||[])],batchCounter:no+1});
    setTab("history");
  };

  const onStockAdjust=(type,itemId,itemName,before,after,by,reason)=>{
    const log={date:todayStr(),time:timeStr(),itemId,itemName,itemType:type,before,change:after-before,after,reason,adjustedBy:by};
    if(type==="ing")upd({stockLog:[log,...(stockLog||[])],ingredients:ingredients.map(i=>i.id===itemId?{...i,qty:after}:i)});
    else upd({stockLog:[log,...(stockLog||[])],packaging:packaging.map(p=>p.id===itemId?{...p,qty:after}:p)});
  };

  const onManualStockEdit=(type,itemId,itemName,before,after,editedBy,reason,isReceive)=>{
    const by=editedBy||currentUser?.displayName||"ไม่ระบุ";
    const log={date:todayStr(),time:timeStr(),itemId,itemName,itemType:type,before,change:after-before,after,reason:reason||`แก้ไขสต็อกด้วยตนเอง`,adjustedBy:by,isReceive:!!isReceive};
    upd({stockLog:[log,...(stockLog||[])]});
  };

  const alertItems=[...ingredients,...packaging].filter(i=>itemStatus(i).level>0);
  const isAdmin=currentUser?.role==="admin";

  // ถ้ายังไม่ได้ login → แสดงหน้า Login
  if(!currentUser&&!loading){
    return <LoginPage systemUsers={systemUsers||DEF.systemUsers} onLogin={handleLogin}/>;
  }

  const TABS=[
    {id:"produce",icon:"⚙️",label:"บันทึกผลิต"},
    {id:"stock",icon:"📦",label:"จัดการสต็อก"},
    {id:"recipes",icon:"🍵",label:"สูตรชา"},
    {id:"history",icon:"📋",label:"ประวัติ"},
    {id:"analytics",icon:"📊",label:"วิเคราะห์"},
    ...(isAdmin?[{id:"settings",icon:"⚙️",label:"Settings"}]:[]),
  ];

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#0d1f08,#091305)",borderBottom:"1px solid #1e3a10",padding:"0 12px",height:52,display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
        <span style={{fontSize:24}}>🍵</span>
        <div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648"}}>ระบบตัดสต็อกการผลิตชา</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#4a6a38",display:"none"}} className="r-hide">Tea Production Stock System</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          {alertItems.length>0&&<div style={{background:"#3a1a00",border:"1px solid #ff980066",color:"#ff9800",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,animation:"pulse 2s infinite"}}>⚠️ แจ้งเตือน {alertItems.length} รายการ</div>}
          <div style={{background:"#1a2e10",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:20,padding:"3px 12px",fontSize:11,fontFamily:"monospace"}}>Batch #{String(batchCounter||1).padStart(4,"0")}</div>
          {/* Sync button */}
          <button onClick={()=>syncFromSheets(true)} title="ดึงข้อมูลล่าสุดจาก Google Sheets" style={{
            background:syncStatus==="syncing"?"#1a1a00":syncStatus==="synced"?"#0a1f06":syncStatus==="error"?"#1f0808":"#1a1a1a",
            border:`1px solid ${syncStatus==="syncing"?"#ff980066":syncStatus==="synced"?"#7ab64866":syncStatus==="error"?"#ff444466":"#333"}`,
            color:syncStatus==="syncing"?"#ff9800":syncStatus==="synced"?"#7ab648":syncStatus==="error"?"#ff6b6b":"#666",
            borderRadius:20,padding:"3px 12px",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",gap:5,transition:"all .3s",whiteSpace:"nowrap"}}>
            <span style={{display:"inline-block",animation:syncStatus==="syncing"?"spin 1s linear infinite":"none"}}>🔄</span>
            <span className="r-hide">{syncStatus==="syncing"?"กำลัง Sync...":syncStatus==="synced"?"Synced ✓":syncStatus==="error"?"Sync ไม่สำเร็จ":lastSync?`Sync ${lastSync.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}`:"Sync"}</span>
          </button>
          {currentUser&&(
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:20,padding:"4px 12px",display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:13}}>{currentUser.role==="admin"?"👑":"👤"}</span>
                <span style={{fontSize:12,color:"#ddd",fontWeight:600}}>{currentUser.displayName}</span>
                {currentUser.role==="admin"&&<span style={{fontSize:10,color:"#7ab648",background:"#1d3a10",padding:"1px 6px",borderRadius:4,border:"1px solid #7ab64833"}}>Admin</span>}
              </div>
              <button onClick={handleLogout} style={{background:"#1f0808",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>ออกจากระบบ</button>
            </div>
          )}
        </div>
      </div>
      <div style={{background:"#111",borderBottom:"1px solid #1e1e1e",display:"flex",padding:"0 4px",flexShrink:0,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 10px",background:tab===t.id?"#0f1f08":"none",border:"none",
            borderBottom:tab===t.id?"2px solid #7ab648":"2px solid transparent",
            color:tab===t.id?"#7ab648":"#666",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s",whiteSpace:"nowrap",position:"relative"}}>
            {t.id==="settings"?"🔑":t.icon} {t.label}
            {t.id==="stock"&&alertItems.length>0&&<span style={{position:"absolute",top:8,right:4,width:7,height:7,background:"#ff9800",borderRadius:"50%"}}/>}
          </button>
        ))}
      </div>
      {/* Save status */}
      {saveStatus&&(
        <div style={{position:"fixed",bottom:20,right:20,zIndex:999,padding:"10px 18px",borderRadius:10,fontSize:13,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.5)",
          background:saveStatus==="saved"?"#0e1f08":saveStatus==="error"?"#1f0808":"#1a1a00",
          color:saveStatus==="saved"?"#7ab648":saveStatus==="error"?"#ff6b6b":"#ff9800",
          border:`1px solid ${saveStatus==="saved"?"#7ab64844":saveStatus==="error"?"#ff444433":"#ff980033"}`}}>
          {saveStatus==="saving"?"💾 กำลังบันทึก...":saveStatus==="saved"?"✅ บันทึกแล้ว":saveStatus==="error"?"❌ บันทึกไม่สำเร็จ — ตรวจสอบอินเตอร์เน็ต":""}
        </div>
      )}
      {/* Loading overlay */}
      {loading&&(
        <div style={{position:"fixed",inset:0,background:"rgba(13,13,13,.95)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:2000}}>
          <div style={{fontSize:52,marginBottom:16}}>🍵</div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:18,fontWeight:800,color:"#7ab648",marginBottom:8}}>กำลังโหลดข้อมูล...</div>
          <div style={{fontSize:12,color:"#555"}}>เชื่อมต่อ Google Sheets</div>
          <div style={{marginTop:20,width:200,height:3,background:"#1e1e1e",borderRadius:2,overflow:"hidden"}}>
            <div style={{height:"100%",background:"linear-gradient(90deg,#4a8020,#7ab648)",borderRadius:2,animation:"slideLoad 1.5s ease infinite"}}/>
          </div>
        </div>
      )}
      <div style={{flex:1,overflowY:"auto",padding:"12px",paddingBottom:"env(safe-area-inset-bottom, 12px)",maxWidth:1100,width:"100%",margin:"0 auto"}}>
        {tab==="produce"&&<ProducePage ingredients={ingredients} packaging={packaging} recipes={recipes} onProduce={onProduce} batchCounter={batchCounter||1} currentUser={currentUser}/>}
        {tab==="stock"&&<StockPage ingredients={ingredients} packaging={packaging} onUpdateIng={v=>upd({ingredients:v})} onUpdatePack={v=>upd({packaging:v})} stockLog={stockLog||[]} onManualEdit={onManualStockEdit} currentUser={currentUser} recipes={recipes} onUpdateRecipes={v=>upd({recipes:v})}/>}
        {tab==="recipes"&&<RecipesPage recipes={recipes} ingredients={ingredients} packaging={packaging} onUpdate={v=>upd({recipes:v})}/>}
        {tab==="history"&&<HistoryPage history={history} ingredients={ingredients} packaging={packaging}
          onUpdate={v=>upd({history:v})} onStockAdjust={onStockAdjust}
          authorizedUsers={authorizedUsers} pinLockout={pinLockout}
          onUpdateLockout={v=>upd({pinLockout:v})} currentUser={currentUser}/>}
        {tab==="analytics"&&<AnalyticsPage history={history} ingredients={ingredients} packaging={packaging} stockLog={stockLog||[]} recipes={recipes}/>}
        {tab==="settings"&&isAdmin&&<SettingsPage authorizedUsers={authorizedUsers} onUpdate={v=>upd({authorizedUsers:v})} pinLockout={pinLockout} onUpdateLockout={v=>upd({pinLockout:v})} systemUsers={systemUsers||DEF.systemUsers} onUpdateUsers={v=>upd({systemUsers:v})}/>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ANALYTICS PAGE
// ══════════════════════════════════════════════════════════════
function AnalyticsPage({history,ingredients,packaging,stockLog,recipes}){
  const [period,setPeriod]=useState("month");
  const [forecastRecipeId,setForecastRecipeId]=useState("__all__");

  // คำนวณช่วงเวลาจาก history
  const parseDate=(d)=>{
    if(!d)return null;
    // format: dd/mm/yyyy (th)
    const parts=d.split("/");
    if(parts.length!==3)return null;
    const day=parseInt(parts[0]),mon=parseInt(parts[1]),year=parseInt(parts[2]);
    // year อาจเป็น พ.ศ. ถ้า > 2500
    const adYear=year>2500?year-543:year;
    return new Date(adYear,mon-1,day);
  };

  const sortedHistory=useMemo(()=>[...history].sort((a,b)=>{
    const da=parseDate(a.date),db=parseDate(b.date);
    return (da||0)-(db||0);
  }),[history]);

  const firstDate=useMemo(()=>parseDate(sortedHistory[0]?.date),[sortedHistory]);
  const lastDate=useMemo(()=>parseDate(sortedHistory[sortedHistory.length-1]?.date),[sortedHistory]);

  const totalDays=useMemo(()=>{
    if(!firstDate||!lastDate)return 1;
    const d=Math.round((lastDate-firstDate)/(1000*60*60*24));
    return Math.max(d,1);
  },[firstDate,lastDate]);

  // ใช้ขั้นต่ำ 30 วันเป็นฐานคำนวณ เพื่อไม่ให้ตัวเลขพุ่งสูงเกินจริงเมื่อข้อมูลน้อย
  const calcDays=Math.max(totalDays,30);
  const hasEnoughData=totalDays>=14; // มีข้อมูลอย่างน้อย 2 สัปดาห์ถึงจะแม่น

  const periodLabel={day:"วัน",week:"สัปดาห์",month:"เดือน"};
  const periodDays={day:1,week:7,month:30};
  const pDays=periodDays[period];

  // รวมการใช้ต่อรายการ
  const usageMap=useMemo(()=>{
    const map={};
    history.forEach(h=>{
      (h.deductions||[]).forEach(d=>{
        if(!map[d.id])map[d.id]={id:d.id,name:d.name,unit:d.unit,type:d.type,totalUsed:0};
        map[d.id].totalUsed+=d.amount||0;
      });
    });
    return map;
  },[history]);

  // usageMap กรองตาม recipe สำหรับ forecast
  const filteredHistory=useMemo(()=>forecastRecipeId==="__all__"?history:history.filter(h=>h.recipeId===forecastRecipeId),[history,forecastRecipeId]);
  const filteredBatchCount=filteredHistory.length||1;
  const filteredDays=useMemo(()=>{
    if(filteredHistory.length<2)return totalDays;
    const dates=filteredHistory.map(h=>parseDate(h.date)).filter(Boolean).sort((a,b)=>a-b);
    return Math.max(Math.round((dates[dates.length-1]-dates[0])/(1000*60*60*24)),1);
  },[filteredHistory,totalDays]);
  const forecastUsageMap=useMemo(()=>{
    const map={};
    filteredHistory.forEach(h=>{
      (h.deductions||[]).forEach(d=>{
        if(!map[d.id])map[d.id]={id:d.id,name:d.name,unit:d.unit,type:d.type,totalUsed:0};
        map[d.id].totalUsed+=d.amount||0;
      });
    });
    return map;
  },[filteredHistory]);

  // usage per period
  const usagePerPeriod=(totalUsed)=>calcDays>0?(totalUsed/calcDays)*pDays:0;

  // Forecast: จากสต็อกปัจจุบัน + อัตราการใช้ต่อ period → เหลือกี่ period
  const getForecast=(item)=>{
    const u=forecastUsageMap[item.id];
    if(!u||u.totalUsed===0)return null;
    const ratePerDay=u.totalUsed/Math.max(filteredDays,30);
    if(ratePerDay===0)return null;
    const daysLeft=item.qty/ratePerDay;
    return{daysLeft,weeksLeft:daysLeft/7,monthsLeft:daysLeft/30};
  };

  // Forecast ต่อ batch
  const getForecastBatches=(item)=>{
    const u=forecastUsageMap[item.id];
    if(!u||u.totalUsed===0)return null;
    const perBatch=u.totalUsed/filteredBatchCount;
    return Math.floor(item.qty/perBatch);
  };

  const allItems=[...ingredients,...packaging];
  const hasData=history.length>0;
  const batchCount=history.length||1;

  const periodBar=(val,max)=>{
    const pct=max>0?Math.min(100,(val/max)*100):0;
    const color=pct>80?"#ff4444":pct>50?"#ff9800":"#7ab648";
    return(
      <div style={{background:"#1a1a1a",borderRadius:4,height:6,width:"100%",overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:4,transition:"width .5s"}}/>
      </div>
    );
  };

  const maxUsage=Math.max(...allItems.map(i=>{const u=usageMap[i.id];return u?usagePerPeriod(u.totalUsed):0;}),1);

  return(<div className="fu">
    {!hasData&&(
      <Card><div style={{textAlign:"center",padding:60,color:"#555"}}>
        <div style={{fontSize:44,marginBottom:12}}>📊</div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:6,color:"#888"}}>ยังไม่มีข้อมูลเพียงพอ</div>
        <div style={{fontSize:13}}>ต้องมีประวัติการผลิตอย่างน้อย 1 Batch ก่อนครับ</div>
      </div></Card>
    )}

    {hasData&&(<>
      {/* Header stats */}
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {l:"ข้อมูลจาก",v:history.length,u:"Batch",c:"#7ab648"},
          {l:"ระยะเวลา",v:totalDays,u:"วัน",c:"#3db8e0"},
          {l:"เริ่มตั้งแต่",v:sortedHistory[0]?.date||"-",u:"",c:"#e09b3d"},
          {l:"ล่าสุด",v:sortedHistory[sortedHistory.length-1]?.date||"-",u:"",c:"#e09b3d"},
        ].map((s,i)=>(
          <div key={i} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"10px 16px",flex:"1 1 120px"}}>
            <div style={{fontSize:10,color:"#666",marginBottom:3,textTransform:"uppercase",letterSpacing:".5px"}}>{s.l}</div>
            <div style={{fontFamily:"monospace",fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:11,color:"#555"}}>{s.u}</div>
          </div>
        ))}
      </div>

      {/* Data quality warning */}
      {!hasEnoughData&&(
        <div style={{background:"#1f1200",border:"1px solid #ff980044",borderRadius:10,padding:"10px 16px",marginBottom:12,fontSize:12,color:"#ff9800"}}>
          ⚠️ <b>ข้อมูลยังน้อยเกินไป</b> — มีแค่ <b>{totalDays} วัน</b> ({history.length} Batch) ตัวเลขอัตราการใช้จะแม่นยำขึ้นเมื่อมีข้อมูลอย่างน้อย <b>14 วัน</b> ขึ้นไป · ตอนนี้ระบบใช้ <b>30 วัน</b> เป็นฐานคำนวณแทน
        </div>
      )}

      {/* Period selector */}
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <CT style={{margin:0}}>📈 อัตราการใช้</CT>
          <div style={{display:"flex",gap:6,marginLeft:"auto"}}>
            {["day","week","month"].map(p=>(
              <button key={p} onClick={()=>setPeriod(p)} style={{
                padding:"6px 16px",borderRadius:8,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",
                background:period===p?"#7ab648":"#1e1e1e",color:period===p?"#fff":"#888",transition:"all .2s"}}>
                ต่อ{periodLabel[p]}
              </button>
            ))}
          </div>
        </div>
      </Card>

      {/* Usage table — Ingredients */}
      <Card>
        <CT>🌿 วัตถุดิบ — อัตราการใช้ต่อ{periodLabel[period]}</CT>
        <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>
              {["รายการ","ใช้ไปทั้งหมด","เฉลี่ย/Batch",`เฉลี่ยต่อ${periodLabel[period]}`,"กราฟ","สต็อกเหลือ","ผลิตได้อีก"].map(h=><TH key={h}>{h}</TH>)}
            </tr></thead>
            <tbody>
              {ingredients.map((item,i)=>{
                const u=usageMap[item.id];
                const rate=u?usagePerPeriod(u.totalUsed):0;
                const perBatch=u?u.totalUsed/batchCount:0;
                const bLeft=getForecastBatches(item);
                const fc=getForecast(item);
                const daysLeft=fc?.daysLeft||0;
                const urgentColor=daysLeft>0&&daysLeft<30?"#ff4444":daysLeft<60?"#ff9800":"#7ab648";
                return(<tr key={item.id} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                  <td style={TD}><span style={{color:"#7ab648"}}>🌿</span> {item.name}</td>
                  <td style={{...TD,fontFamily:"monospace",color:"#aaa"}}>{u?fmt(u.totalUsed,0):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,fontFamily:"monospace",color:"#aaa"}}>{u?fmt(perBatch,1):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:"#7ab648"}}>{u?fmt(rate,1):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,minWidth:100}}>{periodBar(rate,maxUsage)}</td>
                  <td style={{...TD,fontFamily:"monospace"}}>{fmt(item.qty,0)} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={TD}>
                    {bLeft!==null?(
                      <div>
                        <span style={{fontFamily:"monospace",fontWeight:800,color:urgentColor,fontSize:14}}>{bLeft} Batch</span>
                        {fc&&<div style={{fontSize:11,color:"#666",marginTop:2}}>≈ {Math.round(fc.daysLeft)} วัน / {fmt(fc.monthsLeft,1)} เดือน</div>}
                      </div>
                    ):<span style={{color:"#555",fontSize:12}}>ไม่มีข้อมูล</span>}
                  </td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Usage table — Packaging */}
      <Card>
        <CT>📦 บรรจุภัณฑ์ — อัตราการใช้ต่อ{periodLabel[period]}</CT>
        <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>
              {["รายการ","ใช้ไปทั้งหมด","เฉลี่ย/Batch",`เฉลี่ยต่อ${periodLabel[period]}`,"กราฟ","สต็อกเหลือ","ผลิตได้อีก"].map(h=><TH key={h} style={{color:"#3db8e0"}}>{h}</TH>)}
            </tr></thead>
            <tbody>
              {packaging.map((item,i)=>{
                const u=usageMap[item.id];
                const rate=u?usagePerPeriod(u.totalUsed):0;
                const perBatch=u?u.totalUsed/batchCount:0;
                const bLeft=getForecastBatches(item);
                const fc=getForecast(item);
                const daysLeft=fc?.daysLeft||0;
                const urgentColor=daysLeft>0&&daysLeft<30?"#ff4444":daysLeft<60?"#ff9800":"#3db8e0";
                return(<tr key={item.id} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                  <td style={TD}><span style={{color:"#3db8e0"}}>📦</span> {item.name}</td>
                  <td style={{...TD,fontFamily:"monospace",color:"#aaa"}}>{u?fmt(u.totalUsed,0):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,fontFamily:"monospace",color:"#aaa"}}>{u?fmt(perBatch,1):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:"#3db8e0"}}>{u?fmt(rate,1):"-"} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={{...TD,minWidth:100}}>{periodBar(rate,maxUsage)}</td>
                  <td style={{...TD,fontFamily:"monospace"}}>{fmt(item.qty,0)} <span style={{color:"#555",fontSize:11}}>{item.unit}</span></td>
                  <td style={TD}>
                    {bLeft!==null?(
                      <div>
                        <span style={{fontFamily:"monospace",fontWeight:800,color:urgentColor,fontSize:14}}>{bLeft} Batch</span>
                        {fc&&<div style={{fontSize:11,color:"#666",marginTop:2}}>≈ {Math.round(fc.daysLeft)} วัน / {fmt(fc.monthsLeft,1)} เดือน</div>}
                      </div>
                    ):<span style={{color:"#555",fontSize:12}}>ไม่มีข้อมูล</span>}
                  </td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Forecast card — bottleneck */}
      <Card style={{border:"1px solid #7ab64833"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:14}}>
          <CT style={{margin:0}}>🔮 Forecast — คาดการณ์ระยะเวลาผลิต</CT>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:11,color:"#666"}}>วิเคราะห์สำหรับ:</span>
            <select value={forecastRecipeId} onChange={e=>setForecastRecipeId(e.target.value)}
              style={{...SI,padding:"5px 10px",fontSize:12,width:"auto",color:"#7ab648",border:"1px solid #7ab64866",background:"#0f1f08"}}>
              <option value="__all__">🍵 ทุกสูตร (รวม)</option>
              {(recipes||[]).map(r=><option key={r.id} value={r.id}>🍵 {r.name}</option>)}
            </select>
          </div>
        </div>
        {forecastRecipeId!=="__all__"&&(
          <div style={{fontSize:12,background:"#1a2a10",border:"1px solid #7ab64833",borderRadius:8,padding:"8px 12px",marginBottom:12,color:"#7ab648"}}>
            📊 คำนวณจาก <b>{filteredBatchCount}</b> Batch ของสูตร <b>{(recipes||[]).find(r=>r.id===forecastRecipeId)?.name}</b>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
          {allItems.map(item=>{
            const bLeft=getForecastBatches(item);
            const fc=getForecast(item);
            if(bLeft===null)return null;
            const urgent=bLeft<10;const warn=bLeft<30;
            const color=urgent?"#ff4444":warn?"#ff9800":"#7ab648";
            const bg=urgent?"#1f0808":warn?"#1f1200":"#0a1f06";
            const border=urgent?"#ff444433":warn?"#ff980033":"#7ab64833";
            return(
              <div key={item.id} style={{background:bg,border:`1px solid ${border}`,borderRadius:12,padding:"14px"}}>
                <div style={{fontSize:11,color:"#666",marginBottom:4}}>{item.name}</div>
                <div style={{fontFamily:"monospace",fontSize:22,fontWeight:800,color,lineHeight:1}}>{bLeft}</div>
                <div style={{fontSize:11,color:"#888",marginTop:2}}>Batch</div>
                <div style={{fontSize:11,color:"#666",marginTop:6,borderTop:`1px solid ${border}`,paddingTop:6}}>
                  ≈ {Math.round(fc?.daysLeft||0)} วัน<br/>
                  ≈ {fmt(fc?.monthsLeft||0,1)} เดือน
                </div>
                {urgent&&<div style={{fontSize:10,color:"#ff4444",fontWeight:700,marginTop:6}}>⚠️ สั่งซื้อด่วน!</div>}
                {!urgent&&warn&&<div style={{fontSize:10,color:"#ff9800",fontWeight:700,marginTop:6}}>⚡ ควรสั่งเร็วๆ นี้</div>}
              </div>
            );
          })}
        </div>
        <div style={{marginTop:14,padding:"12px 14px",background:"#111",borderRadius:10,border:"1px solid #1e1e1e",fontSize:12,color:"#666"}}>
          💡 คำนวณจากอัตราเฉลี่ยของ <b style={{color:"#7ab648"}}>{filteredBatchCount} Batch</b>{forecastRecipeId==="__all__"?" (ทุกสูตร)":" (สูตรที่เลือก)"} — ยิ่งมีประวัติมาก ยิ่งแม่นยำขึ้น
        </div>
      </Card>
    </>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  SETTINGS PAGE — จัดการ Authorized Users & PIN
// ══════════════════════════════════════════════════════════════
function SettingsPage({authorizedUsers,onUpdate,pinLockout,onUpdateLockout,systemUsers,onUpdateUsers}){
  const [settingsTab,setSettingsTab]=useState("users"); // "users" | "pin"
  // System Users state
  const [addingUser,setAddingUser]=useState(false);
  const [newUsername,setNewUsername]=useState("");
  const [newDisplayName,setNewDisplayName]=useState("");
  const [newUserRole,setNewUserRole]=useState("user");
  const [newUserPwd,setNewUserPwd]=useState("");
  const [newUserPwdConfirm,setNewUserPwdConfirm]=useState("");
  const [userError,setUserError]=useState("");
  const [editingUser,setEditingUser]=useState(null);
  const [editPwdVal,setEditPwdVal]=useState("");
  const [editPwdConfirm,setEditPwdConfirm]=useState("");

  const addSystemUser=()=>{
    if(!newUsername.trim()||!newDisplayName.trim()){setUserError("กรุณากรอกข้อมูลให้ครบ");return;}
    if(newUserPwd.length<4){setUserError("Password ต้องมีอย่างน้อย 4 ตัวอักษร");return;}
    if(newUserPwd!==newUserPwdConfirm){setUserError("Password ไม่ตรงกัน");return;}
    if(systemUsers.find(u=>u.username===newUsername.trim())){setUserError("Username นี้มีแล้ว");return;}
    const id="SU"+String(Date.now()).slice(-6);
    onUpdateUsers([...systemUsers,{id,username:newUsername.trim(),password:hashPwd(newUserPwd),displayName:newDisplayName.trim(),role:newUserRole}]);
    setAddingUser(false);setNewUsername("");setNewDisplayName("");setNewUserPwd("");setNewUserPwdConfirm("");setUserError("");
  };
  const deleteSystemUser=(id)=>{
    if(systemUsers.length<=1){alert("ต้องมี User อย่างน้อย 1 คน");return;}
    if(!window.confirm("ลบ User นี้?"))return;
    onUpdateUsers(systemUsers.filter(u=>u.id!==id));
  };
  const saveNewUserPwd=(id)=>{
    if(editPwdVal.length<4){setUserError("Password ต้องมีอย่างน้อย 4 ตัวอักษร");return;}
    if(editPwdVal!==editPwdConfirm){setUserError("Password ไม่ตรงกัน");return;}
    onUpdateUsers(systemUsers.map(u=>u.id!==id?u:{...u,password:hashPwd(editPwdVal)}));
    setEditingUser(null);setEditPwdVal("");setEditPwdConfirm("");setUserError("");
  };

  // PIN Auth state (เดิม)
  const [adding,setAdding]=useState(false);
  const [newName,setNewName]=useState("");
  const [newRole,setNewRole]=useState("ผู้จัดการ");
  const [newPin,setNewPin]=useState("");
  const [confirmPin,setConfirmPin]=useState("");
  const [pinError,setPinError]=useState("");
  const [showPin,setShowPin]=useState({});
  const [editingPin,setEditingPin]=useState(null);
  const [editPinVal,setEditPinVal]=useState("");
  const [editPinConfirm,setEditPinConfirm]=useState("");

  const roles=["ผู้จัดการ","หัวหน้าไลน์ผลิต","ผู้ควบคุมคุณภาพ","ผู้อำนวยการ","อื่นๆ"];

  const addUser=()=>{
    if(!newName.trim()){setPinError("กรุณาใส่ชื่อ");return;}
    if(newPin.length!==6){setPinError("PIN ต้องมี 6 หลัก");return;}
    if(newPin!==confirmPin){setPinError("PIN ไม่ตรงกัน");return;}
    if(!/^\d{6}$/.test(newPin)){setPinError("PIN ต้องเป็นตัวเลขเท่านั้น");return;}
    const id="AU"+String(Date.now()).slice(-6);
    onUpdate([...authorizedUsers,{id,name:newName.trim(),role:newRole,pin:hashPin(newPin)}]);
    setAdding(false);setNewName("");setNewPin("");setConfirmPin("");setPinError("");
  };

  const deleteUser=(id)=>{
    if(!window.confirm("ลบผู้มีอำนาจคนนี้?"))return;
    onUpdate(authorizedUsers.filter(u=>u.id!==id));
  };

  const saveNewPin=(id)=>{
    if(editPinVal.length!==6||!/^\d{6}$/.test(editPinVal)){setPinError("PIN ต้องเป็นตัวเลข 6 หลัก");return;}
    if(editPinVal!==editPinConfirm){setPinError("PIN ไม่ตรงกัน");return;}
    onUpdate(authorizedUsers.map(u=>u.id!==id?u:{...u,pin:hashPin(editPinVal)}));
    setEditingPin(null);setEditPinVal("");setEditPinConfirm("");setPinError("");
  };

  const isLocked=pinLockout.lockedUntil&&Date.now()<pinLockout.lockedUntil;

  return(<div className="fu">
    {/* Settings tabs */}
    <div style={{display:"flex",marginBottom:16,borderBottom:"1px solid #1e1e1e"}}>
      {[{id:"users",l:"👥 จัดการ Users"},{id:"pin",l:"🔑 PIN อนุมัติสต็อก"}].map(t=>(
        <button key={t.id} onClick={()=>setSettingsTab(t.id)} style={{padding:"9px 18px",background:"none",border:"none",
          borderBottom:settingsTab===t.id?"2px solid #7ab648":"2px solid transparent",
          color:settingsTab===t.id?"#7ab648":"#666",fontSize:13,fontWeight:700,cursor:"pointer"}}>
          {t.l}
        </button>
      ))}
    </div>

    {/* ── TAB: จัดการ Users (Login) */}
    {settingsTab==="users"&&(
      <div>
        <Card>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <CT style={{margin:0}}>👥 บัญชีผู้ใช้งานระบบ</CT>
            <button style={{...BSS,marginLeft:"auto",padding:"5px 12px",fontSize:12}} onClick={()=>{setAddingUser(true);setUserError("");}}>+ เพิ่ม User</button>
          </div>
          {/* Role legend */}
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
            {[{r:"admin",l:"👑 Admin",d:"เข้าได้ทุกเมนู จัดการ User ได้",c:"#7ab648"},{r:"user",l:"👤 User",d:"เข้าได้ทุกเมนู ยกเว้น Settings",c:"#3db8e0"}].map(x=>(
              <div key={x.r} style={{background:"#111",border:`1px solid ${x.c}33`,borderRadius:9,padding:"8px 12px",flex:"1 1 180px"}}>
                <div style={{fontSize:12,fontWeight:700,color:x.c,marginBottom:2}}>{x.l}</div>
                <div style={{fontSize:11,color:"#666"}}>{x.d}</div>
              </div>
            ))}
          </div>

          {systemUsers.map(u=>(
            <div key={u.id} style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
              {editingUser===u.id?(
                <div>
                  <div style={{fontSize:12,color:"#3db8e0",marginBottom:10}}>🔑 เปลี่ยน Password ของ <b>{u.displayName}</b></div>
                  <div style={{display:"grid",gap:8,marginBottom:8}}>
                    <Field label="Password ใหม่ (อย่างน้อย 4 ตัว)">
                      <input style={{...SI,padding:"7px 10px",fontSize:13}} type="password" value={editPwdVal} onChange={e=>{setEditPwdVal(e.target.value);setUserError("");}} placeholder="กรอก Password ใหม่"/>
                    </Field>
                    <Field label="ยืนยัน Password ใหม่">
                      <input style={{...SI,padding:"7px 10px",fontSize:13}} type="password" value={editPwdConfirm} onChange={e=>{setEditPwdConfirm(e.target.value);setUserError("");}} placeholder="กรอกอีกครั้ง"/>
                    </Field>
                  </div>
                  {userError&&<div style={{color:"#ff6b6b",fontSize:12,marginBottom:8}}>⚠️ {userError}</div>}
                  <div style={{display:"flex",gap:8}}>
                    <Btn style={{padding:"7px 14px",fontSize:12}} onClick={()=>saveNewUserPwd(u.id)}>บันทึก</Btn>
                    <BtnSec style={{padding:"7px 12px",fontSize:12}} onClick={()=>{setEditingUser(null);setUserError("");}}>ยกเลิก</BtnSec>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:38,height:38,borderRadius:"50%",background:u.role==="admin"?"#1d3a10":"#0a1525",border:`1px solid ${u.role==="admin"?"#7ab64833":"#3db8e033"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
                    {u.role==="admin"?"👑":"👤"}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#fff"}}>{u.displayName}</div>
                    <div style={{fontSize:11}}>
                      <span style={{color:"#555",fontFamily:"monospace"}}>@{u.username}</span>
                      <span style={{marginLeft:8,color:u.role==="admin"?"#7ab648":"#3db8e0",background:u.role==="admin"?"#1d3a10":"#071422",padding:"1px 7px",borderRadius:4,fontSize:10,fontWeight:700}}>{u.role==="admin"?"Admin":"User"}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>{setEditingUser(u.id);setEditPwdVal("");setEditPwdConfirm("");setUserError("");}} style={{background:"#1a2a1a",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:11}}>🔑 เปลี่ยน Password</button>
                    <button onClick={()=>deleteSystemUser(u.id)} style={{background:"#2a1010",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:13}}>🗑</button>
                  </div>
                </div>
              )}
            </div>
          ))}

          {addingUser&&(
            <div style={{background:"#0f1f08",border:"1px solid #7ab64833",borderRadius:10,padding:"14px",marginTop:8}}>
              <div style={{fontSize:12,color:"#7ab648",fontWeight:700,marginBottom:12}}>➕ เพิ่ม User ใหม่</div>
              <div style={{display:"grid",gap:10,marginBottom:10}}>
                <Field label="ชื่อ-นามสกุล (แสดงในระบบ)"><input style={{...SI,padding:"7px 10px",fontSize:13}} value={newDisplayName} onChange={e=>setNewDisplayName(e.target.value)} placeholder="เช่น สมชาย ใจดี" autoFocus/></Field>
                <Field label="Username (ใช้ Login)"><input style={{...SI,padding:"7px 10px",fontSize:13,fontFamily:"monospace"}} value={newUsername} onChange={e=>{setNewUsername(e.target.value.replace(/\s/g,""));setUserError("");}} placeholder="เช่น somchai"/></Field>
                <Field label="สิทธิ์การใช้งาน">
                  <select style={{...SI,padding:"7px 10px",fontSize:13}} value={newUserRole} onChange={e=>setNewUserRole(e.target.value)}>
                    <option value="user">👤 User — เข้าได้ทุกเมนู ยกเว้น Settings</option>
                    <option value="admin">👑 Admin — เข้าได้ทุกเมนู รวม Settings</option>
                  </select>
                </Field>
                <Field label="Password (อย่างน้อย 4 ตัว)"><input style={{...SI,padding:"7px 10px",fontSize:13}} type="password" value={newUserPwd} onChange={e=>{setNewUserPwd(e.target.value);setUserError("");}} placeholder="กรอก Password"/></Field>
                <Field label="ยืนยัน Password"><input style={{...SI,padding:"7px 10px",fontSize:13}} type="password" value={newUserPwdConfirm} onChange={e=>{setNewUserPwdConfirm(e.target.value);setUserError("");}} placeholder="กรอกอีกครั้ง"/></Field>
              </div>
              {userError&&<div style={{color:"#ff6b6b",fontSize:12,marginBottom:8}}>⚠️ {userError}</div>}
              <div style={{display:"flex",gap:8}}>
                <Btn style={{padding:"8px 16px",fontSize:12}} onClick={addSystemUser}>เพิ่ม User</Btn>
                <BtnSec style={{padding:"8px 12px",fontSize:12}} onClick={()=>{setAddingUser(false);setUserError("");}}>ยกเลิก</BtnSec>
              </div>
            </div>
          )}
        </Card>
        <Card style={{border:"1px solid #ff980033"}}>
          <CT style={{color:"#ff9800"}}>⚠️ คำแนะนำความปลอดภัย</CT>
          <div style={{fontSize:12,color:"#888",lineHeight:1.8}}>
            • เปลี่ยน Password ของ Admin เริ่มต้น (admin1234) ทันที<br/>
            • ใช้ Password ที่คาดเดายากขึ้น เช่น ผสมตัวเลขและตัวอักษร<br/>
            • ไม่ควรบอก Password ให้ผู้อื่น<br/>
            • ถ้า User ลาออก ให้ลบบัญชีทันที
          </div>
        </Card>
      </div>
    )}

    {/* ── TAB: PIN อนุมัติสต็อก (เดิม) */}
    {settingsTab==="pin"&&(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
      {/* Users list */}
      <div>
        <Card>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <CT style={{margin:0}}>🔑 ผู้มีอำนาจอนุมัติปรับสต็อก</CT>
            <button style={{...BSS,marginLeft:"auto",padding:"5px 12px",fontSize:12}} onClick={()=>{setAdding(true);setPinError("");}}>+ เพิ่ม</button>
          </div>

          {!authorizedUsers.length&&!adding&&(
            <div style={{textAlign:"center",padding:"24px 0",color:"#555"}}>
              <div style={{fontSize:36,marginBottom:8}}>👤</div>
              <div style={{fontSize:13}}>ยังไม่มีผู้มีอำนาจ</div>
              <div style={{fontSize:11,marginTop:4,color:"#444"}}>เพิ่มอย่างน้อย 1 คนเพื่อใช้ฟีเจอร์ปรับสต็อก</div>
            </div>
          )}

          {authorizedUsers.map(u=>(
            <div key={u.id} style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
              {editingPin===u.id?(
                <div>
                  <div style={{fontSize:12,color:"#3db8e0",marginBottom:10}}>🔑 เปลี่ยน PIN ของ <b>{u.name}</b></div>
                  <Field label="PIN ใหม่ (6 หลัก)">
                    <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:4,fontFamily:"monospace"}} type="password" maxLength={6} value={editPinVal} onChange={e=>{setEditPinVal(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                  </Field>
                  <div style={{marginTop:8}}/>
                  <Field label="ยืนยัน PIN ใหม่">
                    <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:4,fontFamily:"monospace"}} type="password" maxLength={6} value={editPinConfirm} onChange={e=>{setEditPinConfirm(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                  </Field>
                  {pinError&&<div style={{color:"#ff6b6b",fontSize:12,marginTop:6}}>{pinError}</div>}
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <Btn style={{padding:"7px 14px",fontSize:12}} onClick={()=>saveNewPin(u.id)}>บันทึก PIN</Btn>
                    <BtnSec style={{padding:"7px 12px",fontSize:12}} onClick={()=>{setEditingPin(null);setPinError("");}}>ยกเลิก</BtnSec>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:38,height:38,borderRadius:"50%",background:"#1d3a10",border:"1px solid #7ab64833",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                    {u.role==="ผู้อำนวยการ"?"👑":u.role==="ผู้จัดการ"?"🏅":"👤"}
                  </div>
                  <div style={{flex:1}}>
