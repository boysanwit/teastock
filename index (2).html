// ══════════════════════════════════════════════════════════════
//  PRODUCE PAGE
// ══════════════════════════════════════════════════════════════
function ProducePage({ingredients,packaging,recipes,onProduce,batchCounter,currentUser}){
  const [step,setStep]=useState(1);
  const [recipeId,setRecipeId]=useState(recipes[0]?.id||"");
  const [kg,setKg]=useState("");
  const [operator,setOp]=useState(currentUser?.displayName||"");
  const [note,setNote]=useState("");
  const [overrides,setOverrides]=useState({});
  const [batch,setBatch]=useState(null);

  const recipe=recipes.find(r=>r.id===recipeId);
  const kgNum=parseFloat(kg)||0;
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};
  useEffect(()=>setOverrides({}),[recipeId,kg]);

  const calcBase=useCallback(()=>{
    if(!recipe||!kgNum)return[];
    const d=recipe.items.map(item=>{
      const ing=ingredients.find(i=>i.id===item.ingredientId);
      return{type:"ing",id:item.ingredientId,name:ing?.name||"?",unit:ing?.unit||"กรัม",baseAmount:item.amountPerKg*kgNum,before:ing?.qty||0};
    });
    const bags=kgNum*recPack.bagsPerKg;const boxes=Math.ceil(bags/recPack.bagsPerBox);
    // ใช้ packId/boxId ที่เลือกไว้ในสูตร ถ้าไม่มีให้ fallback หา ถุงฟอย/กล่องลัง
    const foil=recPack.packId?packaging.find(p=>p.id===recPack.packId):packaging.find(p=>p.name.includes("ถุงฟอย"));
    const box=recPack.boxId?packaging.find(p=>p.id===recPack.boxId):packaging.find(p=>p.name.includes("กล่องลัง"));
    if(foil)d.push({type:"pack",id:foil.id,name:foil.name,unit:foil.unit,baseAmount:bags,before:foil.qty});
    if(box)d.push({type:"pack",id:box.id,name:box.name,unit:box.unit,baseAmount:boxes,before:box.qty});
    return d;
  },[recipe,kgNum,ingredients,packaging,recPack]);

  const getAmt=(d)=>overrides[d.type+"-"+d.id]!==undefined?overrides[d.type+"-"+d.id]:d.baseAmount;
  const setAmt=(d,val)=>setOverrides(o=>({...o,[d.type+"-"+d.id]:parseFloat(val)||0}));
  const resetAmt=(d)=>setOverrides(o=>{const n={...o};delete n[d.type+"-"+d.id];return n;});

  const base=calcBase();
  const final=base.map(d=>({...d,amount:getAmt(d),after:d.before-getAmt(d)}));
  const hasError=final.some(d=>d.after<0);
  const hasWarn=final.some(d=>d.after>=0&&d.after<d.before*.15);

  const doConfirm=()=>{setBatch({recipeId,recipeName:recipe?.name,kg:kgNum,operator,note,deductions:final});setStep(2);};
  const doFinal=()=>{onProduce(batch);setStep(3);};
  const doReset=()=>{setStep(1);setKg("");setOp("");setNote("");setBatch(null);setOverrides({});};

  if(step===3)return(<Card><div style={{textAlign:"center",padding:"36px 20px"}}>
    <div style={{fontSize:58,marginBottom:12,animation:"bounceIn .5s ease"}}>✅</div>
    <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:20,fontWeight:800,color:"#7ab648",marginBottom:6}}>ตัดสต็อกเรียบร้อย!</div>
    <div style={{fontSize:13,color:"#888",marginBottom:20}}>Batch #{String(batch.batchNo||0).padStart(4,"0")} · {batch.recipeName} · {fmt(batch.kg,0)} กก.</div>
    <Btn onClick={doReset}>➕ ผลิต Batch ใหม่</Btn>
  </div></Card>);

  return(<div className="fu">
    <div style={{display:"flex",marginBottom:18,background:"#111",border:"1px solid #222",borderRadius:10,overflow:"hidden"}}>
      {[{n:1,l:"กรอกข้อมูล"},{n:2,l:"ตรวจสอบ"},{n:3,l:"เสร็จสิ้น"}].map(s=>(
        <div key={s.n} style={{flex:1,padding:"10px",textAlign:"center",fontSize:12,fontWeight:700,borderBottom:step===s.n?"2px solid #7ab648":"2px solid transparent",background:step===s.n?"#0f1f08":"transparent",color:step===s.n?"#7ab648":step>s.n?"#4a8a28":"#555",transition:"all .3s"}}>
          <span style={{display:"inline-block",width:18,height:18,borderRadius:"50%",lineHeight:"18px",marginRight:5,fontSize:10,fontWeight:800,background:step>s.n?"#7ab648":step===s.n?"#1d3a10":"#222",color:step>s.n?"#fff":step===s.n?"#7ab648":"#555",border:step===s.n?"1.5px solid #7ab648":"1.5px solid transparent"}}>{step>s.n?"✓":s.n}</span>{s.l}
        </div>
      ))}
    </div>
    {step===1&&(<>
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <CT style={{margin:0}}>ข้อมูลการผลิต</CT>
          <span style={{fontFamily:"monospace",fontSize:12,color:"#7ab648",background:"#1d3a10",padding:"2px 10px",borderRadius:6,border:"1px solid #7ab64833"}}>Batch #{String(batchCounter).padStart(4,"0")}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
          <Field label="สูตรชา"><select style={SI} value={recipeId} onChange={e=>setRecipeId(e.target.value)}>{recipes.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></Field>
          <Field label="น้ำหนักที่ผลิต (กก.)"><input style={SI} type="number" min="1" value={kg} onChange={e=>setKg(e.target.value)} placeholder="เช่น 500"/></Field>
          <Field label="ผู้บันทึก"><div style={{position:"relative"}}><input style={{...SI,paddingRight:currentUser?36:12}} value={operator} onChange={e=>setOp(e.target.value)} placeholder="ชื่อผู้บันทึก"/>{currentUser&&<span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#7ab648"}}>👤</span>}</div></Field>
          <Field label="หมายเหตุ"><input style={SI} value={note} onChange={e=>setNote(e.target.value)} placeholder="หมายเหตุ"/></Field>
        </div>
      </Card>
      {kgNum>0&&recipe&&(<Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <CT style={{margin:0}}>🧮 สรุปการใช้ทรัพยากร — {fmt(kgNum,0)} กก.</CT>
          <span style={{fontSize:11,color:"#7ab648",background:"#1d3a10",padding:"2px 8px",borderRadius:6,border:"1px solid #7ab64833"}}>✏️ แก้ไขได้</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14}}>
          <div>
            <SL>🌿 วัตถุดิบ</SL>
            {base.filter(d=>d.type==="ing").map(d=>{
              const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;const ok=d.before>=amt;
              return(<div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #1e1e1e",gap:8}}>
                <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name}</span>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <input type="number" min="0" step="0.01" value={amt} onChange={e=>setAmt(d,e.target.value)} style={{...SI,width:110,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,color:ok?"#7ab648":"#ff4444",border:over?"1.5px solid #7ab64866":"1.5px solid #2a2a2a",background:over?"#0f1f08":"#0f0f0f"}}/>
                  <span style={{color:"#555",fontSize:11,minWidth:28}}>{d.unit}</span>
                  {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:14}}>↺</button>}
                  {!ok&&<Bdg color="red">ไม่พอ!</Bdg>}
                </div>
              </div>);
            })}
          </div>
          <div>
            <SL>📦 บรรจุภัณฑ์</SL>
            {base.filter(d=>d.type==="pack").map(d=>{
              const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;
              return(<div key={d.id} style={{padding:"6px 0",borderBottom:"1px solid #1e1e1e"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name}</span>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" min="0" step="1" value={amt} onChange={e=>setAmt(d,e.target.value)} style={{...SI,width:100,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,color:"#3db8e0",border:over?"1.5px solid #3db8e066":"1.5px solid #2a2a2a",background:over?"#08141f":"#0f0f0f"}}/>
                    <span style={{color:"#555",fontSize:11,minWidth:20}}>{d.unit}</span>
                    {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:14}}>↺</button>}
                  </div>
                </div>
              </div>);
            })}
          </div>
        </div>
        {hasError&&<Alert type="error">⛔ วัตถุดิบบางรายการ<b>ไม่เพียงพอ</b></Alert>}
        {!hasError&&hasWarn&&<Alert type="warn">⚡ บางรายการ<b>ใกล้หมด</b></Alert>}
        {!hasError&&!hasWarn&&<Alert type="ok">✅ สต็อกเพียงพอ</Alert>}
      </Card>)}
      <Btn onClick={doConfirm} disabled={!kgNum||!recipe||hasError}>ตรวจสอบ →</Btn>
    </>)}
    {step===2&&batch&&(<>
      <Card>
        <CT>📊 ยืนยันการตัดสต็อก</CT>
        <div style={{fontSize:13,color:"#888",marginBottom:12}}>
          <span style={{fontFamily:"monospace",color:"#7ab648",fontWeight:700}}>Batch #{String(batchCounter).padStart(4,"0")}</span>
          {" · "}<b style={{color:"#fff"}}>{batch.recipeName}</b>{" · "}<b style={{color:"#7ab648"}}>{fmt(batch.kg,0)} กก.</b>
        </div>
        <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>{["รายการ","ประเภท","หน่วย","สต็อกก่อน","ใช้ไป","คงเหลือ"].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
            <tbody>
              {batch.deductions.map((d,i)=>{
                const col=d.after<0?"#ff4444":d.after<d.before*.15?"#ff9800":"#7ab648";
                return(<tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                  <td style={TD}>{d.type==="ing"?"🌿":"📦"} {d.name}</td>
                  <td style={{...TD,color:"#555",fontSize:11}}>{d.type==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                  <td style={{...TD,color:"#777"}}>{d.unit}</td>
                  <td style={{...TD,fontFamily:"monospace"}}>{fmt(d.before)}</td>
                  <td style={{...TD,fontFamily:"monospace",color:"#ff6b6b",fontWeight:700}}>-{fmt(d.amount)}</td>
                  <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:col}}>{fmt(d.after)}</td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </Card>
      <div style={{display:"flex",gap:10}}><BtnSec onClick={()=>setStep(1)}>← แก้ไข</BtnSec><Btn onClick={doFinal}>✅ ยืนยัน</Btn></div>
    </>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  STOCK PAGE
// ══════════════════════════════════════════════════════════════
function StockPage({ingredients,packaging,onUpdateIng,onUpdatePack,stockLog,onManualEdit,currentUser,recipes,onUpdateRecipes}){
  const [view,setView]=useState("ing");
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [expandedBatch,setExpandedBatch]=useState({});
  const [dragOver,setDragOver]=useState(null);
  const [receiveModal,setReceiveModal]=useState(null);
  const [receiveQty,setReceiveQty]=useState("");
  const [receiveNote,setReceiveNote]=useState("");
  const [receiveUnit,setReceiveUnit]=useState("กรัม");
  const dragItem=useRef(null);

  const [ingSubView,setIngSubView]=useState("main");       // main | ingredient
  const [packSubView,setPackSubView]=useState("ถุง");       // ถุง | กล่อง | สติกเกอร์

  const fullList=view==="ing"?ingredients:view==="pack"?packaging:[];
  const list=view==="ing"
    ?ingredients.filter(i=>(i.category||"main")===ingSubView)
    :view==="pack"
    ?packaging.filter(p=>(p.category||"ถุง")===packSubView)
    :[];
  const accent=view==="ing"?(ingSubView==="main"?"#7ab648":"#3db8e0"):view==="pack"?"#3db8e0":"#e09b3d";
  const prefix=view==="ing"?"RM":"PK";
  const defaultCategory=view==="ing"?ingSubView:packSubView;

  const reIndex=(arr,pref)=>arr.map((item,i)=>({...item,id:pref+String(i+1).padStart(3,"0")}));

  // ── Unit conversion (กรัม ↔ กิโลกรัม เท่านั้น) ──────────
  const convertUnit=(item,newUnit)=>{
    if(item.unit===newUnit)return item;
    const converted=convertWeight(item.qty,item.unit,newUnit);
    const convertedMin=convertWeight(item.minQty||0,item.unit,newUnit);
    return{...item,unit:newUnit,qty:converted,minQty:convertedMin};
  };

  const commitEdit=()=>{
    if(!editing)return;
    const isQty=editing.field==="qty",isMin=editing.field==="minQty";
    const v=(isQty||isMin)?(parseFloat(editing.value)||0):editing.value;
    if(isQty){const before=list.find(x=>x.id===editing.id)?.qty||0;onManualEdit(view==="ing"?"ing":"pack",editing.id,list.find(x=>x.id===editing.id)?.name||"",before,v,currentUser?.displayName);}
    if(view==="ing")onUpdateIng(ingredients.map(i=>i.id===editing.id?{...i,[editing.field]:v}:i));
    else onUpdatePack(packaging.map(p=>p.id===editing.id?{...p,[editing.field]:v}:p));
    setEditing(null);
  };

  const changeUnit=(item,newUnit)=>{
    if(newUnit===item.unit)return;
    if(!window.confirm(`แปลงหน่วยจาก "${item.unit}" เป็น "${newUnit}"?
จำนวนและขั้นต่ำจะถูกแปลงอัตโนมัติ`))return;
    const converted=convertUnit(item,newUnit);
    if(view==="ing")onUpdateIng(ingredients.map(i=>i.id===item.id?converted:i));
    else onUpdatePack(packaging.map(p=>p.id===item.id?converted:p));
  };

  const deleteItem=(id)=>{
    if(!window.confirm("ลบรายการนี้?"))return;
    if(view==="ing"){
      const filtered=ingredients.filter(i=>i.id!==id);
      const idMap={};
      filtered.forEach((item,i)=>{idMap[item.id]="RM"+String(i+1).padStart(3,"0");});
      onUpdateIng(reIndex(filtered,prefix));
      // อัปเดต ingredientId ในสูตรชา ลบรายการที่ถูกลบออก + ปรับ ID ที่เหลือ
      if(recipes&&onUpdateRecipes){
        const updatedRecipes=recipes.map(r=>({
          ...r,
          items:(r.items||[])
            .filter(it=>it.ingredientId!==id)
            .map(it=>({...it,ingredientId:idMap[it.ingredientId]||it.ingredientId}))
        }));
        onUpdateRecipes(updatedRecipes);
      }
    } else {
      onUpdatePack(reIndex(packaging.filter(p=>p.id!==id),prefix));
    }
  };

  const startAdd=()=>{const pref=view==="ing"?"RM":"PK";setAdding({id:genId(pref,fullList),name:"",unit:view==="ing"?"กรัม":"ชิ้น",qty:0,minQty:0,category:defaultCategory});};
  const commitAdd=()=>{
    if(!adding?.name.trim())return;
    const itemWithCat={...adding,category:defaultCategory};
    const newList=view==="ing"?[...ingredients,itemWithCat]:[...packaging,itemWithCat];
    const indexed=reIndex(newList,prefix);
    if(view==="ing")onUpdateIng(indexed);else onUpdatePack(indexed);
    setAdding(null);
  };

  // ── รับของเข้า ───────────────────────────────────────────
  const openReceive=(item)=>{setReceiveModal(item);setReceiveQty("");setReceiveNote("");setReceiveUnit(item.unit);};
  const commitReceive=()=>{
    const inputQty=parseFloat(receiveQty)||0;
    if(!inputQty||inputQty<=0){alert("กรุณากรอกจำนวนที่รับเข้า");return;}
    // แปลงหน่วยถ้าต่างกัน
    const qty=isWeightUnit(receiveModal.unit)&&receiveUnit!==receiveModal.unit
      ?(receiveUnit==="กิโลกรัม"?inputQty*1000:inputQty/1000)
      :inputQty;
    const type=view==="ing"?"ing":"pack";
    const before=receiveModal.qty;
    const after=before+qty;
    const by=currentUser?.displayName||"ไม่ระบุ";
    const reason=`รับของเข้า${receiveNote?` — ${receiveNote}`:""}`;
    onManualEdit(type,receiveModal.id,receiveModal.name,before,after,by,reason,true);
    if(type==="ing")onUpdateIng(ingredients.map(i=>i.id===receiveModal.id?{...i,qty:after}:i));
    else onUpdatePack(packaging.map(p=>p.id===receiveModal.id?{...p,qty:after}:p));
    setReceiveModal(null);
  };

  // Drag
  const onDragStart=(i)=>{dragItem.current=i;};
  const onDragEnter=(i)=>{setDragOver(i);};
  const onDragEnd=()=>{
    if(dragItem.current===null||dragOver===null||dragItem.current===dragOver){dragItem.current=null;setDragOver(null);return;}
    const arr=[...list];
    const dragged=arr.splice(dragItem.current,1)[0];
    arr.splice(dragOver,0,dragged);
    // สร้าง map รหัสเก่า → รหัสใหม่ เพื่ออัปเดตสูตรชา
    const idMap={};
    arr.forEach((item,i)=>{idMap[item.id]=prefix+String(i+1).padStart(3,"0");});
    const indexed=reIndex(arr,prefix);
    if(view==="ing"){
      onUpdateIng(indexed);
      // อัปเดต ingredientId ในสูตรชาตาม idMap (ยึดตามรายการ ไม่ใช่ลำดับ)
      if(recipes&&onUpdateRecipes){
        const updatedRecipes=recipes.map(r=>({
          ...r,
          items:(r.items||[]).map(it=>({
            ...it,
            ingredientId:idMap[it.ingredientId]||it.ingredientId
          }))
        }));
        onUpdateRecipes(updatedRecipes);
      }
    } else {
      onUpdatePack(indexed);
    }
    dragItem.current=null;setDragOver(null);
  };

  const batchGroups=useMemo(()=>{
    const groups={};
    (stockLog||[]).forEach(l=>{
      const key=l.batchNo?`batch-${l.batchNo}`:`manual-${l.date}-${l.time}-${l.itemId}`;
      if(!groups[key])groups[key]={key,batchNo:l.batchNo,date:l.date,time:l.time,reason:l.reason,adjustedBy:l.adjustedBy,isReceive:l.isReceive,items:[]};
      groups[key].items.push(l);
    });
    return Object.values(groups).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  },[stockLog]);

  const VIEWS=[{id:"ing",l:"🌿 วัตถุดิบ"},{id:"pack",l:"📦 บรรจุภัณฑ์"},{id:"log",l:"📜 ประวัติการเปลี่ยนแปลง"}];

  return(<div className="fu">
    {/* Receive Modal */}
    {receiveModal&&(
      <div className="pin-overlay" onClick={e=>{if(e.target===e.currentTarget)setReceiveModal(null);}}>
        <div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:18,padding:"28px 24px",width:"min(420px,calc(100vw - 32px))",boxShadow:"0 20px 60px rgba(0,0,0,.8)"}}>
          <div style={{fontSize:24,marginBottom:8}}>📥</div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648",marginBottom:4}}>รับของเข้าคลัง</div>
          <div style={{fontSize:13,color:"#888",marginBottom:20}}>{receiveModal.name}</div>
          <div style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:12,color:"#666"}}>สต็อกปัจจุบัน</span>
            <span style={{fontFamily:"monospace",fontWeight:700,color:"#7ab648"}}>{fmt(receiveModal.qty)} {receiveModal.unit}</span>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <label style={{fontSize:10,fontWeight:700,color:"#7ab648",textTransform:"uppercase",letterSpacing:".7px"}}>จำนวนที่รับเข้า — เลือกหน่วยก่อนกรอก</label>
              {isWeightUnit(receiveModal.unit)&&(
                <div style={{display:"flex",gap:4}}>
                  {["กรัม","กิโลกรัม"].map(u=>(
                    <button key={u} onClick={()=>{
                      setReceiveUnit(u);
                    }} style={{padding:"3px 10px",borderRadius:6,border:"none",fontSize:11,fontWeight:700,cursor:"pointer",
                      background:receiveUnit===u?"#e09b3d":"#1e1e1e",color:receiveUnit===u?"#fff":"#888",transition:"all .2s"}}>
                      {u==="กรัม"?"กรัม (ก.)":"กิโลกรัม (กก.)"}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <input style={{...SI,padding:"10px 14px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:"#7ab648"}} type="number" min="0" step="0.01"
              value={receiveQty} onChange={e=>setReceiveQty(e.target.value)} placeholder="0" autoFocus
              onKeyDown={e=>e.key==="Enter"&&commitReceive()}/>
          </div>
          {parseFloat(receiveQty)>0&&(()=>{
            const inputQty=parseFloat(receiveQty)||0;
            // แปลงเป็นหน่วยของ item ก่อนบวก
            const qtyInItemUnit=isWeightUnit(receiveModal.unit)&&receiveUnit!==receiveModal.unit
              ?(receiveUnit==="กิโลกรัม"?inputQty*1000:inputQty/1000)
              :inputQty;
            return(
              <div style={{background:"#0a1f06",border:"1px solid #7ab64833",borderRadius:8,padding:"8px 14px",marginBottom:12,fontSize:13}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:"#888"}}>รับเข้า: </span>
                  <span style={{fontFamily:"monospace",fontWeight:700,color:"#3db8e0"}}>+{fmt(qtyInItemUnit)} {receiveModal.unit}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
                  <span style={{color:"#888"}}>หลังรับเข้า: </span>
                  <span style={{fontFamily:"monospace",fontWeight:800,color:"#7ab648",fontSize:15}}>{fmt(receiveModal.qty+qtyInItemUnit)} {receiveModal.unit}</span>
                </div>
              </div>
            );
          })()}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:10,fontWeight:700,color:"#7ab648",marginBottom:6,textTransform:"uppercase",letterSpacing:".7px"}}>หมายเหตุ (ไม่บังคับ)</label>
            <input style={{...SI,padding:"9px 12px",fontSize:13}} value={receiveNote} onChange={e=>setReceiveNote(e.target.value)} placeholder="เช่น Lot ที่, ผู้ส่ง, เลขที่ใบส่งของ"/>
          </div>
          <div style={{fontSize:11,color:"#555",marginBottom:16}}>👤 บันทึกโดย: <b style={{color:"#aaa"}}>{currentUser?.displayName||"ไม่ระบุ"}</b></div>
          <div style={{display:"flex",gap:10}}>
            <Btn style={{flex:1,padding:"10px"}} onClick={commitReceive} disabled={!parseFloat(receiveQty)||parseFloat(receiveQty)<=0}>📥 บันทึกรับของเข้า</Btn>
            <BtnSec style={{padding:"10px 16px"}} onClick={()=>setReceiveModal(null)}>ยกเลิก</BtnSec>
          </div>
        </div>
      </div>
    )}

    {/* Main tabs */}
    <div style={{display:"flex",marginBottom:0,borderBottom:"1px solid #1e1e1e",flexWrap:"wrap",gap:4}}>
      {VIEWS.map(v=>(
        <button key={v.id} onClick={()=>{setView(v.id);setEditing(null);setAdding(null);}} style={{padding:"9px 16px",background:"none",border:"none",borderBottom:view===v.id?`2px solid ${v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"}`:"2px solid transparent",color:view===v.id?(v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"):"#666",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{v.l}</button>
      ))}
    </div>

    {/* Sub-tabs for วัตถุดิบ */}
    {view==="ing"&&(
      <div style={{display:"flex",alignItems:"center",background:"#111",borderBottom:"1px solid #1e1e1e",padding:"0 4px",marginBottom:14}}>
        {[{id:"main",l:"🌿 Main Raw Mat",c:"#7ab648"},{id:"ingredient",l:"🧪 Ingredient",c:"#3db8e0"}].map(s=>(
          <button key={s.id} onClick={()=>{setIngSubView(s.id);setEditing(null);setAdding(null);}}
            style={{padding:"8px 14px",background:"none",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s",whiteSpace:"nowrap",
              borderBottom:ingSubView===s.id?`2px solid ${s.c}`:"2px solid transparent",
              color:ingSubView===s.id?s.c:"#555"}}>
            {s.l}
            <span style={{marginLeft:6,fontSize:10,color:ingSubView===s.id?s.c:"#444",background:"#1a1a1a",padding:"1px 6px",borderRadius:8}}>
              {ingredients.filter(i=>(i.category||"main")===s.id).length}
            </span>
          </button>
        ))}
        <button style={{...BSS,marginLeft:"auto",padding:"5px 12px",fontSize:11}} onClick={startAdd}>+ เพิ่ม</button>
      </div>
    )}

    {/* Sub-tabs for บรรจุภัณฑ์ */}
    {view==="pack"&&(
      <div style={{display:"flex",alignItems:"center",background:"#111",borderBottom:"1px solid #1e1e1e",padding:"0 4px",marginBottom:14}}>
        {[{id:"ถุง",l:"🛍️ ถุง",c:"#3db8e0"},{id:"กล่อง",l:"📦 กล่อง",c:"#e09b3d"},{id:"สติกเกอร์",l:"🏷️ สติกเกอร์",c:"#b06aff"}].map(s=>(
          <button key={s.id} onClick={()=>{setPackSubView(s.id);setEditing(null);setAdding(null);}}
            style={{padding:"8px 14px",background:"none",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s",whiteSpace:"nowrap",
              borderBottom:packSubView===s.id?`2px solid ${s.c}`:"2px solid transparent",
              color:packSubView===s.id?s.c:"#555"}}>
            {s.l}
            <span style={{marginLeft:6,fontSize:10,color:packSubView===s.id?s.c:"#444",background:"#1a1a1a",padding:"1px 6px",borderRadius:8}}>
              {packaging.filter(p=>(p.category||"ถุง")===s.id).length}
            </span>
          </button>
        ))}
        <button style={{...BSS,marginLeft:"auto",padding:"5px 12px",fontSize:11}} onClick={startAdd}>+ เพิ่ม</button>
      </div>
    )}

    {view==="log"&&<div style={{marginBottom:14}}/>}

    {view==="log"&&(<div>
      {!batchGroups.length?<Card><div style={{textAlign:"center",padding:40,color:"#555"}}>ยังไม่มีประวัติ</div></Card>:(
        batchGroups.map(grp=>{
          const isBatch=!!grp.batchNo;const isOpen=!!expandedBatch[grp.key];
          const isReceive=!!grp.isReceive;
          const ingItems=grp.items.filter(x=>x.itemType==="ing");const packItems=grp.items.filter(x=>x.itemType==="pack");
          return(<div key={grp.key} style={{marginBottom:8}}>
            <div onClick={()=>setExpandedBatch(e=>({...e,[grp.key]:!e[grp.key]}))} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:isOpen?"#1a2a12":"#161616",border:`1px solid ${isOpen?"#7ab64844":"#2a2a2a"}`,borderRadius:isOpen?"12px 12px 0 0":"12px",cursor:"pointer",transition:"all .2s"}}>
              <span style={{fontSize:12,transition:"transform .2s",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
              {isBatch?<span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#7ab648",background:"#1d3a10",padding:"2px 8px",borderRadius:5,border:"1px solid #7ab64833",minWidth:80,textAlign:"center"}}>#{String(grp.batchNo).padStart(4,"0")}</span>
                :isReceive?<span style={{fontSize:12,color:"#3db8e0",background:"#071422",padding:"2px 8px",borderRadius:5,border:"1px solid #3db8e033",minWidth:80,textAlign:"center"}}>📥 รับของ</span>
                :<span style={{fontFamily:"monospace",fontSize:12,color:"#e09b3d",background:"#1f1400",padding:"2px 8px",borderRadius:5,border:"1px solid #e09b3d33",minWidth:80,textAlign:"center"}}>ปรับด้วยมือ</span>}
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:"#ddd"}}>{grp.reason||"ปรับสต็อก"}</div>
                <div style={{fontSize:11,color:"#666"}}>📅 {grp.date} · ⏰ {grp.time} · {grp.items.length} รายการ {grp.adjustedBy&&<span style={{color:"#7ab648"}}>· ✅ {grp.adjustedBy}</span>}</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                {ingItems.length>0&&<span style={{fontSize:11,color:"#7ab648",background:"#0a1f06",padding:"2px 8px",borderRadius:5}}>🌿 {ingItems.length}</span>}
                {packItems.length>0&&<span style={{fontSize:11,color:"#3db8e0",background:"#071422",padding:"2px 8px",borderRadius:5}}>📦 {packItems.length}</span>}
              </div>
            </div>
            {isOpen&&(<div style={{border:"1px solid #7ab64822",borderTop:"none",borderRadius:"0 0 12px 12px",overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr style={{background:"#111"}}>{["รายการ","ประเภท","ก่อน","เปลี่ยนแปลง","หลัง"].map(h=><th key={h} style={{padding:"7px 14px",textAlign:"left",color:"#555",fontSize:10,fontWeight:700,textTransform:"uppercase",borderBottom:"1px solid #222"}}>{h}</th>)}</tr></thead>
                <tbody>
                  {grp.items.map((l,i)=>{const pos=l.change>0;return(<tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                    <td style={{...TD,fontSize:12}}><span style={{color:l.itemType==="ing"?"#7ab648":"#3db8e0"}}>{l.itemType==="ing"?"🌿":"📦"}</span> {l.itemName}</td>
                    <td style={{...TD,fontSize:11,color:"#555"}}>{l.itemType==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                    <td style={{...TD,fontFamily:"monospace",fontSize:12}}>{fmt(l.before)}</td>
                    <td style={{...TD,fontFamily:"monospace",fontWeight:700,fontSize:12,color:pos?"#7ab648":"#ff6b6b"}}>{pos?"+":""}{fmt(l.change)}</td>
                    <td style={{...TD,fontFamily:"monospace",fontWeight:700,fontSize:12,color:"#fff"}}>{fmt(l.after)}</td>
                  </tr>);})}
                </tbody>
              </table>
            </div>)}
          </div>);
        })
      )}
    </div>)}

    {(view==="ing"||view==="pack")&&(<Card>
      <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr>{["≡","รหัส","ชื่อ","หน่วย","จำนวนคงเหลือ","ขั้นต่ำ","สถานะ",""].map(h=><TH key={h} style={{color:accent}}>{h}</TH>)}</tr></thead>
          <tbody>
            {list.map((item,i)=>{
              const st=itemStatus(item);
              const isE=(f)=>editing?.id===item.id&&editing?.field===f;
              const isDragTarget=dragOver===i;
              return(<tr key={item.id}
                draggable onDragStart={()=>onDragStart(i)} onDragEnter={()=>onDragEnter(i)} onDragEnd={onDragEnd} onDragOver={e=>e.preventDefault()}
                style={{background:isDragTarget?"#1d3a10":i%2===0?"#1a1a1a":"#141414",borderLeft:st.level>0?`3px solid ${st.color}`:"3px solid transparent",borderTop:isDragTarget?"2px solid #7ab648":"2px solid transparent",opacity:dragItem.current===i?.5:1,transition:"background .1s"}}>
                <td style={{...TD,width:28,cursor:"grab",color:"#444",fontSize:16,textAlign:"center",userSelect:"none"}}>⠿</td>
                <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{item.id}</td>
                <td style={TD}>{isE("name")?<IE value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333"}} onClick={()=>setEditing({id:item.id,field:"name",value:item.name})}>{item.name}</span>}</td>
                {/* Unit column - dropdown */}
                <td style={TD}>
                  <select value={item.unit} onChange={e=>changeUnit(item,e.target.value)}
                    style={{...SI,padding:"4px 8px",fontSize:12,width:"auto",color:"#e09b3d",
                      border:"1px solid #3a3a3a",background:"#1a1a1a",borderRadius:6,cursor:"pointer",fontWeight:700}}>
                    <option value="กรัม">กรัม</option>
                    <option value="กิโลกรัม">กิโลกรัม</option>
                  </select>
                </td>
                <td style={TD}>{isE("qty")?<IE type="number" value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={140}/>
                  :<span style={{cursor:"pointer",borderBottom:"1px dashed #333",fontFamily:"monospace",fontWeight:700,color:st.level>0?st.color:accent}} onClick={()=>setEditing({id:item.id,field:"qty",value:item.qty})}>{fmt(item.qty)}</span>}</td>
                <td style={TD}>{isE("minQty")?<IE type="number" value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={120}/>
                  :<span style={{cursor:"pointer",borderBottom:"1px dashed #333",fontFamily:"monospace",fontSize:12,color:"#e09b3d"}} onClick={()=>setEditing({id:item.id,field:"minQty",value:item.minQty||0})}>{fmt(item.minQty||0)}</span>}</td>
                <td style={TD}><span style={{background:st.bg,color:st.color,padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700,border:`1px solid ${st.color}33`,whiteSpace:"nowrap"}}>{st.level>0?"⚠️ ":""}{st.label}</span></td>
                <td style={{...TD,whiteSpace:"nowrap"}}>
                  <button onClick={()=>openReceive(item)} title="รับของเข้าคลัง" style={{background:"#071422",border:"1px solid #3db8e033",color:"#3db8e0",borderRadius:7,padding:"4px 8px",cursor:"pointer",fontSize:12,marginRight:4}}>📥 รับ</button>
                  <button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:15,opacity:.6}} onClick={()=>deleteItem(item.id)}>🗑</button>
                </td>
              </tr>);
            })}
            {adding&&(<tr style={{background:"#0f1f08"}}>
              <td style={TD}></td>
              <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{adding.id}</td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13}} value={adding.name} onChange={e=>setAdding({...adding,name:e.target.value})} placeholder="ชื่อ" autoFocus/></td>
              <td style={TD}>
                <div style={{display:"flex",gap:4}}>
                  {["กรัม","กิโลกรัม"].map(u=>(
                    <button key={u} onClick={()=>setAdding({...adding,unit:u})}
                      style={{padding:"4px 10px",borderRadius:6,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",
                        background:adding.unit===u?"#e09b3d":"#1e1e1e",color:adding.unit===u?"#fff":"#777",transition:"all .2s"}}>
                      {u==="กรัม"?"ก.":"กก."}
                    </button>
                  ))}
                </div>
              </td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:110,fontFamily:"monospace"}} type="number" value={adding.qty} onChange={e=>setAdding({...adding,qty:parseFloat(e.target.value)||0})}/></td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:100,fontFamily:"monospace",color:"#e09b3d"}} type="number" placeholder="ขั้นต่ำ" value={adding.minQty||0} onChange={e=>setAdding({...adding,minQty:parseFloat(e.target.value)||0})}/></td>
              <td style={TD}></td>
              <td style={TD}>
                <button style={{background:"#7ab648",border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,marginRight:4}} onClick={commitAdd}>✓</button>
                <button style={{background:"#333",border:"none",color:"#aaa",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12}} onClick={()=>setAdding(null)}>✕</button>
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11,color:"#444",padding:"8px 4px"}}>💡 <b style={{color:"#666"}}>⠿ ลากเพื่อเรียงลำดับ</b> · คลิกค่าเพื่อแก้ไข · <span style={{color:"#3db8e0"}}>📥 รับ</span> = รับของเข้าคลัง · เปลี่ยนหน่วยได้ที่ dropdown หน่วย</div>
    </Card>)}
  </div>);
}


// ══════════════════════════════════════════════════════════════
//  RECIPES PAGE
// ══════════════════════════════════════════════════════════════
function RecipesPage({recipes,ingredients,packaging,onUpdate}){
  const [sel,setSel]=useState(recipes[0]?.id||"");
  const [addingRec,setAddingRec]=useState(false);
  const [newName,setNewName]=useState("");
  const recipe=recipes.find(r=>r.id===sel);
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};
  const addRecipe=()=>{if(!newName.trim())return;const id="REC"+String(Date.now()).slice(-5);onUpdate([...recipes,{id,name:newName.trim(),packaging:{bagsPerKg:1,bagsPerBox:20,packId:"",boxId:""},items:[]}]);setSel(id);setAddingRec(false);setNewName("");};
  const delRecipe=(id)=>{if(!window.confirm("ลบสูตรนี้?"))return;const u=recipes.filter(r=>r.id!==id);onUpdate(u);setSel(u[0]?.id||"");};
  const updItems=(items)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,items}));
  const updPack=(field,val)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,packaging:{
    ...(r.packaging||{bagsPerKg:1,bagsPerBox:20,packId:"",boxId:""}),
    [field]:(field==="packId"||field==="boxId")?val:(parseFloat(val)||1)
  }}));
  const addItem=()=>{const used=recipe?.items.map(i=>i.ingredientId)||[];const avail=ingredients.filter(i=>!used.includes(i.id));if(!avail.length)return;updItems([...(recipe?.items||[]),{ingredientId:avail[0].id,amountPerKg:0}]);};
  const updItem=(id,field,value)=>updItems(recipe.items.map(it=>it.ingredientId!==id?it:{...it,[field]:field==="amountPerKg"?parseFloat(value)||0:value}));
  return(<div style={{display:"grid",gridTemplateColumns:"min(220px,100%) 1fr",gap:14}} className="fu">
    <div><Card>
      <CT style={{marginBottom:12}}>สูตรทั้งหมด</CT>
      {recipes.map(r=><div key={r.id} onClick={()=>setSel(r.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,marginBottom:4,background:sel===r.id?"#1d3a10":"transparent",border:sel===r.id?"1px solid #7ab64866":"1px solid transparent",cursor:"pointer"}}>
        <span style={{flex:1,fontSize:13,color:sel===r.id?"#7ab648":"#bbb"}}>🍵 {r.name}</span>
        <button onClick={e=>{e.stopPropagation();delRecipe(r.id);}} style={{background:"none",border:"none",color:"#ff444444",cursor:"pointer",fontSize:13,padding:2}}>🗑</button>
      </div>)}
      {addingRec?(<div style={{marginTop:10}}>
        <input style={{...SI,marginBottom:8}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="ชื่อสูตรใหม่" autoFocus onKeyDown={e=>e.key==="Enter"&&addRecipe()}/>
        <div style={{display:"flex",gap:6}}><Btn style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={addRecipe}>เพิ่ม</Btn><BtnSec style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={()=>setAddingRec(false)}>ยกเลิก</BtnSec></div>
      </div>):<button style={{...BSS,width:"100%",marginTop:10,fontSize:12,padding:"8px"}} onClick={()=>setAddingRec(true)}>+ สูตรใหม่</button>}
    </Card></div>
    <div>{recipe?(<>
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><CT style={{margin:0}}>{recipe.name}</CT><span style={{fontSize:11,color:"#555"}}>ปริมาณต่อผงชา 1 กก.</span></div>
        <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>
              {["วัตถุดิบ","ปริมาณ","หน่วย",""].map(h=><TH key={h}>{h}</TH>)}
            </tr></thead>
            <tbody>{recipe.items.map((item,i)=>{
              const ing=ingredients.find(x=>x.id===item.ingredientId);
              // itemUnit เก็บหน่วยแสดงผลของแต่ละแถว (default จากหน่วยของวัตถุดิบ)
              const itemDisplayUnit=item.displayUnit||(ing&&isWeightUnit(ing.unit)?ing.unit:"กรัม");
              const displayAmt=itemDisplayUnit==="กิโลกรัม"
                ?Math.round(item.amountPerKg/1000*10000)/10000
                :item.amountPerKg;
              return(<tr key={item.ingredientId} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                <td style={TD}><select style={{...SI,padding:"5px 10px",fontSize:13}} value={item.ingredientId} onChange={e=>updItem(item.ingredientId,"ingredientId",e.target.value)}>{ingredients.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select></td>
                <td style={TD}><input style={{...SI,padding:"5px 10px",fontSize:13,width:130,fontFamily:"monospace"}} type="number" step="0.001"
                  value={displayAmt}
                  onChange={e=>{
                    const v=parseFloat(e.target.value)||0;
                    const inGrams=itemDisplayUnit==="กิโลกรัม"?v*1000:v;
                    updItem(item.ingredientId,"amountPerKg",inGrams);
                  }}/></td>
                <td style={TD}>
                  <select value={itemDisplayUnit}
                    onChange={e=>{
                      const newU=e.target.value;
                      // แปลงค่า amountPerKg ให้ถูกต้องเมื่อเปลี่ยนหน่วย
                      const currentInGrams=item.amountPerKg;
                      updItems(recipe.items.map(it=>it.ingredientId!==item.ingredientId?it:{...it,displayUnit:newU}));
                    }}
                    style={{...SI,padding:"4px 8px",fontSize:12,width:"auto",color:"#e09b3d",
                      border:"1px solid #3a3a3a",background:"#1a1a1a",borderRadius:6,cursor:"pointer",fontWeight:700}}>
                    <option value="กรัม">กรัม</option>
                    <option value="กิโลกรัม">กิโลกรัม</option>
                  </select>
                </td>
                <td style={TD}><button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:14,opacity:.7}} onClick={()=>updItems(recipe.items.filter(it=>it.ingredientId!==item.ingredientId))}>🗑</button></td>
              </tr>);})}
            </tbody>
          </table>
        </div>
        <button style={{...BSS,marginTop:12,fontSize:12,padding:"7px 14px"}} onClick={addItem}>+ เพิ่มวัตถุดิบในสูตร</button>
      </Card>
      <Card>
        <CT>📦 การบรรจุภัณฑ์ของสูตรนี้</CT>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
          {/* ถุงฟอย */}
          <div style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"14px"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#3db8e0",marginBottom:6}}>📦 ถุงบรรจุ</div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:10,color:"#555",display:"block",marginBottom:4}}>เลือกรายการบรรจุภัณฑ์</label>
              <select value={recPack.packId||""} onChange={e=>updPack("packId",e.target.value)}
                style={{...SI,padding:"6px 10px",fontSize:13,color:"#3db8e0",border:"1px solid #3db8e044",background:"#0a1520",borderRadius:7}}>
                <option value="">— เลือกบรรจุภัณฑ์ —</option>
                {packaging.map(p=><option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
              </select>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <input type="number" min="0.01" step="0.01" value={recPack.bagsPerKg}
                onChange={e=>updPack("bagsPerKg",e.target.value)}
                style={{...SI,width:90,padding:"7px 10px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:"#3db8e0",textAlign:"center"}}/>
              <span style={{fontSize:12,color:"#777"}}>ถุง / กก.</span>
            </div>
            <div style={{fontSize:11,color:"#555"}}>500 กก. → {fmt(500*recPack.bagsPerKg,0)} ถุง</div>
          </div>
          {/* กล่องลัง */}
          <div style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"14px"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#e09b3d",marginBottom:6}}>📫 กล่องลัง</div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:10,color:"#555",display:"block",marginBottom:4}}>เลือกรายการบรรจุภัณฑ์</label>
              <select value={recPack.boxId||""} onChange={e=>updPack("boxId",e.target.value)}
                style={{...SI,padding:"6px 10px",fontSize:13,color:"#e09b3d",border:"1px solid #e09b3d44",background:"#1a0f00",borderRadius:7}}>
                <option value="">— เลือกบรรจุภัณฑ์ —</option>
                {packaging.map(p=><option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
              </select>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <input type="number" min="1" step="1" value={recPack.bagsPerBox}
                onChange={e=>updPack("bagsPerBox",e.target.value)}
                style={{...SI,width:90,padding:"7px 10px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:"#e09b3d",textAlign:"center"}}/>
              <span style={{fontSize:12,color:"#777"}}>ถุง / กล่อง</span>
            </div>
            <div style={{fontSize:11,color:"#555"}}>500 กก. → {Math.ceil(500*recPack.bagsPerKg/recPack.bagsPerBox)} ใบ</div>
          </div>
        </div>
      </Card>
    </>):<Card><div style={{color:"#555",textAlign:"center",padding:40}}>เลือกสูตรจากรายการด้านซ้าย</div></Card>}
    </div>
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  HISTORY PAGE  (PIN Modal for stock adjust)
// ══════════════════════════════════════════════════════════════
function HistoryPage({history,ingredients,packaging,onUpdate,onStockAdjust,authorizedUsers,pinLockout,onUpdateLockout,currentUser}){
  const [editId,setEditId]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [showPin,setShowPin]=useState(false);
  const [pendingEdit,setPendingEdit]=useState(null);
  // Filter states
  const [filterMode,setFilterMode]=useState("all"); // all | day | week | month | range
  const [filterDate,setFilterDate]=useState(""); // single date YYYY-MM-DD
  const [filterFrom,setFilterFrom]=useState("");
  const [filterTo,setFilterTo]=useState("");
  const [filterRecipe,setFilterRecipe]=useState("__all__");

  const parseHistDate=(d)=>{
    if(!d)return null;
    const p=d.split("/");
    if(p.length!==3)return null;
    const y=parseInt(p[2])>2500?parseInt(p[2])-543:parseInt(p[2]);
    return new Date(y,parseInt(p[1])-1,parseInt(p[0]));
  };

  const filteredHistory=useMemo(()=>{
    let list=[...history];
    // Recipe filter
    if(filterRecipe!=="__all__")list=list.filter(h=>h.recipeId===filterRecipe);
    // Date filter
    const today=new Date();today.setHours(0,0,0,0);
    if(filterMode==="day"&&filterDate){
      const d=new Date(filterDate);
      list=list.filter(h=>{const hd=parseHistDate(h.date);return hd&&hd.toDateString()===d.toDateString();});
    } else if(filterMode==="week"){
      const weekAgo=new Date(today);weekAgo.setDate(today.getDate()-7);
      list=list.filter(h=>{const hd=parseHistDate(h.date);return hd&&hd>=weekAgo&&hd<=today;});
    } else if(filterMode==="month"){
      const monthAgo=new Date(today);monthAgo.setDate(today.getDate()-30);
      list=list.filter(h=>{const hd=parseHistDate(h.date);return hd&&hd>=monthAgo&&hd<=today;});
    } else if(filterMode==="range"&&filterFrom&&filterTo){
      const from=new Date(filterFrom);const to=new Date(filterTo);to.setHours(23,59,59);
      list=list.filter(h=>{const hd=parseHistDate(h.date);return hd&&hd>=from&&hd<=to;});
    }
    return list;
  },[history,filterMode,filterDate,filterFrom,filterTo,filterRecipe]);

  // unique recipes in history
  const recipeOptions=useMemo(()=>{
    const seen={};
    history.forEach(h=>{if(h.recipeId&&!seen[h.recipeId])seen[h.recipeId]=h.recipeName;});
    return Object.entries(seen).map(([id,name])=>({id,name}));
  },[history]);

  const startEdit=(h,i)=>{
    setEditId(i);
    setEditForm({
      recipeName:h.recipeName,kg:h.kg,operator:h.operator||"",note:h.note||"",
      bags:h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,
      boxes:h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0,
      adjustStock:false
    });
  };

  const handleSaveClick=(i)=>{
    if(editForm.adjustStock){
      // Require PIN
      setPendingEdit({index:i,form:editForm});
      setShowPin(true);
    } else {
      commitEdit(i,editForm,null);
    }
  };

  const onPinSuccess=(user)=>{
    setShowPin(false);
    if(pendingEdit) commitEdit(pendingEdit.index,pendingEdit.form,user);
    setPendingEdit(null);
  };

  const commitEdit=(i,form,approvedBy)=>{
    const h=history[i];
    const editorName=approvedBy?approvedBy.name:currentUser?.displayName||"ไม่ระบุ";
    const editorRole=approvedBy?approvedBy.role:currentUser?.role||"";
    const newDed=(h.deductions||[]).map(d=>{
      if(d.name?.includes("ถุงฟอย"))return{...d,amount:parseFloat(form.bags)||d.amount};
      if(d.name?.includes("กล่องลัง"))return{...d,amount:parseFloat(form.boxes)||d.amount};
      return d;
    });
    const updated=history.map((hh,j)=>j!==i?hh:{
      ...hh,recipeName:form.recipeName,kg:parseFloat(form.kg)||hh.kg,
      operator:form.operator,note:form.note,deductions:newDed,
      lastEditBy:editorName,
      lastEditRole:editorRole,
      lastEditDate:todayStr(),lastEditTime:timeStr()
    });
    onUpdate(updated);

    if(approvedBy&&form.adjustStock){
      (h.deductions||[]).forEach(d=>{
        const newAmt=d.name?.includes("ถุงฟอย")?parseFloat(form.bags)||d.amount:d.name?.includes("กล่องลัง")?parseFloat(form.boxes)||d.amount:d.amount;
        const diff=newAmt-d.amount;
        if(diff!==0){
          const currentList=d.type==="ing"?ingredients:packaging;
          const item=currentList.find(x=>x.id===d.id);
          if(item) onStockAdjust(d.type,d.id,d.name,item.qty,item.qty-diff,approvedBy.name,`แก้ไขประวัติ Batch #${String(h.batchNo||0).padStart(4,"0")} อนุมัติโดย ${approvedBy.name} (${approvedBy.role})`);
        }
      });
    }
    setEditId(null);
  };

  const deleteEntry=(i)=>{if(!window.confirm("ลบรายการนี้?"))return;onUpdate(history.filter((_,j)=>j!==i));};

  if(!history.length)return<Card><div style={{textAlign:"center",padding:60,color:"#555"}}><div style={{fontSize:44,marginBottom:12}}>📋</div>ยังไม่มีประวัติ</div></Card>;

  return(<div className="fu">
    {showPin&&<PinModal authorizedUsers={authorizedUsers} lockout={pinLockout} onSuccess={onPinSuccess} onCancel={()=>{setShowPin(false);setPendingEdit(null);}} onUpdateLockout={onUpdateLockout} title="ยืนยันการปรับสต็อก"/>}

    {/* Stats from filtered */}
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      {[{l:"แสดงผล",v:filteredHistory.length,u:`จาก ${history.length} Batch`,c:"#7ab648"},
        {l:"ผลิตรวม",v:fmt(filteredHistory.reduce((a,h)=>a+h.kg,0),0),u:"กก.",c:"#7ab648"},
        {l:"ถุงฟอย",v:fmt(filteredHistory.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0),0),0),u:"ถุง",c:"#3db8e0"},
        {l:"กล่องลัง",v:fmt(filteredHistory.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0),0),0),u:"ใบ",c:"#e09b3d"},
      ].map((s,i)=><div key={i} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"10px 16px",flex:"1 1 120px"}}>
        <div style={{fontSize:10,color:"#666",marginBottom:3,textTransform:"uppercase",letterSpacing:".5px"}}>{s.l}</div>
        <div style={{fontFamily:"monospace",fontSize:19,fontWeight:800,color:s.c}}>{s.v}</div>
        <div style={{fontSize:11,color:"#555"}}>{s.u}</div>
      </div>)}
    </div>

    {/* Filter bar */}
    <Card style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:12,fontWeight:700,color:"#7ab648"}}>🔍 กรอง:</span>
        {[{id:"all",l:"ทั้งหมด"},{id:"day",l:"วันที่"},{id:"week",l:"7 วันล่าสุด"},{id:"month",l:"30 วันล่าสุด"},{id:"range",l:"ช่วงวันที่"}].map(f=>(
          <button key={f.id} onClick={()=>setFilterMode(f.id)} style={{padding:"5px 12px",borderRadius:7,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",background:filterMode===f.id?"#7ab648":"#1e1e1e",color:filterMode===f.id?"#fff":"#888",transition:"all .2s"}}>{f.l}</button>
        ))}
        {recipeOptions.length>1&&(
          <select value={filterRecipe} onChange={e=>setFilterRecipe(e.target.value)}
            style={{...SI,padding:"5px 10px",fontSize:12,width:"auto",marginLeft:"auto",color:"#aaa",border:"1px solid #2a2a2a"}}>
            <option value="__all__">🍵 ทุกสูตร</option>
            {recipeOptions.map(r=><option key={r.id} value={r.id}>🍵 {r.name}</option>)}
          </select>
        )}
      </div>
      {filterMode==="day"&&(
        <div style={{marginTop:10}}>
          <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)}
            style={{...SI,padding:"7px 10px",fontSize:13,width:"auto",color:"#ddd"}}/>
        </div>
      )}
      {filterMode==="range"&&(
        <div style={{display:"flex",gap:10,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
          <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}
            style={{...SI,padding:"7px 10px",fontSize:13,width:"auto",color:"#ddd"}}/>
          <span style={{color:"#555",fontSize:12}}>ถึง</span>
          <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)}
            style={{...SI,padding:"7px 10px",fontSize:13,width:"auto",color:"#ddd"}}/>
        </div>
      )}
      {filteredHistory.length<history.length&&(
        <div style={{marginTop:8,fontSize:11,color:"#ff9800"}}>แสดง {filteredHistory.length} จาก {history.length} Batch</div>
      )}
    </Card>

    {filteredHistory.length===0&&<Card><div style={{textAlign:"center",padding:30,color:"#555"}}>ไม่พบประวัติในช่วงที่เลือก</div></Card>}
    {filteredHistory.map((h,i)=>(
      <Card key={i} style={{marginBottom:10}}>
        {editId===i?(
          <div>
            <div style={{fontSize:12,color:"#ff9800",marginBottom:12,background:"#1f1200",border:"1px solid #ff980033",borderRadius:7,padding:"8px 12px"}}>
              ✏️ แก้ไขประวัติ Batch #{String(h.batchNo||0).padStart(4,"0")}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:12}}>
              <Field label="ชื่อสูตร"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.recipeName} onChange={e=>setEditForm({...editForm,recipeName:e.target.value})}/></Field>
              <Field label="น้ำหนัก (กก.)"><input style={{...SI,padding:"6px 10px",fontSize:13}} type="number" value={editForm.kg} onChange={e=>setEditForm({...editForm,kg:e.target.value})}/></Field>
              <Field label="ผู้บันทึก"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.operator} onChange={e=>setEditForm({...editForm,operator:e.target.value})}/></Field>
              <Field label="ถุงฟอย (ถุง)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#3db8e0"}} type="number" value={editForm.bags} onChange={e=>setEditForm({...editForm,bags:e.target.value})}/></Field>
              <Field label="กล่องลัง (ใบ)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#e09b3d"}} type="number" value={editForm.boxes} onChange={e=>setEditForm({...editForm,boxes:e.target.value})}/></Field>
              <Field label="หมายเหตุ"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.note} onChange={e=>setEditForm({...editForm,note:e.target.value})}/></Field>
            </div>

            {/* Stock adjust toggle */}
            <div style={{background:"#111",border:"1px solid #2a2a2a",borderRadius:10,padding:"14px",marginBottom:12}}>
              <label style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <div onClick={()=>setEditForm({...editForm,adjustStock:!editForm.adjustStock})}
                  style={{width:42,height:24,borderRadius:12,background:editForm.adjustStock?"#4a8020":"#333",position:"relative",transition:"background .2s",cursor:"pointer",flexShrink:0}}>
                  <div style={{position:"absolute",top:4,left:editForm.adjustStock?20:4,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:editForm.adjustStock?"#7ab648":"#aaa"}}>
                    🔐 ปรับสต็อกด้วย
                    {editForm.adjustStock&&<span style={{fontSize:11,color:"#888",marginLeft:8,fontWeight:400}}>— จะขอ PIN ผู้มีอำนาจ</span>}
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:2}}>
                    {editForm.adjustStock?"ต้องกรอก PIN 6 หลักของผู้มีอำนาจ — ระบบจะ update สต็อกและบันทึก audit log อัตโนมัติ":"เปิดเพื่ออัปเดตสต็อกปัจจุบันด้วย (ต้องการ PIN)"}
                  </div>
                </div>
              </label>
              {editForm.adjustStock&&!authorizedUsers.length&&(
                <Alert type="warn" style={{marginTop:10}}>⚠️ ยังไม่มีผู้มีอำนาจในระบบ — กรุณาเพิ่มใน เมนู 🔑 Settings ก่อน</Alert>
              )}
            </div>

            <div style={{display:"flex",gap:8}}>
              <Btn style={{padding:"8px 16px",fontSize:12}} onClick={()=>handleSaveClick(i)} disabled={editForm.adjustStock&&!authorizedUsers.length}>
                💾 {editForm.adjustStock?"บันทึก + กรอก PIN":"บันทึก"}
              </Btn>
              <BtnSec style={{padding:"8px 14px",fontSize:12}} onClick={()=>setEditId(null)}>ยกเลิก</BtnSec>
            </div>
          </div>
        ):(
          <div>
            <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
              <div style={{background:"#111",border:"1px solid #7ab64833",borderRadius:10,padding:"8px 10px",textAlign:"center",minWidth:62,flexShrink:0}}>
                <div style={{fontFamily:"monospace",fontSize:10,color:"#4a6a38",marginBottom:1}}>BATCH</div>
                <div style={{fontFamily:"monospace",fontSize:14,fontWeight:800,color:"#7ab648"}}>{String(h.batchNo||0).padStart(4,"0")}</div>
                <div style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:"#5a8a38",marginTop:2}}>{fmt(h.kg,0)}<span style={{fontSize:9,marginLeft:2}}>กก.</span></div>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:3}}>🍵 {h.recipeName}</div>
                <div style={{fontSize:12,color:"#777"}}>📅 {h.date} · ⏰ {h.time}{h.operator&&<> · 👤 {h.operator}</>}{h.note&&<span style={{color:"#555"}}> · {h.note}</span>}</div>
                {h.lastEditBy&&(
                  <div style={{fontSize:11,marginTop:4,background:"#1a1400",border:"1px solid #e09b3d33",borderRadius:6,padding:"4px 10px",display:"inline-block"}}>
                    <span style={{color:"#e09b3d"}}>✅ แก้ไขสต็อกโดย: </span>
                    <b style={{color:"#fff"}}>{h.lastEditBy}</b>
                    {h.lastEditRole&&<span style={{color:"#888"}}> ({h.lastEditRole})</span>}
                    <span style={{color:"#666"}}> · {h.lastEditDate} {h.lastEditTime}</span>
                  </div>
                )}
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                {[{i:"📦",v:fmt(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,0),l:"ถุง",c:"#3db8e0"},
                  {i:"📫",v:fmt(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0,0),l:"ลัง",c:"#e09b3d"}].map((p,j)=>(
                  <div key={j} style={{background:"#111",border:`1px solid ${p.c}33`,borderRadius:8,padding:"5px 10px",textAlign:"center",minWidth:48}}>
                    <div style={{fontSize:10}}>{p.i}</div>
                    <div style={{fontFamily:"monospace",fontWeight:800,color:p.c,fontSize:13}}>{p.v}</div>
                    <div style={{fontSize:10,color:"#555"}}>{p.l}</div>
                  </div>
                ))}
                <button onClick={()=>startEdit(h,i)} style={{background:"#1a2a14",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>✏️ แก้ไข</button>
                <button onClick={()=>deleteEntry(i)} style={{background:"#2a1010",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🗑</button>
              </div>
            </div>
            {h.deductions?.filter(d=>d.type==="ing").length>0&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,paddingTop:10,marginTop:10,borderTop:"1px solid #1a1a1a"}}>
                {h.deductions.filter(d=>d.type==="ing").map((d,j)=>(
                  <div key={j} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:7,padding:"4px 10px",fontSize:11}}>
                    <span style={{color:"#888"}}>{d.name}: </span>
                    <span style={{fontFamily:"monospace",color:"#ff8080",fontWeight:700}}>-{fmt(d.amount)}</span>
                    <span style={{color:"#555"}}> {d.unit}</span>
                    <span style={{color:"#333"}}> → {fmt(d.after)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </Card>
    ))}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
