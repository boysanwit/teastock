<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตัดสต็อกการผลิตชา</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#ddd;font-family:'Noto Sans Thai',sans-serif}
select,input,button{font-family:'Noto Sans Thai',sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fu{animation:fadeUp .25s ease}
.shake{animation:shake .4s ease}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
/* PIN overlay */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.pin-box{background:#161616;border:1px solid #2a2a2a;border-radius:20px;padding:32px 28px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#2a2a2a;border:2px solid #3a3a3a;transition:all .15s}
.pin-dot.filled{background:#7ab648;border-color:#7ab648;box-shadow:0 0 8px rgba(122,182,72,.5)}
.pin-dot.error{background:#ff4444;border-color:#ff4444}
.pin-key{width:72px;height:52px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;color:#ddd;font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Noto Sans Thai',sans-serif}
.pin-key:hover{background:#2a2a2a;border-color:#3a3a3a}
.pin-key:active{background:#333;transform:scale(.95)}
.pin-key.del{color:#ff6b6b;font-size:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useRef}=React;
const LS="tea_stock_v5";
const load=()=>{try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch{}return null;};
const save=s=>{try{localStorage.setItem(LS,JSON.stringify(s));}catch{}};

const DEF={
  ingredients:[
    {id:"RM001",name:"ชา 9060",unit:"กรัม",qty:500000,minQty:50000},
    {id:"RM002",name:"VP",unit:"กรัม",qty:10000,minQty:2000},
    {id:"RM003",name:"SY",unit:"กรัม",qty:10000,minQty:2000},
    {id:"RM004",name:"TZ",unit:"กรัม",qty:10000,minQty:2000},
    {id:"RM005",name:"CS",unit:"กรัม",qty:10000,minQty:2000},
  ],
  packaging:[
    {id:"PK001",name:"ถุงฟอย 1 กก.",unit:"ถุง",qty:10000,minQty:500},
    {id:"PK002",name:"กล่องลัง",unit:"ใบ",qty:1000,minQty:50},
  ],
  recipes:[{
    id:"REC001",name:"Red Eagle สีเข้ม",
    packaging:{bagsPerKg:1,bagsPerBox:20},
    items:[
      {ingredientId:"RM001",amountPerKg:1000},
      {ingredientId:"RM002",amountPerKg:5.18},
      {ingredientId:"RM003",amountPerKg:4.5},
      {ingredientId:"RM004",amountPerKg:4.5},
      {ingredientId:"RM005",amountPerKg:1.5},
    ]
  }],
  history:[],
  stockLog:[],
  batchCounter:1,
  // authorizedUsers: [{id, name, pin (hashed), role}]
  authorizedUsers:[],
  pinLockout:{attempts:0,lockedUntil:null}
};

// Simple hash (not cryptographic, but good enough for PIN storage in localStorage)
const hashPin=(pin)=>{
  let h=0;
  const salt="tea_sys_2025_";
  const s=salt+pin;
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return h.toString(36);
};

const fmt=(n,d=2)=>Number(n).toLocaleString("th-TH",{maximumFractionDigits:d});
const todayStr=()=>new Date().toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric"});
const timeStr=()=>new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
const genId=(prefix,list)=>{const max=list.reduce((m,i)=>Math.max(m,parseInt(i.id.replace(prefix,""))||0),0);return prefix+String(max+1).padStart(3,"0");};

// ─── SHARED STYLES ────────────────────────────────────────────
const SI={width:"100%",padding:"9px 12px",background:"#0f0f0f",border:"1.5px solid #2a2a2a",borderRadius:9,color:"#ddd",fontSize:14,outline:"none"};
const TD={padding:"9px 14px",borderBottom:"1px solid #1a1a1a",fontSize:13};
const BPS={background:"linear-gradient(135deg,#4a8020,#2d5016)",color:"#fff",border:"none",borderRadius:10,padding:"11px 22px",fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 3px 12px rgba(74,128,32,.3)"};
const BSS={background:"#1e1e1e",color:"#aaa",border:"1px solid #333",borderRadius:10,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"};

const Card=({children,style={}})=><div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:14,boxShadow:"0 4px 20px rgba(0,0,0,.4)",...style}}>{children}</div>;
const CT=({children,style={}})=><div style={{fontSize:14,fontWeight:800,color:"#7ab648",marginBottom:10,...style}}>{children}</div>;
const SL=({children})=><div style={{fontSize:10,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid #1e1e1e"}}>{children}</div>;
const Field=({label,children})=><div><label style={{display:"block",fontSize:10,fontWeight:700,color:"#7ab648",marginBottom:5,textTransform:"uppercase",letterSpacing:".7px"}}>{label}</label>{children}</div>;
const TH=({children,style={}})=><th style={{background:"#111",color:"#7ab648",padding:"9px 14px",textAlign:"left",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid #222",...style}}>{children}</th>;
const Btn=({children,onClick,disabled=false,style={}})=><button style={{...BPS,opacity:disabled?.45:1,...style}} onClick={onClick} disabled={disabled}>{children}</button>;
const BtnSec=({children,onClick,style={}})=><button style={{...BSS,...style}} onClick={onClick}>{children}</button>;
const Alert=({type,children})=>{const s={error:{bg:"#1f0808",bdr:"#ff444444",c:"#ff6b6b"},warn:{bg:"#1f1200",bdr:"#ff980044",c:"#ff9800"},ok:{bg:"#0e1f08",bdr:"#7ab64844",c:"#7ab648"},info:{bg:"#0a1525",bdr:"#3db8e044",c:"#3db8e0"}};return<div style={{background:s[type].bg,border:`1px solid ${s[type].bdr}`,color:s[type].c,borderRadius:9,padding:"9px 14px",fontSize:13,marginTop:10}}>{children}</div>;};
const Bdg=({color,children})=>{const c={red:{bg:"#3a0a0a",fg:"#ff4444",b:"#ff444433"},amber:{bg:"#2a1400",fg:"#ff9800",b:"#ff980033"},green:{bg:"#0a1f06",fg:"#7ab648",b:"#7ab64833"}};return<span style={{display:"inline-block",background:c[color].bg,color:c[color].fg,border:`1px solid ${c[color].b}`,fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:4,marginLeft:5}}>{children}</span>;};
const IE=({value,onChange,onOk,onCancel,type="text",width})=>(
  <div style={{display:"flex",gap:4,alignItems:"center"}}>
    <input style={{...SI,padding:"3px 8px",fontSize:13,width:width||"100%"}} type={type} value={value} onChange={e=>onChange(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==="Enter")onOk();if(e.key==="Escape")onCancel();}}/>
    <button style={{background:"#7ab648",border:"none",color:"#fff",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:12}} onClick={onOk}>✓</button>
    <button style={{background:"#333",border:"none",color:"#aaa",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:12}} onClick={onCancel}>✕</button>
  </div>
);
const itemStatus=(item)=>{
  const min=item.minQty||0;
  if(item.qty<=0)return{label:"หมด",color:"#ff4444",bg:"#3a0808",level:3};
  if(item.qty<=min)return{label:"ต่ำกว่าขั้นต่ำ",color:"#ff9800",bg:"#2a1400",level:2};
  if(item.qty<=min*1.5)return{label:"ใกล้ขั้นต่ำ",color:"#f0c040",bg:"#221a00",level:1};
  return{label:"ปกติ",color:"#7ab648",bg:"#0a1a06",level:0};
};

// ══════════════════════════════════════════════════════════════
//  PIN MODAL COMPONENT
// ══════════════════════════════════════════════════════════════
function PinModal({authorizedUsers,lockout,onSuccess,onCancel,onUpdateLockout,title="ยืนยันตัวตน"}){
  const [pin,setPin]=useState("");
  const [error,setError]=useState("");
  const [shake,setShake]=useState(false);
  const MAX_ATTEMPTS=3;
  const LOCKOUT_MINUTES=5;

  const now=Date.now();
  const isLocked=lockout.lockedUntil&&now<lockout.lockedUntil;
  const remainSec=isLocked?Math.ceil((lockout.lockedUntil-now)/1000):0;
  const [tick,setTick]=useState(0);
  useEffect(()=>{if(!isLocked)return;const t=setInterval(()=>setTick(x=>x+1),1000);return()=>clearInterval(t);},[isLocked]);

  const handleKey=(k)=>{
    if(isLocked)return;
    if(pin.length>=6)return;
    const next=pin+k;
    setPin(next);
    setError("");
    if(next.length===6) checkPin(next);
  };

  const handleDel=()=>{setPin(p=>p.slice(0,-1));setError("");};

  const checkPin=(p)=>{
    if(!authorizedUsers.length){setError("ยังไม่มีผู้มีอำนาจในระบบ กรุณาเพิ่มในเมนู ⚙️ Settings");setPin("");return;}
    const user=authorizedUsers.find(u=>u.pin===hashPin(p));
    if(user){
      onUpdateLockout({attempts:0,lockedUntil:null});
      onSuccess(user);
    } else {
      const attempts=(lockout.attempts||0)+1;
      if(attempts>=MAX_ATTEMPTS){
        const lockedUntil=Date.now()+LOCKOUT_MINUTES*60*1000;
        onUpdateLockout({attempts:0,lockedUntil});
        setError(`กรอก PIN ผิด ${MAX_ATTEMPTS} ครั้ง — ล็อก ${LOCKOUT_MINUTES} นาที`);
      } else {
        onUpdateLockout({attempts,lockedUntil:null});
        setError(`PIN ไม่ถูกต้อง (ความพยายามที่ ${attempts}/${MAX_ATTEMPTS})`);
      }
      setShake(true);setTimeout(()=>setShake(false),500);
      setPin("");
    }
  };

  const remainMin=Math.ceil(remainSec/60);

  return(
    <div className="pin-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="pin-box">
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:32,marginBottom:8}}>🔐</div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648",marginBottom:4}}>{title}</div>
          <div style={{fontSize:12,color:"#666"}}>กรอก PIN 6 หลักของผู้มีอำนาจอนุมัติ</div>
        </div>

        {/* PIN dots */}
        <div className={shake?"shake":""} style={{display:"flex",gap:12,justifyContent:"center",marginBottom:20}}>
          {Array.from({length:6}).map((_,i)=>(
            <div key={i} className={`pin-dot ${i<pin.length?(error?"error":"filled"):""}`}/>
          ))}
        </div>

        {isLocked?(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:36,marginBottom:8}}>🔒</div>
            <div style={{color:"#ff6b6b",fontWeight:700,fontSize:14,marginBottom:6}}>ระบบถูกล็อกชั่วคราว</div>
            <div style={{color:"#888",fontSize:13}}>กรุณารอ <b style={{color:"#ff9800",fontFamily:"monospace"}}>{Math.ceil((lockout.lockedUntil-Date.now())/1000)}</b> วินาที</div>
          </div>
        ):(
          <>
            {error&&<div style={{textAlign:"center",color:"#ff6b6b",fontSize:12,marginBottom:14,background:"#1f0808",border:"1px solid #ff444433",borderRadius:8,padding:"8px"}}>{error}</div>}
            {/* Keypad */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=>(
                k===""?<div key={i}/>:
                <button key={i} className={`pin-key ${k==="⌫"?"del":""}`}
                  onClick={k==="⌫"?handleDel:()=>handleKey(String(k))}>
                  {k}
                </button>
              ))}
            </div>
          </>
        )}

        <button onClick={onCancel} style={{width:"100%",background:"#1a1a1a",border:"1px solid #2a2a2a",color:"#888",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer"}}>ยกเลิก</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ROOT APP
// ══════════════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState("produce");
  const [state,setState]=useState(()=>{const s=load();return s?{...DEF,...s,batchCounter:s.batchCounter||1,authorizedUsers:s.authorizedUsers||[],pinLockout:s.pinLockout||{attempts:0,lockedUntil:null}}:DEF;});
  const upd=useCallback(patch=>setState(prev=>{const n={...prev,...patch};save(n);return n;}),[]);
  const {ingredients,packaging,recipes,history,stockLog,batchCounter,authorizedUsers,pinLockout}=state;

  const onProduce=(batch)=>{
    const no=batchCounter||1;
    const logs=[];
    const newIng=ingredients.map(i=>{
      const d=batch.deductions.find(x=>x.type==="ing"&&x.id===i.id);
      if(d){const after=Math.max(0,i.qty-d.amount);logs.push({batchNo:no,date:todayStr(),time:timeStr(),itemId:i.id,itemName:i.name,itemType:"ing",before:i.qty,change:-d.amount,after,reason:`Batch #${String(no).padStart(4,"0")} ผลิต: ${batch.recipeName}`});return{...i,qty:after};}
      return i;
    });
    const newPack=packaging.map(p=>{
      const d=batch.deductions.find(x=>x.type==="pack"&&x.id===p.id);
      if(d){const after=Math.max(0,p.qty-d.amount);logs.push({batchNo:no,date:todayStr(),time:timeStr(),itemId:p.id,itemName:p.name,itemType:"pack",before:p.qty,change:-d.amount,after,reason:`Batch #${String(no).padStart(4,"0")} ผลิต: ${batch.recipeName}`});return{...p,qty:after};}
      return p;
    });
    upd({ingredients:newIng,packaging:newPack,history:[{...batch,batchNo:no,date:todayStr(),time:timeStr()},...history],stockLog:[...logs,...(stockLog||[])],batchCounter:no+1});
    setTab("history");
  };

  const onStockAdjust=(type,itemId,itemName,before,after,by,reason)=>{
    const log={date:todayStr(),time:timeStr(),itemId,itemName,itemType:type,before,change:after-before,after,reason,adjustedBy:by};
    if(type==="ing")upd({stockLog:[log,...(stockLog||[])],ingredients:ingredients.map(i=>i.id===itemId?{...i,qty:after}:i)});
    else upd({stockLog:[log,...(stockLog||[])],packaging:packaging.map(p=>p.id===itemId?{...p,qty:after}:p)});
  };

  const onManualStockEdit=(type,itemId,itemName,before,after)=>{
    const log={date:todayStr(),time:timeStr(),itemId,itemName,itemType:type,before,change:after-before,after,reason:"แก้ไขสต็อกด้วยตนเอง"};
    upd({stockLog:[log,...(stockLog||[])]});
  };

  const alertItems=[...ingredients,...packaging].filter(i=>itemStatus(i).level>0);
  const TABS=[
    {id:"produce",icon:"⚙️",label:"บันทึกผลิต"},
    {id:"stock",icon:"📦",label:"จัดการสต็อก"},
    {id:"recipes",icon:"🍵",label:"สูตรชา"},
    {id:"history",icon:"📋",label:"ประวัติ"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#0d1f08,#091305)",borderBottom:"1px solid #1e3a10",padding:"0 24px",height:56,display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <span style={{fontSize:24}}>🍵</span>
        <div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648"}}>ระบบตัดสต็อกการผลิตชา</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#4a6a38"}}>Tea Production Stock System v5</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          {alertItems.length>0&&<div style={{background:"#3a1a00",border:"1px solid #ff980066",color:"#ff9800",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,animation:"pulse 2s infinite"}}>⚠️ แจ้งเตือน {alertItems.length} รายการ</div>}
          <div style={{background:"#1a2e10",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:20,padding:"3px 12px",fontSize:11,fontFamily:"monospace"}}>Batch #{String(batchCounter||1).padStart(4,"0")}</div>
        </div>
      </div>
      <div style={{background:"#111",borderBottom:"1px solid #1e1e1e",display:"flex",padding:"0 16px",flexShrink:0,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"12px 16px",background:tab===t.id?"#0f1f08":"none",border:"none",
            borderBottom:tab===t.id?"2px solid #7ab648":"2px solid transparent",
            color:tab===t.id?"#7ab648":"#666",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .2s",whiteSpace:"nowrap",position:"relative"}}>
            {t.id==="settings"?"🔑":t.icon} {t.label}
            {t.id==="stock"&&alertItems.length>0&&<span style={{position:"absolute",top:8,right:4,width:7,height:7,background:"#ff9800",borderRadius:"50%"}}/>}
          </button>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"20px",maxWidth:1100,width:"100%",margin:"0 auto"}}>
        {tab==="produce"&&<ProducePage ingredients={ingredients} packaging={packaging} recipes={recipes} onProduce={onProduce} batchCounter={batchCounter||1}/>}
        {tab==="stock"&&<StockPage ingredients={ingredients} packaging={packaging} onUpdateIng={v=>upd({ingredients:v})} onUpdatePack={v=>upd({packaging:v})} stockLog={stockLog||[]} onManualEdit={onManualStockEdit}/>}
        {tab==="recipes"&&<RecipesPage recipes={recipes} ingredients={ingredients} onUpdate={v=>upd({recipes:v})}/>}
        {tab==="history"&&<HistoryPage history={history} ingredients={ingredients} packaging={packaging}
          onUpdate={v=>upd({history:v})} onStockAdjust={onStockAdjust}
          authorizedUsers={authorizedUsers} pinLockout={pinLockout}
          onUpdateLockout={v=>upd({pinLockout:v})}/>}
        {tab==="settings"&&<SettingsPage authorizedUsers={authorizedUsers} onUpdate={v=>upd({authorizedUsers:v})} pinLockout={pinLockout} onUpdateLockout={v=>upd({pinLockout:v})}/>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  SETTINGS PAGE — จัดการ Authorized Users & PIN
// ══════════════════════════════════════════════════════════════
function SettingsPage({authorizedUsers,onUpdate,pinLockout,onUpdateLockout}){
  const [adding,setAdding]=useState(false);
  const [newName,setNewName]=useState("");
  const [newRole,setNewRole]=useState("ผู้จัดการ");
  const [newPin,setNewPin]=useState("");
  const [confirmPin,setConfirmPin]=useState("");
  const [pinError,setPinError]=useState("");
  const [showPin,setShowPin]=useState({});
  const [editingPin,setEditingPin]=useState(null); // userId
  const [editPinVal,setEditPinVal]=useState("");
  const [editPinConfirm,setEditPinConfirm]=useState("");

  const roles=["ผู้จัดการ","หัวหน้าไลน์ผลิต","ผู้ควบคุมคุณภาพ","ผู้อำนวยการ","อื่นๆ"];

  const addUser=()=>{
    if(!newName.trim()){setPinError("กรุณาใส่ชื่อ");return;}
    if(newPin.length!==6){setPinError("PIN ต้องมี 6 หลัก");return;}
    if(newPin!==confirmPin){setPinError("PIN ไม่ตรงกัน");return;}
    if(!/^\d{6}$/.test(newPin)){setPinError("PIN ต้องเป็นตัวเลขเท่านั้น");return;}
    const id="AU"+String(Date.now()).slice(-6);
    onUpdate([...authorizedUsers,{id,name:newName.trim(),role:newRole,pin:hashPin(newPin)}]);
    setAdding(false);setNewName("");setNewPin("");setConfirmPin("");setPinError("");
  };

  const deleteUser=(id)=>{
    if(!window.confirm("ลบผู้มีอำนาจคนนี้?"))return;
    onUpdate(authorizedUsers.filter(u=>u.id!==id));
  };

  const saveNewPin=(id)=>{
    if(editPinVal.length!==6||!/^\d{6}$/.test(editPinVal)){setPinError("PIN ต้องเป็นตัวเลข 6 หลัก");return;}
    if(editPinVal!==editPinConfirm){setPinError("PIN ไม่ตรงกัน");return;}
    onUpdate(authorizedUsers.map(u=>u.id!==id?u:{...u,pin:hashPin(editPinVal)}));
    setEditingPin(null);setEditPinVal("");setEditPinConfirm("");setPinError("");
  };

  const isLocked=pinLockout.lockedUntil&&Date.now()<pinLockout.lockedUntil;

  return(<div className="fu">
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>

                  <Field label="PIN ใหม่ (6 หลัก)">
                    <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:4,fontFamily:"monospace"}} type="password" maxLength={6} value={editPinVal} onChange={e=>{setEditPinVal(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                  </Field>
                  <div style={{marginTop:8}}/>
                  <Field label="ยืนยัน PIN ใหม่">
                    <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:4,fontFamily:"monospace"}} type="password" maxLength={6} value={editPinConfirm} onChange={e=>{setEditPinConfirm(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                  </Field>
                  {pinError&&<div style={{color:"#ff6b6b",fontSize:12,marginTop:6}}>{pinError}</div>}
                  <div style={{display:"flex",gap:8,marginTop:10}}>

                    <BtnSec style={{padding:"7px 12px",fontSize:12}} onClick={()=>{setEditingPin(null);setPinError("");}}>ยกเลิก</BtnSec>
                  </div>

              ):(
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:38,height:38,borderRadius:"50%",background:"#1d3a10",border:"1px solid #7ab64833",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                    {u.role==="ผู้อำนวยการ"?"👑":u.role==="ผู้จัดการ"?"🏅":"👤"}
                  </div>
                  <div style={{flex:1}}>

                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>{setEditingPin(u.id);setEditPinVal("");setEditPinConfirm("");setPinError("");}} style={{background:"#1a2a1a",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:11}}>🔑 เปลี่ยน PIN</button>
                    <button onClick={()=>deleteUser(u.id)} style={{background:"#2a1010",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:13}}>🗑</button>
                  </div>

          ))}

          {adding&&(
            <div style={{background:"#0f1f08",border:"1px solid #7ab64833",borderRadius:10,padding:"14px",marginTop:8}}>
              <div style={{fontSize:12,color:"#7ab648",fontWeight:700,marginBottom:12}}>➕ เพิ่มผู้มีอำนาจใหม่</div>
              <div style={{display:"grid",gap:10,marginBottom:10}}>
                <Field label="ชื่อ-นามสกุล"><input style={{...SI,padding:"7px 10px",fontSize:13}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="ชื่อ-นามสกุล" autoFocus/></Field>
                <Field label="ตำแหน่ง">
                  <select style={{...SI,padding:"7px 10px",fontSize:13}} value={newRole} onChange={e=>setNewRole(e.target.value)}>
                    {roles.map(r=><option key={r} value={r}>{r}</option>)}
                  </select>

                <Field label="PIN 6 หลัก">
                  <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:6,fontFamily:"monospace"}} type="password" maxLength={6} value={newPin} onChange={e=>{setNewPin(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                </Field>
                <Field label="ยืนยัน PIN">
                  <input style={{...SI,padding:"7px 10px",fontSize:14,letterSpacing:6,fontFamily:"monospace"}} type="password" maxLength={6} value={confirmPin} onChange={e=>{setConfirmPin(e.target.value.replace(/\D/g,""));setPinError("");}} placeholder="______"/>
                </Field>
              </div>
              {pinError&&<div style={{color:"#ff6b6b",fontSize:12,marginBottom:8}}>⚠️ {pinError}</div>}
              <div style={{display:"flex",gap:8}}>
                <Btn style={{padding:"8px 16px",fontSize:12}} onClick={addUser}>เพิ่ม</Btn>
                <BtnSec style={{padding:"8px 12px",fontSize:12}} onClick={()=>{setAdding(false);setPinError("");setNewName("");setNewPin("");setConfirmPin("");}}>ยกเลิก</BtnSec>

        </Card>
      </div>

      {/* Security info */}
      <div>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>

// ══════════════════════════════════════════════════════════════
//  PRODUCE PAGE
// ══════════════════════════════════════════════════════════════
function ProducePage({ingredients,packaging,recipes,onProduce,batchCounter}){
  const [step,setStep]=useState(1);
  const [recipeId,setRecipeId]=useState(recipes[0]?.id||"");
  const [kg,setKg]=useState("");
  const [operator,setOp]=useState("");
  const [note,setNote]=useState("");
  const [overrides,setOverrides]=useState({});
  const [batch,setBatch]=useState(null);

  const recipe=recipes.find(r=>r.id===recipeId);
  const kgNum=parseFloat(kg)||0;
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};
  useEffect(()=>setOverrides({}),[recipeId,kg]);

  const calcBase=useCallback(()=>{
    if(!recipe||!kgNum)return[];
    const d=recipe.items.map(item=>{
      const ing=ingredients.find(i=>i.id===item.ingredientId);
      return{type:"ing",id:item.ingredientId,name:ing?.name||"?",unit:ing?.unit||"กรัม",baseAmount:item.amountPerKg*kgNum,before:ing?.qty||0};
    });
    const bags=kgNum*recPack.bagsPerKg;const boxes=Math.ceil(bags/recPack.bagsPerBox);
    const foil=packaging.find(p=>p.name.includes("ถุงฟอย"));const box=packaging.find(p=>p.name.includes("กล่องลัง"));
    if(foil)d.push({type:"pack",id:foil.id,name:foil.name,unit:foil.unit,baseAmount:bags,before:foil.qty});
    if(box)d.push({type:"pack",id:box.id,name:box.name,unit:box.unit,baseAmount:boxes,before:box.qty});
    return d;
  },[recipe,kgNum,ingredients,packaging,recPack]);

  const getAmt=(d)=>overrides[d.type+"-"+d.id]!==undefined?overrides[d.type+"-"+d.id]:d.baseAmount;
  const setAmt=(d,val)=>setOverrides(o=>({...o,[d.type+"-"+d.id]:parseFloat(val)||0}));
  const resetAmt=(d)=>setOverrides(o=>{const n={...o};delete n[d.type+"-"+d.id];return n;});

  const base=calcBase();
  const final=base.map(d=>({...d,amount:getAmt(d),after:d.before-getAmt(d)}));
  const hasError=final.some(d=>d.after<0);
  const hasWarn=final.some(d=>d.after>=0&&d.after<d.before*.15);

  const doConfirm=()=>{setBatch({recipeId,recipeName:recipe?.name,kg:kgNum,operator,note,deductions:final});setStep(2);};
  const doFinal=()=>{onProduce(batch);setStep(3);};
  const doReset=()=>{setStep(1);setKg("");setOp("");setNote("");setBatch(null);setOverrides({});};

  if(step===3)return(<Card><div style={{textAlign:"center",padding:"36px 20px"}}>
    <div style={{fontSize:58,marginBottom:12,animation:"bounceIn .5s ease"}}>✅</div>
    <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:20,fontWeight:800,color:"#7ab648",marginBottom:6}}>ตัดสต็อกเรียบร้อย!</div>
    <div style={{fontSize:13,color:"#888",marginBottom:20}}>Batch #{String(batch.batchNo||0).padStart(4,"0")} · {batch.recipeName} · {fmt(batch.kg,0)} กก.</div>
    <Btn onClick={doReset}>➕ ผลิต Batch ใหม่</Btn>
  </div></Card>);

  return(<div className="fu">
    <div style={{display:"flex",marginBottom:18,background:"#111",border:"1px solid #222",borderRadius:10,overflow:"hidden"}}>
      {[{n:1,l:"กรอกข้อมูล"},{n:2,l:"ตรวจสอบ"},{n:3,l:"เสร็จสิ้น"}].map(s=>(
        <div key={s.n} style={{flex:1,padding:"10px",textAlign:"center",fontSize:12,fontWeight:700,borderBottom:step===s.n?"2px solid #7ab648":"2px solid transparent",background:step===s.n?"#0f1f08":"transparent",color:step===s.n?"#7ab648":step>s.n?"#4a8a28":"#555",transition:"all .3s"}}>
          <span style={{display:"inline-block",width:18,height:18,borderRadius:"50%",lineHeight:"18px",marginRight:5,fontSize:10,fontWeight:800,background:step>s.n?"#7ab648":step===s.n?"#1d3a10":"#222",color:step>s.n?"#fff":step===s.n?"#7ab648":"#555",border:step===s.n?"1.5px solid #7ab648":"1.5px solid transparent"}}>{step>s.n?"✓":s.n}</span>{s.l}
        </div>
      ))}
    </div>
    {step===1&&(<>
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <CT style={{margin:0}}>ข้อมูลการผลิต</CT>
          <span style={{fontFamily:"monospace",fontSize:12,color:"#7ab648",background:"#1d3a10",padding:"2px 10px",borderRadius:6,border:"1px solid #7ab64833"}}>Batch #{String(batchCounter).padStart(4,"0")}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Field label="สูตรชา"><select style={SI} value={recipeId} onChange={e=>setRecipeId(e.target.value)}>{recipes.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></Field>
          <Field label="น้ำหนักที่ผลิต (กก.)"><input style={SI} type="number" min="1" value={kg} onChange={e=>setKg(e.target.value)} placeholder="เช่น 500"/></Field>
          <Field label="ผู้บันทึก"><input style={SI} value={operator} onChange={e=>setOp(e.target.value)} placeholder="ชื่อผู้บันทึก"/></Field>
          <Field label="หมายเหตุ"><input style={SI} value={note} onChange={e=>setNote(e.target.value)} placeholder="หมายเหตุ"/></Field>
        </div>
      </Card>
      {kgNum>0&&recipe&&(<Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <CT style={{margin:0}}>🧮 สรุปการใช้ทรัพยากร — {fmt(kgNum,0)} กก.</CT>
          <span style={{fontSize:11,color:"#7ab648",background:"#1d3a10",padding:"2px 8px",borderRadius:6,border:"1px solid #7ab64833"}}>✏️ แก้ไขได้</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
          <div>
            <SL>🌿 วัตถุดิบ</SL>
            {base.filter(d=>d.type==="ing").map(d=>{
              const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;const ok=d.before>=amt;
              return(<div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #1e1e1e",gap:8}}>
                <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name}</span>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <input type="number" min="0" step="0.01" value={amt} onChange={e=>setAmt(d,e.target.value)} style={{...SI,width:110,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,color:ok?"#7ab648":"#ff4444",border:over?"1.5px solid #7ab64866":"1.5px solid #2a2a2a",background:over?"#0f1f08":"#0f0f0f"}}/>
                  <span style={{color:"#555",fontSize:11,minWidth:28}}>{d.unit}</span>
                  {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:14}}>↺</button>}
                  {!ok&&<Bdg color="red">ไม่พอ!</Bdg>}
                </div>
              </div>);
            })}
          </div>
          <div>
            <SL>📦 บรรจุภัณฑ์</SL>
            {base.filter(d=>d.type==="pack").map(d=>{
              const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;
              return(<div key={d.id} style={{padding:"6px 0",borderBottom:"1px solid #1e1e1e"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name}</span>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" min="0" step="1" value={amt} onChange={e=>setAmt(d,e.target.value)} style={{...SI,width:100,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,color:"#3db8e0",border:over?"1.5px solid #3db8e066":"1.5px solid #2a2a2a",background:over?"#08141f":"#0f0f0f"}}/>
                    <span style={{color:"#555",fontSize:11,minWidth:20}}>{d.unit}</span>
                    {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:14}}>↺</button>}
                  </div>
                </div>
              </div>);
            })}
          </div>
        </div>
        {hasError&&<Alert type="error">⛔ วัตถุดิบบางรายการ<b>ไม่เพียงพอ</b></Alert>}
        {!hasError&&hasWarn&&<Alert type="warn">⚡ บางรายการ<b>ใกล้หมด</b></Alert>}
        {!hasError&&!hasWarn&&<Alert type="ok">✅ สต็อกเพียงพอ</Alert>}
      </Card>)}
      <Btn onClick={doConfirm} disabled={!kgNum||!recipe||hasError}>ตรวจสอบ →</Btn>
    </>)}
    {step===2&&batch&&(<>
      <Card>
        <CT>📊 ยืนยันการตัดสต็อก</CT>
        <div style={{fontSize:13,color:"#888",marginBottom:12}}>
          <span style={{fontFamily:"monospace",color:"#7ab648",fontWeight:700}}>Batch #{String(batchCounter).padStart(4,"0")}</span>
          {" · "}<b style={{color:"#fff"}}>{batch.recipeName}</b>{" · "}<b style={{color:"#7ab648"}}>{fmt(batch.kg,0)} กก.</b>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>{["รายการ","ประเภท","หน่วย","สต็อกก่อน","ใช้ไป","คงเหลือ"].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
            <tbody>
              {batch.deductions.map((d,i)=>{
                const col=d.after<0?"#ff4444":d.after<d.before*.15?"#ff9800":"#7ab648";
                return(<tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                  <td style={TD}>{d.type==="ing"?"🌿":"📦"} {d.name}</td>
                  <td style={{...TD,color:"#555",fontSize:11}}>{d.type==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                  <td style={{...TD,color:"#777"}}>{d.unit}</td>
                  <td style={{...TD,fontFamily:"monospace"}}>{fmt(d.before)}</td>
                  <td style={{...TD,fontFamily:"monospace",color:"#ff6b6b",fontWeight:700}}>-{fmt(d.amount)}</td>
                  <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:col}}>{fmt(d.after)}</td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </Card>
      <div style={{display:"flex",gap:10}}><BtnSec onClick={()=>setStep(1)}>← แก้ไข</BtnSec><Btn onClick={doFinal}>✅ ยืนยัน</Btn></div>
    </>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  STOCK PAGE
// ══════════════════════════════════════════════════════════════
function StockPage({ingredients,packaging,onUpdateIng,onUpdatePack,stockLog,onManualEdit}){
  const [view,setView]=useState("ing");
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);
  const [expandedBatch,setExpandedBatch]=useState({});

  const list=view==="ing"?ingredients:view==="pack"?packaging:[];
  const accent=view==="ing"?"#7ab648":view==="pack"?"#3db8e0":"#e09b3d";

  const commitEdit=()=>{
    if(!editing)return;
    const isQty=editing.field==="qty",isMin=editing.field==="minQty";
    const v=(isQty||isMin)?(parseFloat(editing.value)||0):editing.value;
    if(isQty){const before=list.find(x=>x.id===editing.id)?.qty||0;onManualEdit(view==="ing"?"ing":"pack",editing.id,list.find(x=>x.id===editing.id)?.name||"",before,v);}
    if(view==="ing")onUpdateIng(ingredients.map(i=>i.id===editing.id?{...i,[editing.field]:v}:i));
    else onUpdatePack(packaging.map(p=>p.id===editing.id?{...p,[editing.field]:v}:p));
    setEditing(null);
  };
  const deleteItem=(id)=>{if(!window.confirm("ลบรายการนี้?"))return;if(view==="ing")onUpdateIng(ingredients.filter(i=>i.id!==id));else onUpdatePack(packaging.filter(p=>p.id!==id));};
  const startAdd=()=>{const pref=view==="ing"?"RM":"PK";setAdding({id:genId(pref,list),name:"",unit:view==="ing"?"กรัม":"ถุง",qty:0,minQty:0});};
  const commitAdd=()=>{if(!adding?.name.trim())return;if(view==="ing")onUpdateIng([...ingredients,adding]);else onUpdatePack([...packaging,adding]);setAdding(null);};

  const batchGroups=useMemo(()=>{
    const groups={};
    (stockLog||[]).forEach(l=>{
      const key=l.batchNo?`batch-${l.batchNo}`:`manual-${l.date}-${l.time}`;
      if(!groups[key])groups[key]={key,batchNo:l.batchNo,date:l.date,time:l.time,reason:l.reason,adjustedBy:l.adjustedBy,items:[]};
      groups[key].items.push(l);
    });
    return Object.values(groups).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  },[stockLog]);

  const VIEWS=[{id:"ing",l:"🌿 วัตถุดิบ"},{id:"pack",l:"📦 บรรจุภัณฑ์"},{id:"log",l:"📜 ประวัติการเปลี่ยนแปลง"}];

  return(<div className="fu">
    <div style={{display:"flex",marginBottom:16,borderBottom:"1px solid #1e1e1e"}}>
      {VIEWS.map(v=>(
        <button key={v.id} onClick={()=>{setView(v.id);setEditing(null);setAdding(null);}} style={{padding:"9px 18px",background:"none",border:"none",borderBottom:view===v.id?`2px solid ${v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"}`:"2px solid transparent",color:view===v.id?(v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"):"#666",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{v.l}</button>
      ))}
      {(view==="ing"||view==="pack")&&<button style={{...BSS,marginLeft:"auto",padding:"6px 14px",fontSize:12}} onClick={startAdd}>+ เพิ่มรายการ</button>}
    </div>

    {view==="log"&&(<div>
      {!batchGroups.length?<Card><div style={{textAlign:"center",padding:40,color:"#555"}}>ยังไม่มีประวัติ</div></Card>:(
        batchGroups.map(grp=>{
          const isBatch=!!grp.batchNo;const isOpen=!!expandedBatch[grp.key];
          const ingItems=grp.items.filter(x=>x.itemType==="ing");const packItems=grp.items.filter(x=>x.itemType==="pack");
          return(<div key={grp.key} style={{marginBottom:8}}>
            <div onClick={()=>setExpandedBatch(e=>({...e,[grp.key]:!e[grp.key]}))} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:isOpen?"#1a2a12":"#161616",border:`1px solid ${isOpen?"#7ab64844":"#2a2a2a"}`,borderRadius:isOpen?"12px 12px 0 0":"12px",cursor:"pointer",transition:"all .2s"}}>
              <span style={{fontSize:12,transition:"transform .2s",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
              {isBatch?<span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#7ab648",background:"#1d3a10",padding:"2px 8px",borderRadius:5,border:"1px solid #7ab64833",minWidth:80,textAlign:"center"}}>#{String(grp.batchNo).padStart(4,"0")}</span>
                :<span style={{fontFamily:"monospace",fontSize:12,color:"#e09b3d",background:"#1f1400",padding:"2px 8px",borderRadius:5,border:"1px solid #e09b3d33",minWidth:80,textAlign:"center"}}>ปรับด้วยมือ</span>}
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:"#ddd"}}>{grp.reason||"ปรับสต็อก"}</div>
                <div style={{fontSize:11,color:"#666"}}>📅 {grp.date} · ⏰ {grp.time} · {grp.items.length} รายการ {grp.adjustedBy&&<span style={{color:"#7ab648"}}>· ✅ {grp.adjustedBy}</span>}</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                {ingItems.length>0&&<span style={{fontSize:11,color:"#7ab648",background:"#0a1f06",padding:"2px 8px",borderRadius:5}}>🌿 {ingItems.length}</span>}
                {packItems.length>0&&<span style={{fontSize:11,color:"#3db8e0",background:"#071422",padding:"2px 8px",borderRadius:5}}>📦 {packItems.length}</span>}
              </div>
            </div>
            {isOpen&&(<div style={{border:"1px solid #7ab64822",borderTop:"none",borderRadius:"0 0 12px 12px",overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr style={{background:"#111"}}>{["รายการ","ประเภท","ก่อน","เปลี่ยนแปลง","หลัง"].map(h=><th key={h} style={{padding:"7px 14px",textAlign:"left",color:"#555",fontSize:10,fontWeight:700,textTransform:"uppercase",borderBottom:"1px solid #222"}}>{h}</th>)}</tr></thead>
                <tbody>
                  {grp.items.map((l,i)=>{const pos=l.change>0;return(<tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                    <td style={{...TD,fontSize:12}}><span style={{color:l.itemType==="ing"?"#7ab648":"#3db8e0"}}>{l.itemType==="ing"?"🌿":"📦"}</span> {l.itemName}</td>
                    <td style={{...TD,fontSize:11,color:"#555"}}>{l.itemType==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                    <td style={{...TD,fontFamily:"monospace",fontSize:12}}>{fmt(l.before)}</td>
                    <td style={{...TD,fontFamily:"monospace",fontWeight:700,fontSize:12,color:pos?"#7ab648":"#ff6b6b"}}>{pos?"+":""}{fmt(l.change)}</td>
                    <td style={{...TD,fontFamily:"monospace",fontWeight:700,fontSize:12,color:"#fff"}}>{fmt(l.after)}</td>
                  </tr>);})}
                </tbody>
              </table>
            </div>)}
          </div>);
        })
      )}
    </div>)}

    {(view==="ing"||view==="pack")&&(<Card>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr>{["รหัส","ชื่อ","หน่วย","จำนวนคงเหลือ","ขั้นต่ำ","สถานะ",""].map(h=><TH key={h} style={{color:accent}}>{h}</TH>)}</tr></thead>
          <tbody>
            {list.map((item,i)=>{
              const st=itemStatus(item);
              const isE=(f)=>editing?.id===item.id&&editing?.field===f;
              return(<tr key={item.id} style={{background:i%2===0?"#1a1a1a":"#141414",borderLeft:st.level>0?`3px solid ${st.color}`:"3px solid transparent"}}>
                <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{item.id}</td>
                <td style={TD}>{isE("name")?<IE value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333"}} onClick={()=>setEditing({id:item.id,field:"name",value:item.name})}>{item.name}</span>}</td>
                <td style={TD}>{isE("unit")?<IE value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={80}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333",color:"#777",fontSize:12}} onClick={()=>setEditing({id:item.id,field:"unit",value:item.unit})}>{item.unit}</span>}</td>
                <td style={TD}>{isE("qty")?<IE type="number" value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={140}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333",fontFamily:"monospace",fontWeight:700,color:st.level>0?st.color:accent}} onClick={()=>setEditing({id:item.id,field:"qty",value:item.qty})}>{fmt(item.qty)}</span>}</td>
                <td style={TD}>{isE("minQty")?<IE type="number" value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={120}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333",fontFamily:"monospace",fontSize:12,color:"#e09b3d"}} onClick={()=>setEditing({id:item.id,field:"minQty",value:item.minQty||0})}>{fmt(item.minQty||0)}</span>}</td>
                <td style={TD}><span style={{background:st.bg,color:st.color,padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700,border:`1px solid ${st.color}33`,whiteSpace:"nowrap"}}>{st.level>0?"⚠️ ":""}{st.label}</span></td>
                <td style={TD}><button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:15,opacity:.6}} onClick={()=>deleteItem(item.id)}>🗑</button></td>
              </tr>);
            })}
            {adding&&(<tr style={{background:"#0f1f08"}}>
              <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{adding.id}</td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13}} value={adding.name} onChange={e=>setAdding({...adding,name:e.target.value})} placeholder="ชื่อ" autoFocus/></td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:80}} value={adding.unit} onChange={e=>setAdding({...adding,unit:e.target.value})}/></td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:110,fontFamily:"monospace"}} type="number" value={adding.qty} onChange={e=>setAdding({...adding,qty:parseFloat(e.target.value)||0})}/></td>
              <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:100,fontFamily:"monospace",color:"#e09b3d"}} type="number" placeholder="ขั้นต่ำ" value={adding.minQty||0} onChange={e=>setAdding({...adding,minQty:parseFloat(e.target.value)||0})}/></td>
              <td style={TD}></td>
              <td style={TD}>
                <button style={{background:"#7ab648",border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,marginRight:4}} onClick={commitAdd}>✓</button>
                <button style={{background:"#333",border:"none",color:"#aaa",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12}} onClick={()=>setAdding(null)}>✕</button>
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11,color:"#444",padding:"8px 4px"}}>💡 คลิกค่าใดก็ได้เพื่อแก้ไข · คอลัมน์ <span style={{color:"#e09b3d"}}>ขั้นต่ำ</span> = ปริมาณที่จะแจ้งเตือน</div>
    </Card>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  RECIPES PAGE
// ══════════════════════════════════════════════════════════════
function RecipesPage({recipes,ingredients,onUpdate}){
  const [sel,setSel]=useState(recipes[0]?.id||"");
  const [addingRec,setAddingRec]=useState(false);
  const [newName,setNewName]=useState("");
  const recipe=recipes.find(r=>r.id===sel);
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};
  const addRecipe=()=>{if(!newName.trim())return;const id="REC"+String(Date.now()).slice(-5);onUpdate([...recipes,{id,name:newName.trim(),packaging:{bagsPerKg:1,bagsPerBox:20},items:[]}]);setSel(id);setAddingRec(false);setNewName("");};
  const delRecipe=(id)=>{if(!window.confirm("ลบสูตรนี้?"))return;const u=recipes.filter(r=>r.id!==id);onUpdate(u);setSel(u[0]?.id||"");};
  const updItems=(items)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,items}));
  const updPack=(field,val)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,packaging:{...(r.packaging||{bagsPerKg:1,bagsPerBox:20}),[field]:parseFloat(val)||1}}));
  const addItem=()=>{const used=recipe?.items.map(i=>i.ingredientId)||[];const avail=ingredients.filter(i=>!used.includes(i.id));if(!avail.length)return;updItems([...(recipe?.items||[]),{ingredientId:avail[0].id,amountPerKg:0}]);};
  const updItem=(id,field,value)=>updItems(recipe.items.map(it=>it.ingredientId!==id?it:{...it,[field]:field==="amountPerKg"?parseFloat(value)||0:value}));
  return(<div style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:18}} className="fu">
    <div><Card>
      <CT style={{marginBottom:12}}>สูตรทั้งหมด</CT>
      {recipes.map(r=><div key={r.id} onClick={()=>setSel(r.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,marginBottom:4,background:sel===r.id?"#1d3a10":"transparent",border:sel===r.id?"1px solid #7ab64866":"1px solid transparent",cursor:"pointer"}}>
        <span style={{flex:1,fontSize:13,color:sel===r.id?"#7ab648":"#bbb"}}>🍵 {r.name}</span>
        <button onClick={e=>{e.stopPropagation();delRecipe(r.id);}} style={{background:"none",border:"none",color:"#ff444444",cursor:"pointer",fontSize:13,padding:2}}>🗑</button>
      </div>)}
      {addingRec?(<div style={{marginTop:10}}>
        <input style={{...SI,marginBottom:8}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="ชื่อสูตรใหม่" autoFocus onKeyDown={e=>e.key==="Enter"&&addRecipe()}/>
        <div style={{display:"flex",gap:6}}><Btn style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={addRecipe}>เพิ่ม</Btn><BtnSec style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={()=>setAddingRec(false)}>ยกเลิก</BtnSec></div>
      </div>):<button style={{...BSS,width:"100%",marginTop:10,fontSize:12,padding:"8px"}} onClick={()=>setAddingRec(true)}>+ สูตรใหม่</button>}
    </Card></div>
    <div>{recipe?(<>
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><CT style={{margin:0}}>{recipe.name}</CT><span style={{fontSize:11,color:"#555"}}>ปริมาณต่อผงชา 1 กก.</span></div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr>{["วัตถุดิบ","ปริมาณ (กรัม/กก.)","หน่วย",""].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
            <tbody>{recipe.items.map((item,i)=>{const ing=ingredients.find(x=>x.id===item.ingredientId);return(<tr key={item.ingredientId} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
              <td style={TD}><select style={{...SI,padding:"5px 10px",fontSize:13}} value={item.ingredientId} onChange={e=>updItem(item.ingredientId,"ingredientId",e.target.value)}>{ingredients.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select></td>
              <td style={TD}><input style={{...SI,padding:"5px 10px",fontSize:13,width:150,fontFamily:"monospace"}} type="number" step="0.01" value={item.amountPerKg} onChange={e=>updItem(item.ingredientId,"amountPerKg",e.target.value)}/></td>
              <td style={{...TD,color:"#777",fontSize:12}}>{ing?.unit||"-"}</td>
              <td style={TD}><button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:14,opacity:.7}} onClick={()=>updItems(recipe.items.filter(it=>it.ingredientId!==item.ingredientId))}>🗑</button></td>
            </tr>);})}
            </tbody>
          </table>
        </div>
        <button style={{...BSS,marginTop:12,fontSize:12,padding:"7px 14px"}} onClick={addItem}>+ เพิ่มวัตถุดิบในสูตร</button>
      </Card>
      <Card>
        <CT>📦 การบรรจุภัณฑ์ของสูตรนี้</CT>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          {[{f:"bagsPerKg",v:recPack.bagsPerKg,l:"ถุงฟอย",sub:"ต่อ 1 กก.",u:"ถุง/กก.",c:"#3db8e0",prev:`500 กก. → ${fmt(500*recPack.bagsPerKg,0)} ถุง`},
            {f:"bagsPerBox",v:recPack.bagsPerBox,l:"กล่องลัง",sub:"ถุงต่อ 1 กล่อง",u:"ถุง/กล่อง",c:"#e09b3d",prev:`500 กก. → ${Math.ceil(500*recPack.bagsPerKg/recPack.bagsPerBox)} ใบ`}
          ].map(cfg=><div key={cfg.f} style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"14px"}}>
            <div style={{fontSize:13,fontWeight:700,color:cfg.c,marginBottom:2}}>{cfg.l}</div>
            <div style={{fontSize:11,color:"#555",marginBottom:10}}>{cfg.sub}</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <input type="number" min="0.01" step={cfg.f==="bagsPerKg"?"0.01":"1"} value={cfg.v} onChange={e=>updPack(cfg.f,e.target.value)} style={{...SI,width:90,padding:"7px 10px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:cfg.c,textAlign:"center"}}/>
              <span style={{fontSize:12,color:"#777"}}>{cfg.u}</span>
            </div>
            <div style={{fontSize:11,color:"#555"}}>{cfg.prev}</div>
          </div>)}
        </div>
      </Card>
    </>):<Card><div style={{color:"#555",textAlign:"center",padding:40}}>เลือกสูตรจากรายการด้านซ้าย</div></Card>}
    </div>
  </div>);
}

// ══════════════════════════════════════════════════════════════
//  HISTORY PAGE  (PIN Modal for stock adjust)
// ══════════════════════════════════════════════════════════════
function HistoryPage({history,ingredients,packaging,onUpdate,onStockAdjust,authorizedUsers,pinLockout,onUpdateLockout}){
  const [editId,setEditId]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [showPin,setShowPin]=useState(false);
  const [pendingEdit,setPendingEdit]=useState(null); // {index, form}

  const startEdit=(h,i)=>{
    setEditId(i);
    setEditForm({
      recipeName:h.recipeName,kg:h.kg,operator:h.operator||"",note:h.note||"",
      bags:h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,
      boxes:h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0,
      adjustStock:false
    });
  };

  const handleSaveClick=(i)=>{
    if(editForm.adjustStock){
      // Require PIN
      setPendingEdit({index:i,form:editForm});
      setShowPin(true);
    } else {
      commitEdit(i,editForm,null);
    }
  };

  const onPinSuccess=(user)=>{
    setShowPin(false);
    if(pendingEdit) commitEdit(pendingEdit.index,pendingEdit.form,user);
    setPendingEdit(null);
  };

  const commitEdit=(i,form,approvedBy)=>{
    const h=history[i];
    const newDed=(h.deductions||[]).map(d=>{
      if(d.name?.includes("ถุงฟอย"))return{...d,amount:parseFloat(form.bags)||d.amount};
      if(d.name?.includes("กล่องลัง"))return{...d,amount:parseFloat(form.boxes)||d.amount};
      return d;
    });
    const updated=history.map((hh,j)=>j!==i?hh:{
      ...hh,recipeName:form.recipeName,kg:parseFloat(form.kg)||hh.kg,
      operator:form.operator,note:form.note,deductions:newDed,
      lastEditBy:approvedBy?approvedBy.name:hh.lastEditBy,
      lastEditRole:approvedBy?approvedBy.role:hh.lastEditRole,
      lastEditDate:todayStr(),lastEditTime:timeStr()
    });
    onUpdate(updated);

    if(approvedBy&&form.adjustStock){
      (h.deductions||[]).forEach(d=>{
        const newAmt=d.name?.includes("ถุงฟอย")?parseFloat(form.bags)||d.amount:d.name?.includes("กล่องลัง")?parseFloat(form.boxes)||d.amount:d.amount;
        const diff=newAmt-d.amount;
        if(diff!==0){
          const currentList=d.type==="ing"?ingredients:packaging;
          const item=currentList.find(x=>x.id===d.id);
          if(item) onStockAdjust(d.type,d.id,d.name,item.qty,item.qty-diff,approvedBy.name,`แก้ไขประวัติ Batch #${String(h.batchNo||0).padStart(4,"0")} อนุมัติโดย ${approvedBy.name} (${approvedBy.role})`);
        }
      });
    }
    setEditId(null);
  };

  const deleteEntry=(i)=>{if(!window.confirm("ลบรายการนี้?"))return;onUpdate(history.filter((_,j)=>j!==i));};

  if(!history.length)return<Card><div style={{textAlign:"center",padding:60,color:"#555"}}><div style={{fontSize:44,marginBottom:12}}>📋</div>ยังไม่มีประวัติ</div></Card>;

  return(<div className="fu">
    {showPin&&<PinModal authorizedUsers={authorizedUsers} lockout={pinLockout} onSuccess={onPinSuccess} onCancel={()=>{setShowPin(false);setPendingEdit(null);}} onUpdateLockout={onUpdateLockout} title="ยืนยันการปรับสต็อก"/>}

    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      {[{l:"Batch ทั้งหมด",v:history.length,u:"ครั้ง",c:"#7ab648"},
        {l:"ผลิตรวม",v:fmt(history.reduce((a,h)=>a+h.kg,0),0),u:"กก.",c:"#7ab648"},
        {l:"ถุงฟอย",v:fmt(history.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0),0),0),u:"ถุง",c:"#3db8e0"},
        {l:"กล่องลัง",v:fmt(history.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0),0),0),u:"ใบ",c:"#e09b3d"},
      ].map((s,i)=><div key={i} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"10px 16px",flex:"1 1 130px"}}>
        <div style={{fontSize:10,color:"#666",marginBottom:3,textTransform:"uppercase",letterSpacing:".5px"}}>{s.l}</div>
        <div style={{fontFamily:"monospace",fontSize:19,fontWeight:800,color:s.c}}>{s.v}</div>
        <div style={{fontSize:11,color:"#555"}}>{s.u}</div>
      </div>)}
    </div>

    {history.map((h,i)=>(
      <Card key={i} style={{marginBottom:10}}>
        {editId===i?(
          <div>
            <div style={{fontSize:12,color:"#ff9800",marginBottom:12,background:"#1f1200",border:"1px solid #ff980033",borderRadius:7,padding:"8px 12px"}}>
              ✏️ แก้ไขประวัติ Batch #{String(h.batchNo||0).padStart(4,"0")}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12}}>
              <Field label="ชื่อสูตร"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.recipeName} onChange={e=>setEditForm({...editForm,recipeName:e.target.value})}/></Field>
              <Field label="น้ำหนัก (กก.)"><input style={{...SI,padding:"6px 10px",fontSize:13}} type="number" value={editForm.kg} onChange={e=>setEditForm({...editForm,kg:e.target.value})}/></Field>
              <Field label="ผู้บันทึก"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.operator} onChange={e=>setEditForm({...editForm,operator:e.target.value})}/></Field>
              <Field label="ถุงฟอย (ถุง)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#3db8e0"}} type="number" value={editForm.bags} onChange={e=>setEditForm({...editForm,bags:e.target.value})}/></Field>
              <Field label="กล่องลัง (ใบ)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#e09b3d"}} type="number" value={editForm.boxes} onChange={e=>setEditForm({...editForm,boxes:e.target.value})}/></Field>
              <Field label="หมายเหตุ"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.note} onChange={e=>setEditForm({...editForm,note:e.target.value})}/></Field>
            </div>

            {/* Stock adjust toggle */}
            <div style={{background:"#111",border:"1px solid #2a2a2a",borderRadius:10,padding:"14px",marginBottom:12}}>
              <label style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <div onClick={()=>setEditForm({...editForm,adjustStock:!editForm.adjustStock})}
                  style={{width:42,height:24,borderRadius:12,background:editForm.adjustStock?"#4a8020":"#333",position:"relative",transition:"background .2s",cursor:"pointer",flexShrink:0}}>
                  <div style={{position:"absolute",top:4,left:editForm.adjustStock?20:4,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:editForm.adjustStock?"#7ab648":"#aaa"}}>
                    🔐 ปรับสต็อกด้วย
                    {editForm.adjustStock&&<span style={{fontSize:11,color:"#888",marginLeft:8,fontWeight:400}}>— จะขอ PIN ผู้มีอำนาจ</span>}
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:2}}>
                    {editForm.adjustStock?"ต้องกรอก PIN 6 หลักของผู้มีอำนาจ — ระบบจะ update สต็อกและบันทึก audit log อัตโนมัติ":"เปิดเพื่ออัปเดตสต็อกปัจจุบันด้วย (ต้องการ PIN)"}
                  </div>
                </div>
              </label>
              {editForm.adjustStock&&!authorizedUsers.length&&(
                <Alert type="warn" style={{marginTop:10}}>⚠️ ยังไม่มีผู้มีอำนาจในระบบ — กรุณาเพิ่มใน เมนู 🔑 Settings ก่อน</Alert>
              )}
            </div>

            <div style={{display:"flex",gap:8}}>
              <Btn style={{padding:"8px 16px",fontSize:12}} onClick={()=>handleSaveClick(i)} disabled={editForm.adjustStock&&!authorizedUsers.length}>
                💾 {editForm.adjustStock?"บันทึก + กรอก PIN":"บันทึก"}
              </Btn>
              <BtnSec style={{padding:"8px 14px",fontSize:12}} onClick={()=>setEditId(null)}>ยกเลิก</BtnSec>
            </div>
          </div>
        ):(
          <div>
            <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
              <div style={{background:"#111",border:"1px solid #7ab64833",borderRadius:10,padding:"8px 10px",textAlign:"center",minWidth:62,flexShrink:0}}>
                <div style={{fontFamily:"monospace",fontSize:10,color:"#4a6a38",marginBottom:1}}>BATCH</div>
                <div style={{fontFamily:"monospace",fontSize:14,fontWeight:800,color:"#7ab648"}}>{String(h.batchNo||0).padStart(4,"0")}</div>
                <div style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:"#5a8a38",marginTop:2}}>{fmt(h.kg,0)}<span style={{fontSize:9,marginLeft:2}}>กก.</span></div>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:3}}>🍵 {h.recipeName}</div>
                <div style={{fontSize:12,color:"#777"}}>📅 {h.date} · ⏰ {h.time}{h.operator&&<> · 👤 {h.operator}</>}{h.note&&<span style={{color:"#555"}}> · {h.note}</span>}</div>
                {h.lastEditBy&&(
                  <div style={{fontSize:11,marginTop:4,background:"#1a1400",border:"1px solid #e09b3d33",borderRadius:6,padding:"4px 10px",display:"inline-block"}}>
                    <span style={{color:"#e09b3d"}}>✅ แก้ไขสต็อกโดย: </span>
                    <b style={{color:"#fff"}}>{h.lastEditBy}</b>
                    {h.lastEditRole&&<span style={{color:"#888"}}> ({h.lastEditRole})</span>}
                    <span style={{color:"#666"}}> · {h.lastEditDate} {h.lastEditTime}</span>
                  </div>
                )}
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                {[{i:"📦",v:fmt(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,0),l:"ถุง",c:"#3db8e0"},
                  {i:"📫",v:fmt(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0,0),l:"ลัง",c:"#e09b3d"}].map((p,j)=>(
                  <div key={j} style={{background:"#111",border:`1px solid ${p.c}33`,borderRadius:8,padding:"5px 10px",textAlign:"center",minWidth:48}}>
                    <div style={{fontSize:10}}>{p.i}</div>
                    <div style={{fontFamily:"monospace",fontWeight:800,color:p.c,fontSize:13}}>{p.v}</div>
                    <div style={{fontSize:10,color:"#555"}}>{p.l}</div>
                  </div>
                ))}
                <button onClick={()=>startEdit(h,i)} style={{background:"#1a2a14",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>✏️ แก้ไข</button>
                <button onClick={()=>deleteEntry(i)} style={{background:"#2a1010",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🗑</button>
              </div>
            </div>
            {h.deductions?.filter(d=>d.type==="ing").length>0&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,paddingTop:10,marginTop:10,borderTop:"1px solid #1a1a1a"}}>
                {h.deductions.filter(d=>d.type==="ing").map((d,j)=>(
                  <div key={j} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:7,padding:"4px 10px",fontSize:11}}>
                    <span style={{color:"#888"}}>{d.name}: </span>
                    <span style={{fontFamily:"monospace",color:"#ff8080",fontWeight:700}}>-{fmt(d.amount)}</span>
                    <span style={{color:"#555"}}> {d.unit}</span>
                    <span style={{color:"#333"}}> → {fmt(d.after)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </Card>
    ))}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
