<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตัดสต็อกการผลิตชา</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#ddd;font-family:'Noto Sans Thai',sans-serif}
select,input,button{font-family:'Noto Sans Thai',sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.fu{animation:fadeUp .3s ease}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const LS="tea_stock_v2";
const load=()=>{try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch{}return null;};
const save=s=>{try{localStorage.setItem(LS,JSON.stringify(s));}catch{}};
const DEF={
  ingredients:[
    {id:"RM001",name:"ชา 9060",unit:"กรัม",qty:500000},
    {id:"RM002",name:"VP",unit:"กรัม",qty:10000},
    {id:"RM003",name:"SY",unit:"กรัม",qty:10000},
    {id:"RM004",name:"TZ",unit:"กรัม",qty:10000},
    {id:"RM005",name:"CS",unit:"กรัม",qty:10000},
  ],
  packaging:[
    {id:"PK001",name:"ถุงฟอย 1 กก.",unit:"ถุง",qty:10000},
    {id:"PK002",name:"กล่องลัง",unit:"ใบ",qty:1000},
  ],
  recipes:[{
    id:"REC001",name:"Red Eagle สีเข้ม",
    packaging:{bagsPerKg:1,bagsPerBox:20},
    items:[
      {ingredientId:"RM001",amountPerKg:1000},
      {ingredientId:"RM002",amountPerKg:5.18},
      {ingredientId:"RM003",amountPerKg:4.5},
      {ingredientId:"RM004",amountPerKg:4.5},
      {ingredientId:"RM005",amountPerKg:1.5},
    ]
  }],
  history:[],
  stockLog:[]
};
const fmt=(n,d=2)=>Number(n).toLocaleString("th-TH",{maximumFractionDigits:d});
const todayStr=()=>new Date().toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric"});
const timeStr=()=>new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
const genId=(prefix,list)=>{const max=list.reduce((m,i)=>Math.max(m,parseInt(i.id.replace(prefix,""))||0),0);return prefix+String(max+1).padStart(3,"0");};
const SI={width:"100%",padding:"9px 12px",background:"#0f0f0f",border:"1.5px solid #2a2a2a",borderRadius:9,color:"#ddd",fontSize:14,outline:"none"};
const TD={padding:"9px 14px",borderBottom:"1px solid #1a1a1a",fontSize:13};
const BPS={background:"linear-gradient(135deg,#4a8020,#2d5016)",color:"#fff",border:"none",borderRadius:10,padding:"11px 22px",fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 3px 12px rgba(74,128,32,.3)"};
const BSS={background:"#1e1e1e",color:"#aaa",border:"1px solid #333",borderRadius:10,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"};

const Card=({children,style={}})=><div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:16,boxShadow:"0 4px 20px rgba(0,0,0,.4)",...style}}>{children}</div>;
const CT=({children,style={}})=><div style={{fontSize:14,fontWeight:800,color:"#7ab648",marginBottom:10,...style}}>{children}</div>;
const SL=({children})=><div style={{fontSize:10,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid #1e1e1e"}}>{children}</div>;
const Field=({label,children})=><div><label style={{display:"block",fontSize:10,fontWeight:700,color:"#7ab648",marginBottom:5,textTransform:"uppercase",letterSpacing:".7px"}}>{label}</label>{children}</div>;
const Alert=({type,children})=>{const s={error:{bg:"#1f0808",bdr:"#ff444444",c:"#ff6b6b"},warn:{bg:"#1f1200",bdr:"#ff980044",c:"#ff9800"},ok:{bg:"#0e1f08",bdr:"#7ab64844",c:"#7ab648"}};return<div style={{background:s[type].bg,border:`1px solid ${s[type].bdr}`,color:s[type].c,borderRadius:9,padding:"9px 14px",fontSize:13,marginTop:12}}>{children}</div>;};
const Bdg=({color,children})=>{const c={red:{bg:"#3a0a0a",fg:"#ff4444",b:"#ff444433"},amber:{bg:"#2a1400",fg:"#ff9800",b:"#ff980033"}};return<span style={{display:"inline-block",background:c[color].bg,color:c[color].fg,border:`1px solid ${c[color].b}`,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:4,marginLeft:5}}>{children}</span>;};
const TH=({children,style={}})=><th style={{background:"#111",color:"#7ab648",padding:"9px 14px",textAlign:"left",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".5px",borderBottom:"1px solid #222",...style}}>{children}</th>;
const Btn=({children,onClick,disabled=false,style={}})=><button style={{...BPS,opacity:disabled?.45:1,...style}} onClick={onClick} disabled={disabled}>{children}</button>;
const BtnSec=({children,onClick,style={}})=><button style={{...BSS,...style}} onClick={onClick}>{children}</button>;
const IE=({value,onChange,onOk,onCancel,type="text",width})=>(
  <div style={{display:"flex",gap:4,alignItems:"center"}}>
    <input style={{...SI,padding:"3px 8px",fontSize:13,width:width||"100%"}} type={type} value={value} onChange={e=>onChange(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==="Enter")onOk();if(e.key==="Escape")onCancel();}}/>
    <button style={{background:"#7ab648",border:"none",color:"#fff",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:12}} onClick={onOk}>✓</button>
    <button style={{background:"#333",border:"none",color:"#aaa",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:12}} onClick={onCancel}>✕</button>
  </div>
);

// ══════════════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState("produce");
  const [state,setState]=useState(()=>{const s=load();return s?{...DEF,...s}:DEF;});
  const upd=useCallback(patch=>setState(prev=>{const n={...prev,...patch};save(n);return n;}),[]);
  const {ingredients,packaging,recipes,history,stockLog}=state;

  const onProduce=(batch)=>{
    const logs=[];
    const newIng=ingredients.map(i=>{
      const d=batch.deductions.find(x=>x.type==="ing"&&x.id===i.id);
      if(d){logs.push({date:todayStr(),time:timeStr(),itemId:i.id,itemName:i.name,itemType:"ing",before:i.qty,change:-d.amount,after:Math.max(0,i.qty-d.amount),reason:"ผลิต: "+batch.recipeName});return{...i,qty:Math.max(0,i.qty-d.amount)};}
      return i;
    });
    const newPack=packaging.map(p=>{
      const d=batch.deductions.find(x=>x.type==="pack"&&x.id===p.id);
      if(d){logs.push({date:todayStr(),time:timeStr(),itemId:p.id,itemName:p.name,itemType:"pack",before:p.qty,change:-d.amount,after:Math.max(0,p.qty-d.amount),reason:"ผลิต: "+batch.recipeName});return{...p,qty:Math.max(0,p.qty-d.amount)};}
      return p;
    });
    upd({ingredients:newIng,packaging:newPack,history:[{...batch,date:todayStr(),time:timeStr()},...history],stockLog:[...logs,...(state.stockLog||[])]});
    setTab("history");
  };

  const onManualEdit=(type,itemId,itemName,before,after)=>{
    const log={date:todayStr(),time:timeStr(),itemId,itemName,itemType:type,before,change:after-before,after,reason:"แก้ไขสต็อกด้วยตนเอง"};
    upd({stockLog:[log,...(state.stockLog||[])]});
  };

  const lowCount=[...ingredients,...packaging].filter(x=>x.qty<=(x.unit==="กรัม"?5000:50)).length;
  const TABS=[{id:"produce",icon:"⚙️",label:"บันทึกผลิต"},{id:"stock",icon:"📦",label:"จัดการสต็อก"},{id:"recipes",icon:"🍵",label:"สูตรชา"},{id:"history",icon:"📋",label:"ประวัติ"}];

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#0d1f08,#091305)",borderBottom:"1px solid #1e3a10",padding:"0 24px",height:56,display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <span style={{fontSize:24}}>🍵</span>
        <div>
          <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:16,fontWeight:800,color:"#7ab648"}}>ระบบตัดสต็อกการผลิตชา</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#4a6a38"}}>Tea Production Stock System</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          {lowCount>0&&<div style={{background:"#3a0a0a",border:"1px solid #ff444466",color:"#ff6b6b",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,animation:"pulse 2s infinite"}}>⚠️ ใกล้หมด {lowCount} รายการ</div>}
          <div style={{background:"#1a2e10",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:20,padding:"3px 12px",fontSize:11,fontFamily:"monospace"}}>{ingredients.length} วัตถุดิบ · {packaging.length} บรรจุภัณฑ์</div>
        </div>
      </div>
      <div style={{background:"#111",borderBottom:"1px solid #1e1e1e",display:"flex",padding:"0 20px",flexShrink:0}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"12px 18px",background:tab===t.id?"#0f1f08":"none",border:"none",borderBottom:tab===t.id?"2px solid #7ab648":"2px solid transparent",color:tab===t.id?"#7ab648":"#666",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{t.icon} {t.label}</button>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"22px 20px",maxWidth:1080,width:"100%",margin:"0 auto"}}>
        {tab==="produce"&&<ProducePage ingredients={ingredients} packaging={packaging} recipes={recipes} onProduce={onProduce}/>}
        {tab==="stock"&&<StockPage ingredients={ingredients} packaging={packaging} onUpdateIng={v=>upd({ingredients:v})} onUpdatePack={v=>upd({packaging:v})} stockLog={stockLog||[]} onManualEdit={onManualEdit}/>}
        {tab==="recipes"&&<RecipesPage recipes={recipes} ingredients={ingredients} onUpdate={v=>upd({recipes:v})}/>}
        {tab==="history"&&<HistoryPage history={history} onUpdate={v=>upd({history:v})}/>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  PRODUCE PAGE
// ══════════════════════════════════════════════════════════════
function ProducePage({ingredients,packaging,recipes,onProduce}){
  const [step,setStep]=useState(1);
  const [recipeId,setRecipeId]=useState(recipes[0]?.id||"");
  const [kg,setKg]=useState("");
  const [operator,setOp]=useState("");
  const [note,setNote]=useState("");
  const [overrides,setOverrides]=useState({});
  const [batch,setBatch]=useState(null);

  const recipe=recipes.find(r=>r.id===recipeId);
  const kgNum=parseFloat(kg)||0;
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};

  useEffect(()=>setOverrides({}),[recipeId,kg]);

  const calcBase=useCallback(()=>{
    if(!recipe||!kgNum)return[];
    const d=recipe.items.map(item=>{
      const ing=ingredients.find(i=>i.id===item.ingredientId);
      return{type:"ing",id:item.ingredientId,name:ing?.name||"?",unit:ing?.unit||"กรัม",baseAmount:item.amountPerKg*kgNum,before:ing?.qty||0};
    });
    const bags=kgNum*recPack.bagsPerKg;
    const boxes=Math.ceil(bags/recPack.bagsPerBox);
    const foil=packaging.find(p=>p.name.includes("ถุงฟอย"));
    const box=packaging.find(p=>p.name.includes("กล่องลัง"));
    if(foil)d.push({type:"pack",id:foil.id,name:foil.name,unit:foil.unit,baseAmount:bags,before:foil.qty});
    if(box)d.push({type:"pack",id:box.id,name:box.name,unit:box.unit,baseAmount:boxes,before:box.qty});
    return d;
  },[recipe,kgNum,ingredients,packaging,recPack]);

  const getAmt=(d)=>overrides[d.type+"-"+d.id]!==undefined?overrides[d.type+"-"+d.id]:d.baseAmount;
  const setAmt=(d,val)=>setOverrides(o=>({...o,[d.type+"-"+d.id]:parseFloat(val)||0}));
  const resetAmt=(d)=>setOverrides(o=>{const n={...o};delete n[d.type+"-"+d.id];return n;});

  const base=calcBase();
  const final=base.map(d=>({...d,amount:getAmt(d),after:d.before-getAmt(d)}));
  const hasError=final.some(d=>d.after<0);
  const hasWarn=final.some(d=>d.after>=0&&d.after<d.before*.15);

  const doConfirm=()=>{setBatch({recipeId,recipeName:recipe?.name,kg:kgNum,operator,note,deductions:final});setStep(2);};
  const doFinal=()=>{onProduce(batch);setStep(3);};
  const doReset=()=>{setStep(1);setKg("");setOp("");setNote("");setBatch(null);setOverrides({});};

  if(step===3)return(
    <Card>
      <div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:60,marginBottom:14,animation:"bounceIn .5s ease"}}>✅</div>
        <div style={{fontFamily:"'Noto Serif Thai',serif",fontSize:21,fontWeight:800,color:"#7ab648",marginBottom:8}}>ตัดสต็อกเรียบร้อยแล้ว!</div>
        <div style={{fontSize:13,color:"#888",marginBottom:24}}>{batch.recipeName} · {fmt(batch.kg,0)} กก.{batch.operator&&` · ${batch.operator}`}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",marginBottom:24}}>
          {batch.deductions.map((d,i)=>(
            <div key={i} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:8,padding:"6px 12px",fontSize:12}}>
              <span style={{color:d.type==="ing"?"#7ab648":"#3db8e0"}}>{d.type==="ing"?"🌿":"📦"} {d.name}: </span>
              <span style={{fontFamily:"monospace",color:"#ff8080",fontWeight:700}}>-{fmt(d.amount)}</span>
              <span style={{color:"#555"}}> {d.unit}</span>
            </div>
          ))}
        </div>
        <Btn onClick={doReset}>➕ ผลิต Batch ใหม่</Btn>
      </div>
    </Card>
  );

  return(
    <div className="fu">
      <div style={{display:"flex",marginBottom:20,background:"#111",border:"1px solid #222",borderRadius:10,overflow:"hidden"}}>
        {[{n:1,l:"กรอกข้อมูล"},{n:2,l:"ตรวจสอบ"},{n:3,l:"เสร็จสิ้น"}].map(s=>(
          <div key={s.n} style={{flex:1,padding:"10px",textAlign:"center",fontSize:12,fontWeight:700,
            borderBottom:step===s.n?"2px solid #7ab648":"2px solid transparent",
            background:step===s.n?"#0f1f08":"transparent",
            color:step===s.n?"#7ab648":step>s.n?"#4a8a28":"#555",transition:"all .3s"}}>
            <span style={{display:"inline-block",width:18,height:18,borderRadius:"50%",lineHeight:"18px",marginRight:5,fontSize:10,fontWeight:800,
              background:step>s.n?"#7ab648":step===s.n?"#1d3a10":"#222",
              color:step>s.n?"#fff":step===s.n?"#7ab648":"#555",
              border:step===s.n?"1.5px solid #7ab648":"1.5px solid transparent"}}>{step>s.n?"✓":s.n}</span>{s.l}
          </div>
        ))}
      </div>

      {step===1&&(
        <>
          <Card>
            <CT>ข้อมูลการผลิต</CT>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:4}}>
              <Field label="สูตรชา"><select style={SI} value={recipeId} onChange={e=>setRecipeId(e.target.value)}>{recipes.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></Field>
              <Field label="น้ำหนักที่ผลิต (กก.)"><input style={SI} type="number" min="1" value={kg} onChange={e=>setKg(e.target.value)} placeholder="เช่น 500"/></Field>
              <Field label="ผู้บันทึก"><input style={SI} value={operator} onChange={e=>setOp(e.target.value)} placeholder="ชื่อผู้บันทึก"/></Field>
              <Field label="Batch No. / หมายเหตุ"><input style={SI} value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น Batch #001"/></Field>
            </div>
          </Card>

          {kgNum>0&&recipe&&(
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <CT style={{margin:0}}>🧮 สรุปการใช้ทรัพยากร — {fmt(kgNum,0)} กก.</CT>
                <span style={{fontSize:11,color:"#7ab648",background:"#1d3a10",padding:"2px 8px",borderRadius:6,border:"1px solid #7ab64833"}}>✏️ แก้ไขได้</span>
              </div>
              <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#555"}}>
                💡 ค่าคำนวณจากสูตร — พิมพ์ทับได้เลยหากใช้จริงต่างออกไป · กด ↺ เพื่อรีเซ็ตเป็นค่าสูตร
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                <div>
                  <SL>🌿 วัตถุดิบ</SL>
                  {base.filter(d=>d.type==="ing").map(d=>{
                    const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;const ok=d.before>=amt;
                    return(
                      <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #1e1e1e",gap:8}}>
                        <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name}</span>
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="number" min="0" step="0.01" value={amt} onChange={e=>setAmt(d,e.target.value)}
                            style={{...SI,width:110,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,
                              color:ok?"#7ab648":"#ff4444",border:over?"1.5px solid #7ab64866":"1.5px solid #2a2a2a",background:over?"#0f1f08":"#0f0f0f"}}/>
                          <span style={{color:"#555",fontSize:11,minWidth:28}}>{d.unit}</span>
                          {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:13,padding:"1px 3px"}}>↺</button>}
                          {!ok&&<Bdg color="red">ไม่พอ!</Bdg>}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div>
                  <SL>📦 บรรจุภัณฑ์</SL>
                  {base.filter(d=>d.type==="pack").map(d=>{
                    const amt=getAmt(d);const over=overrides[d.type+"-"+d.id]!==undefined;
                    const hint=d.name.includes("ถุงฟอย")?`(${fmt(kgNum,0)}×${recPack.bagsPerKg})`:`(÷${recPack.bagsPerBox}⌉)`;
                    return(
                      <div key={d.id} style={{padding:"7px 0",borderBottom:"1px solid #1e1e1e"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                          <span style={{color:"#bbb",fontSize:13,flex:1}}>{d.name} <span style={{color:"#444",fontSize:11}}>{hint}</span></span>
                          <div style={{display:"flex",alignItems:"center",gap:4}}>
                            <input type="number" min="0" step="1" value={amt} onChange={e=>setAmt(d,e.target.value)}
                              style={{...SI,width:100,padding:"4px 8px",fontSize:13,fontFamily:"monospace",fontWeight:700,
                                color:"#3db8e0",border:over?"1.5px solid #3db8e066":"1.5px solid #2a2a2a",background:over?"#08141f":"#0f0f0f"}}/>
                            <span style={{color:"#555",fontSize:11,minWidth:20}}>{d.unit}</span>
                            {over&&<button onClick={()=>resetAmt(d)} title="รีเซ็ต" style={{background:"none",border:"none",color:"#ff9800",cursor:"pointer",fontSize:13,padding:"1px 3px"}}>↺</button>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
              {hasError&&<Alert type="error">⛔ วัตถุดิบบางรายการ<b>ไม่เพียงพอ</b> — กรุณาอัปเดตสต็อก</Alert>}
              {!hasError&&hasWarn&&<Alert type="warn">⚡ บางรายการ<b>ใกล้หมด</b> — ควรสั่งเพิ่มเร็วๆ นี้</Alert>}
              {!hasError&&!hasWarn&&<Alert type="ok">✅ สต็อกเพียงพอสำหรับการผลิตนี้</Alert>}
            </Card>
          )}
          <Btn onClick={doConfirm} disabled={!kgNum||!recipe||hasError}>ตรวจสอบการตัดสต็อก →</Btn>
        </>
      )}

      {step===2&&batch&&(
        <>
          <Card>
            <CT>📊 ยืนยันการตัดสต็อก</CT>
            <div style={{fontSize:13,color:"#888",marginBottom:14}}>
              สูตร: <b style={{color:"#fff"}}>{batch.recipeName}</b> · ผลิต: <b style={{color:"#7ab648"}}>{fmt(batch.kg,0)} กก.</b>
              {batch.operator&&<> · ผู้บันทึก: <b style={{color:"#ccc"}}>{batch.operator}</b></>}
              {batch.note&&<span style={{color:"#666"}}> · {batch.note}</span>}
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr>{["รายการ","ประเภท","หน่วย","สต็อกก่อน","ใช้ไป","คงเหลือ"].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
                <tbody>
                  {batch.deductions.map((d,i)=>{
                    const col=d.after<0?"#ff4444":d.after<d.before*.15?"#ff9800":"#7ab648";
                    return(
                      <tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                        <td style={TD}>{d.type==="ing"?"🌿":"📦"} {d.name}</td>
                        <td style={{...TD,color:"#555",fontSize:11}}>{d.type==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                        <td style={{...TD,color:"#777"}}>{d.unit}</td>
                        <td style={{...TD,fontFamily:"monospace"}}>{fmt(d.before)}</td>
                        <td style={{...TD,fontFamily:"monospace",color:"#ff6b6b",fontWeight:700}}>-{fmt(d.amount)}</td>
                        <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:col}}>
                          {fmt(d.after)}{d.after<0&&<Bdg color="red">หมด!</Bdg>}{d.after>=0&&d.after<d.before*.15&&<Bdg color="amber">ใกล้หมด</Bdg>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
          <div style={{display:"flex",gap:10}}><BtnSec onClick={()=>setStep(1)}>← แก้ไข</BtnSec><Btn onClick={doFinal}>✅ ยืนยันตัดสต็อก</Btn></div>
        </>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  STOCK PAGE
// ══════════════════════════════════════════════════════════════
function StockPage({ingredients,packaging,onUpdateIng,onUpdatePack,stockLog,onManualEdit}){
  const [view,setView]=useState("ing");
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(null);

  const list=view==="ing"?ingredients:packaging;
  const type=view;
  const accent=view==="ing"?"#7ab648":view==="pack"?"#3db8e0":"#e09b3d";

  const commitEdit=()=>{
    if(!editing)return;
    const v=editing.field==="qty"?(parseFloat(editing.value)||0):editing.value;
    if(editing.field==="qty"){
      const before=list.find(x=>x.id===editing.id)?.qty||0;
      onManualEdit(type,editing.id,list.find(x=>x.id===editing.id)?.name||"",before,v);
    }
    if(type==="ing")onUpdateIng(ingredients.map(i=>i.id===editing.id?{...i,[editing.field]:v}:i));
    else onUpdatePack(packaging.map(p=>p.id===editing.id?{...p,[editing.field]:v}:p));
    setEditing(null);
  };

  const deleteItem=(id)=>{
    if(!window.confirm("ลบรายการนี้?"))return;
    if(type==="ing")onUpdateIng(ingredients.filter(i=>i.id!==id));
    else onUpdatePack(packaging.filter(p=>p.id!==id));
  };

  const startAdd=()=>{const pref=type==="ing"?"RM":"PK";setAdding({id:genId(pref,list),name:"",unit:type==="ing"?"กรัม":"ถุง",qty:0});};

  const commitAdd=()=>{
    if(!adding?.name.trim())return;
    if(type==="ing")onUpdateIng([...ingredients,adding]);
    else onUpdatePack([...packaging,adding]);
    setAdding(null);
  };

  const statusOf=(item)=>{
    if(item.qty<=0)return{label:"หมด",color:"#ff4444",bg:"#3a0808"};
    const t=item.unit==="กรัม"?5000:50;
    if(item.qty<t)return{label:"ใกล้หมด",color:"#ff9800",bg:"#2a1400"};
    return{label:"ปกติ",color:"#7ab648",bg:"#0a1a06"};
  };

  const VIEWS=[{id:"ing",l:"🌿 วัตถุดิบ"},{id:"pack",l:"📦 บรรจุภัณฑ์"},{id:"log",l:"📜 ประวัติการเปลี่ยนแปลง"}];

  return(
    <div className="fu">
      <div style={{display:"flex",gap:0,marginBottom:18,borderBottom:"1px solid #1e1e1e"}}>
        {VIEWS.map(v=>(
          <button key={v.id} onClick={()=>{setView(v.id);setEditing(null);setAdding(null);}} style={{
            padding:"9px 18px",background:"none",border:"none",
            borderBottom:view===v.id?`2px solid ${v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"}`:"2px solid transparent",
            color:view===v.id?(v.id==="log"?"#e09b3d":v.id==="pack"?"#3db8e0":"#7ab648"):"#666",
            fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{v.l}</button>
        ))}
        {(view==="ing"||view==="pack")&&<button style={{...BSS,marginLeft:"auto",padding:"6px 14px",fontSize:12}} onClick={startAdd}>+ เพิ่มรายการ</button>}
      </div>

      {view==="log"&&(
        <Card>
          {!stockLog.length?<div style={{textAlign:"center",padding:40,color:"#555"}}>ยังไม่มีประวัติการเปลี่ยนแปลง</div>:(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr>{["วันที่","เวลา","รายการ","ประเภท","ก่อน","เปลี่ยนแปลง","หลัง","เหตุผล"].map(h=><TH key={h} style={{color:"#e09b3d",fontSize:10}}>{h}</TH>)}</tr></thead>
                <tbody>
                  {stockLog.map((l,i)=>{
                    const pos=l.change>0;
                    return(
                      <tr key={i} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                        <td style={{...TD,fontFamily:"monospace",fontSize:11,color:"#666"}}>{l.date}</td>
                        <td style={{...TD,fontFamily:"monospace",fontSize:11,color:"#666"}}>{l.time}</td>
                        <td style={TD}><span style={{color:l.itemType==="ing"?"#7ab648":"#3db8e0"}}>{l.itemType==="ing"?"🌿":"📦"}</span> {l.itemName}</td>
                        <td style={{...TD,fontSize:11,color:"#555"}}>{l.itemType==="ing"?"วัตถุดิบ":"บรรจุภัณฑ์"}</td>
                        <td style={{...TD,fontFamily:"monospace"}}>{fmt(l.before)}</td>
                        <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:pos?"#7ab648":"#ff6b6b"}}>{pos?"+":""}{fmt(l.change)}</td>
                        <td style={{...TD,fontFamily:"monospace",fontWeight:700,color:"#fff"}}>{fmt(l.after)}</td>
                        <td style={{...TD,color:"#777",fontSize:12}}>{l.reason}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      )}

      {(view==="ing"||view==="pack")&&(
        <Card>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr>{["รหัส","ชื่อ","หน่วย","จำนวนคงเหลือ","สถานะ",""].map(h=><TH key={h} style={{color:accent}}>{h}</TH>)}</tr></thead>
              <tbody>
                {list.map((item,i)=>{
                  const st=statusOf(item);
                  const isE=(f)=>editing?.id===item.id&&editing?.field===f;
                  return(
                    <tr key={item.id} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                      <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{item.id}</td>
                      <td style={TD}>{isE("name")?<IE value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333"}} onClick={()=>setEditing({type,id:item.id,field:"name",value:item.name})}>{item.name}</span>}</td>
                      <td style={TD}>{isE("unit")?<IE value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={80}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333",color:"#777",fontSize:12}} onClick={()=>setEditing({type,id:item.id,field:"unit",value:item.unit})}>{item.unit}</span>}</td>
                      <td style={TD}>{isE("qty")?<IE type="number" value={editing.value} onChange={v=>setEditing({...editing,value:v})} onOk={commitEdit} onCancel={()=>setEditing(null)} width={140}/>:<span style={{cursor:"pointer",borderBottom:"1px dashed #333",fontFamily:"monospace",fontWeight:700,color:accent}} onClick={()=>setEditing({type,id:item.id,field:"qty",value:item.qty})}>{fmt(item.qty)}</span>}</td>
                      <td style={TD}><span style={{background:st.bg,color:st.color,padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:700,border:`1px solid ${st.color}33`}}>{st.label}</span></td>
                      <td style={TD}><button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:15,opacity:.6}} onClick={()=>deleteItem(item.id)}>🗑</button></td>
                    </tr>
                  );
                })}
                {adding&&(
                  <tr style={{background:"#0f1f08"}}>
                    <td style={{...TD,fontFamily:"monospace",color:"#555",fontSize:11}}>{adding.id}</td>
                    <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13}} value={adding.name} onChange={e=>setAdding({...adding,name:e.target.value})} placeholder="ชื่อ" autoFocus/></td>
                    <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:80}} value={adding.unit} onChange={e=>setAdding({...adding,unit:e.target.value})}/></td>
                    <td style={TD}><input style={{...SI,padding:"4px 8px",fontSize:13,width:130,fontFamily:"monospace"}} type="number" value={adding.qty} onChange={e=>setAdding({...adding,qty:parseFloat(e.target.value)||0})}/></td>
                    <td style={TD}></td>
                    <td style={TD}>
                      <button style={{background:"#7ab648",border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,marginRight:4}} onClick={commitAdd}>✓</button>
                      <button style={{background:"#333",border:"none",color:"#aaa",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12}} onClick={()=>setAdding(null)}>✕</button>
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:11,color:"#444",padding:"8px 4px"}}>💡 คลิกที่ชื่อ, หน่วย หรือจำนวนเพื่อแก้ไข · กด Enter เพื่อบันทึก</div>
        </Card>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  RECIPES PAGE
// ══════════════════════════════════════════════════════════════
function RecipesPage({recipes,ingredients,onUpdate}){
  const [sel,setSel]=useState(recipes[0]?.id||"");
  const [addingRec,setAddingRec]=useState(false);
  const [newName,setNewName]=useState("");

  const recipe=recipes.find(r=>r.id===sel);
  const recPack=recipe?.packaging||{bagsPerKg:1,bagsPerBox:20};

  const addRecipe=()=>{
    if(!newName.trim())return;
    const id="REC"+String(Date.now()).slice(-5);
    onUpdate([...recipes,{id,name:newName.trim(),packaging:{bagsPerKg:1,bagsPerBox:20},items:[]}]);
    setSel(id);setAddingRec(false);setNewName("");
  };
  const delRecipe=(id)=>{if(!window.confirm("ลบสูตรนี้?"))return;const u=recipes.filter(r=>r.id!==id);onUpdate(u);setSel(u[0]?.id||"");};
  const updItems=(items)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,items}));
  const updPack=(field,val)=>onUpdate(recipes.map(r=>r.id!==sel?r:{...r,packaging:{...(r.packaging||{bagsPerKg:1,bagsPerBox:20}),[field]:parseFloat(val)||1}}));
  const addItem=()=>{
    const used=recipe?.items.map(i=>i.ingredientId)||[];
    const avail=ingredients.filter(i=>!used.includes(i.id));
    if(!avail.length)return;
    updItems([...(recipe?.items||[]),{ingredientId:avail[0].id,amountPerKg:0}]);
  };
  const updItem=(id,field,value)=>updItems(recipe.items.map(it=>it.ingredientId!==id?it:{...it,[field]:field==="amountPerKg"?parseFloat(value)||0:value}));

  return(
    <div style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:18}} className="fu">
      <div>
        <Card>
          <CT style={{marginBottom:12}}>สูตรทั้งหมด</CT>
          {recipes.map(r=>(
            <div key={r.id} onClick={()=>setSel(r.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,marginBottom:4,background:sel===r.id?"#1d3a10":"transparent",border:sel===r.id?"1px solid #7ab64866":"1px solid transparent",cursor:"pointer"}}>
              <span style={{flex:1,fontSize:13,color:sel===r.id?"#7ab648":"#bbb"}}>🍵 {r.name}</span>
              <button onClick={e=>{e.stopPropagation();delRecipe(r.id);}} style={{background:"none",border:"none",color:"#ff444444",cursor:"pointer",fontSize:13,padding:2}}>🗑</button>
            </div>
          ))}
          {addingRec?(
            <div style={{marginTop:10}}>
              <input style={{...SI,marginBottom:8}} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="ชื่อสูตรใหม่" autoFocus onKeyDown={e=>e.key==="Enter"&&addRecipe()}/>
              <div style={{display:"flex",gap:6}}><Btn style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={addRecipe}>เพิ่ม</Btn><BtnSec style={{padding:"7px 12px",fontSize:12,flex:1}} onClick={()=>setAddingRec(false)}>ยกเลิก</BtnSec></div>
            </div>
          ):(
            <button style={{...BSS,width:"100%",marginTop:10,fontSize:12,padding:"8px"}} onClick={()=>setAddingRec(true)}>+ สูตรใหม่</button>
          )}
        </Card>
      </div>

      <div>
        {recipe?(
          <>
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <CT style={{margin:0}}>{recipe.name}</CT>
                <span style={{fontSize:11,color:"#555"}}>ปริมาณต่อผงชา 1 กก.</span>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr>{["วัตถุดิบ","ปริมาณ (กรัม/กก.)","หน่วย",""].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
                  <tbody>
                    {recipe.items.map((item,i)=>{
                      const ing=ingredients.find(x=>x.id===item.ingredientId);
                      return(
                        <tr key={item.ingredientId} style={{background:i%2===0?"#1a1a1a":"#141414"}}>
                          <td style={TD}><select style={{...SI,padding:"5px 10px",fontSize:13}} value={item.ingredientId} onChange={e=>updItem(item.ingredientId,"ingredientId",e.target.value)}>{ingredients.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select></td>
                          <td style={TD}><input style={{...SI,padding:"5px 10px",fontSize:13,width:150,fontFamily:"monospace"}} type="number" step="0.01" value={item.amountPerKg} onChange={e=>updItem(item.ingredientId,"amountPerKg",e.target.value)}/></td>
                          <td style={{...TD,color:"#777",fontSize:12}}>{ing?.unit||"-"}</td>
                          <td style={TD}><button style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:14,opacity:.7}} onClick={()=>updItems(recipe.items.filter(it=>it.ingredientId!==item.ingredientId))}>🗑</button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <button style={{...BSS,marginTop:12,fontSize:12,padding:"7px 14px"}} onClick={addItem}>+ เพิ่มวัตถุดิบในสูตร</button>
            </Card>

            {/* บรรจุภัณฑ์ต่อสูตร */}
            <Card>
              <CT>📦 การบรรจุภัณฑ์ของสูตรนี้</CT>
              <div style={{fontSize:12,color:"#555",marginBottom:16}}>ตั้งค่าอัตราการใช้บรรจุภัณฑ์ — ระบบจะใช้ค่านี้คำนวณอัตโนมัติเมื่อบันทึกการผลิต</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <div style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"16px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                    <span style={{fontSize:20}}>📦</span>
                    <div><div style={{fontSize:13,fontWeight:700,color:"#3db8e0"}}>ถุงฟอย</div><div style={{fontSize:11,color:"#555"}}>ต่อน้ำหนัก 1 กก.</div></div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <input type="number" min="0.01" step="0.01" value={recPack.bagsPerKg} onChange={e=>updPack("bagsPerKg",e.target.value)}
                      style={{...SI,width:100,padding:"8px 10px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:"#3db8e0",textAlign:"center"}}/>
                    <span style={{fontSize:13,color:"#777"}}>ถุง / กก.</span>
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:8}}>ผลิต 500 กก. → ใช้ <b style={{color:"#3db8e0"}}>{fmt(500*recPack.bagsPerKg,0)}</b> ถุง</div>
                </div>
                <div style={{background:"#111",border:"1px solid #222",borderRadius:10,padding:"16px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                    <span style={{fontSize:20}}>📫</span>
                    <div><div style={{fontSize:13,fontWeight:700,color:"#e09b3d"}}>กล่องลัง</div><div style={{fontSize:11,color:"#555"}}>ถุงต่อ 1 กล่อง (ปัดขึ้น)</div></div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <input type="number" min="1" step="1" value={recPack.bagsPerBox} onChange={e=>updPack("bagsPerBox",e.target.value)}
                      style={{...SI,width:100,padding:"8px 10px",fontSize:16,fontFamily:"monospace",fontWeight:700,color:"#e09b3d",textAlign:"center"}}/>
                    <span style={{fontSize:13,color:"#777"}}>ถุง / กล่อง</span>
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:8}}>ผลิต 500 กก. → ลัง <b style={{color:"#e09b3d"}}>{Math.ceil(500*recPack.bagsPerKg/recPack.bagsPerBox)}</b> ใบ</div>
                </div>
              </div>
            </Card>
          </>
        ):<Card><div style={{color:"#555",textAlign:"center",padding:40}}>เลือกสูตรจากรายการด้านซ้าย</div></Card>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  HISTORY PAGE
// ══════════════════════════════════════════════════════════════
function HistoryPage({history,onUpdate}){
  const [editId,setEditId]=useState(null);
  const [editForm,setEditForm]=useState({});

  const startEdit=(h,i)=>{
    setEditId(i);
    setEditForm({
      recipeName:h.recipeName,kg:h.kg,operator:h.operator||"",note:h.note||"",
      bags:h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,
      boxes:h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0
    });
  };

  const commitEdit=(i)=>{
    const updated=history.map((h,j)=>{
      if(j!==i)return h;
      const newDed=(h.deductions||[]).map(d=>{
        if(d.name?.includes("ถุงฟอย"))return{...d,amount:parseFloat(editForm.bags)||d.amount};
        if(d.name?.includes("กล่องลัง"))return{...d,amount:parseFloat(editForm.boxes)||d.amount};
        return d;
      });
      return{...h,recipeName:editForm.recipeName,kg:parseFloat(editForm.kg)||h.kg,operator:editForm.operator,note:editForm.note,deductions:newDed};
    });
    onUpdate(updated);setEditId(null);
  };

  const deleteEntry=(i)=>{if(!window.confirm("ลบรายการนี้?"))return;onUpdate(history.filter((_,j)=>j!==i));};

  if(!history.length)return<Card><div style={{textAlign:"center",padding:60,color:"#555"}}><div style={{fontSize:44,marginBottom:12}}>📋</div>ยังไม่มีประวัติการผลิต</div></Card>;

  return(
    <div className="fu">
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        {[{l:"Batch ทั้งหมด",v:history.length,u:"ครั้ง",c:"#7ab648"},
          {l:"ผลิตรวม",v:fmt(history.reduce((a,h)=>a+h.kg,0),0),u:"กก.",c:"#7ab648"},
          {l:"ถุงฟอย",v:fmt(history.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0),0),0),u:"ถุง",c:"#3db8e0"},
          {l:"กล่องลัง",v:fmt(history.reduce((a,h)=>a+(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0),0),0),u:"ใบ",c:"#e09b3d"},
        ].map((s,i)=>(
          <div key={i} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"12px 16px",flex:"1 1 130px"}}>
            <div style={{fontSize:10,color:"#666",marginBottom:4,textTransform:"uppercase",letterSpacing:".5px"}}>{s.l}</div>
            <div style={{fontFamily:"monospace",fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:11,color:"#555"}}>{s.u}</div>
          </div>
        ))}
      </div>

      {history.map((h,i)=>(
        <Card key={i} style={{marginBottom:10}}>
          {editId===i?(
            <div>
              <div style={{fontSize:12,color:"#ff9800",marginBottom:12,background:"#1f1200",border:"1px solid #ff980033",borderRadius:7,padding:"8px 12px"}}>
                ✏️ แก้ไขรายการประวัติ — การแก้ไขนี้<b>ไม่กระทบสต็อกปัจจุบัน</b> (ใช้สำหรับแก้ไขข้อมูลที่บันทึกผิด)
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12}}>
                <Field label="ชื่อสูตร"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.recipeName} onChange={e=>setEditForm({...editForm,recipeName:e.target.value})}/></Field>
                <Field label="น้ำหนัก (กก.)"><input style={{...SI,padding:"6px 10px",fontSize:13}} type="number" value={editForm.kg} onChange={e=>setEditForm({...editForm,kg:e.target.value})}/></Field>
                <Field label="ผู้บันทึก"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.operator} onChange={e=>setEditForm({...editForm,operator:e.target.value})}/></Field>
                <Field label="ถุงฟอย (ถุง)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#3db8e0"}} type="number" value={editForm.bags} onChange={e=>setEditForm({...editForm,bags:e.target.value})}/></Field>
                <Field label="กล่องลัง (ใบ)"><input style={{...SI,padding:"6px 10px",fontSize:13,color:"#e09b3d"}} type="number" value={editForm.boxes} onChange={e=>setEditForm({...editForm,boxes:e.target.value})}/></Field>
                <Field label="หมายเหตุ"><input style={{...SI,padding:"6px 10px",fontSize:13}} value={editForm.note} onChange={e=>setEditForm({...editForm,note:e.target.value})}/></Field>
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn style={{padding:"8px 16px",fontSize:12}} onClick={()=>commitEdit(i)}>💾 บันทึก</Btn>
                <BtnSec style={{padding:"8px 14px",fontSize:12}} onClick={()=>setEditId(null)}>ยกเลิก</BtnSec>
              </div>
            </div>
          ):(
            <div>
              <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:h.deductions?.filter(d=>d.type==="ing").length?10:0}}>
                <div style={{background:"#1d3a10",border:"1px solid #7ab64833",borderRadius:10,padding:"8px 12px",textAlign:"center",minWidth:56,flexShrink:0}}>
                  <div style={{fontFamily:"monospace",fontSize:17,fontWeight:800,color:"#7ab648",lineHeight:1}}>{fmt(h.kg,0)}</div>
                  <div style={{fontSize:10,color:"#5a8a38",marginTop:2}}>กก.</div>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:3}}>🍵 {h.recipeName}</div>
                  <div style={{fontSize:12,color:"#777"}}>📅 {h.date} · ⏰ {h.time}{h.operator&&<> · 👤 {h.operator}</>}{h.note&&<span style={{color:"#555"}}> · {h.note}</span>}</div>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                  {[{i:"📦",v:fmt(h.deductions?.find(d=>d.name?.includes("ถุงฟอย"))?.amount||0,0),l:"ถุง",c:"#3db8e0"},
                    {i:"📫",v:fmt(h.deductions?.find(d=>d.name?.includes("กล่องลัง"))?.amount||0,0),l:"ลัง",c:"#e09b3d"}].map((p,j)=>(
                    <div key={j} style={{background:"#111",border:`1px solid ${p.c}33`,borderRadius:8,padding:"5px 10px",textAlign:"center",minWidth:48}}>
                      <div style={{fontSize:10}}>{p.i}</div>
                      <div style={{fontFamily:"monospace",fontWeight:800,color:p.c,fontSize:14,lineHeight:1.2}}>{p.v}</div>
                      <div style={{fontSize:10,color:"#555"}}>{p.l}</div>
                    </div>
                  ))}
                  <button onClick={()=>startEdit(h,i)} style={{background:"#1a2a14",border:"1px solid #7ab64833",color:"#7ab648",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>✏️ แก้ไข</button>
                  <button onClick={()=>deleteEntry(i)} style={{background:"#2a1010",border:"1px solid #ff444433",color:"#ff6b6b",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🗑</button>
                </div>
              </div>
              {h.deductions?.filter(d=>d.type==="ing").length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:6,paddingTop:10,borderTop:"1px solid #1a1a1a"}}>
                  {h.deductions.filter(d=>d.type==="ing").map((d,j)=>(
                    <div key={j} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:7,padding:"4px 10px",fontSize:11}}>
                      <span style={{color:"#888"}}>{d.name}: </span>
                      <span style={{fontFamily:"monospace",color:"#ff8080",fontWeight:700}}>-{fmt(d.amount)}</span>
                      <span style={{color:"#555"}}> {d.unit}</span>
                      <span style={{color:"#3a3a3a"}}> → เหลือ {fmt(d.after)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </Card>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
